  ],
  sections: [
    { id: 'n1', title: 'Contents of a trial application (Second Schedule para 1(1))', html: '<p>Chemical and pharmaceutical information; animal pharmacology; animal toxicology; human clinical pharmacology; regulatory status in other countries; prescribing information (for marketing); quality control testing protocol; and, for multinational development, the number of sites and patients with justification. Each phase application is accompanied by the investigator\'s brochure (Third Schedule Table 7), protocol (Table 2), case record form, informed consent document (Table 3), investigator\'s undertaking (Table 4) and EC clearance if available (Table 1).</p>' },
    { id: 'n2', title: 'Relaxation of data requirements', html: '<p>Second Schedule para 1(2)(i): requirements may differ by category, for example new chemical entity, biological products or similar biologics, and by phase. Para 1(2)(ii) allows accelerated approval and expedited review for serious or life-threatening conditions, diseases of special relevance to India, unmet need, and disaster or defence use (Module 8).</p>' }
  ],
  keyPoints: ['Rule 19(2) makes the First Schedule binding on everyone involved in a trial.', 'Non-clinical methods now include cell-based assays, organ chips, computer modelling and other human biology-based methods, as well as animal studies (G.S.R. 175(E), 2023).', 'The first-in-human dose is calculated from non-clinical data.', 'Indian-discovered products start trials in India from Phase I; permission is generally given in stages.', 'Paediatric programmes usually start with adult safety data; pregnancy studies only for products intended for pregnancy, with follow-up of pregnancy, foetus and child.'],
  quiz: [
    { q: 'Which instrument added "organ chips and micro physiological systems" to the First Schedule?', options: ['G.S.R. 778(E), 2022', 'G.S.R. 175(E), 2023', 'G.S.R. 364(E), 2023', 'S.O. 553(E), 2022'], answer: 1, why: 'G.S.R. 175(E), 9 March 2023, the New Drugs and Clinical Trials (Amendment) Rules, 2023, substituted clause (b) of First Schedule para 3(1).' },
    { q: 'For a vaccine discovered in India, where must Phase I be conducted?', options: ['Anywhere', 'In India', 'In a rule 101 country', 'In India or a rule 101 country'], answer: 1, why: 'Second Schedule para 1(1)(iv)(a).' },
    { q: 'Who should preferably conduct Phase I trials?', options: ['Any registered medical practitioner', 'Investigators trained in clinical pharmacology with facilities to observe and monitor subjects closely', 'Only the sponsor\'s staff', 'Paediatricians'], answer: 1, why: 'First Schedule para 3(2)(a).' },
    { q: 'For a product intended for pregnancy, what follow-up does the First Schedule require?', options: ['None beyond delivery', 'Follow-up data on the pregnancy, foetus and child', 'Only maternal follow-up', 'Only for twelve months'], answer: 1, why: 'First Schedule para 3(3)(C)(ii), for a period appropriate for the drug.' },
    { q: 'Under the Second Schedule, how is permission for successive phases generally given?', options: ['All phases at once', 'In stages, considering data from earlier phases', 'Only after Phase III abroad', 'Only on appeal'], answer: 1, why: 'Second Schedule para 1(1)(iv)(c).' }
  ],
  tasks: [
    { id: 't0', title: 'Do the new methods count?', level: 'Apply', scenario: '<p>The reviewer\'s question in Case 1.</p>', questions: ['<b>(a)</b> Which provision recognises the cell-based assay and the computer model?', '<b>(b)</b> Do they replace animal toxicology?'], answer: '<p><b>(a)</b> First Schedule para 3(1)(b)(II), as substituted by G.S.R. 175(E) of 9 March 2023: the non-clinical testing methods to assess safety and efficacy include cell-based assays, organ chips and micro physiological systems, sophisticated computer modelling, other human biology-based methods, and animal studies. <b>(b)</b> The amendment lists them as methods; it does not by itself remove any requirement. The general requirements remain in the Second Schedule (para 3(1)(b)(I)), and the CLA judges whether the package is sufficient for safety (First Schedule para 1(3)). A pre-submission meeting (rule 98) is the place to agree what will be accepted.</p>' },
    { id: 't1', title: 'Justify the first dose', level: 'Analyse', scenario: '<p>The team proposes starting at the lowest dose that was immunogenic in rabbits, scaled by body weight.</p>', questions: ['<b>(a)</b> What does the First Schedule require?', '<b>(b)</b> What would you add to the justification?'], answer: '<p><b>(a)</b> Para 3(1)(c): the first-in-human dose should be calculated carefully based on non-clinical pharmacological and toxicological data. <b>(b)</b> The toxicology findings (no-effect levels and local tolerance at the intended dose and route), the pharmacology (dose-response), and a stated margin; then a stepwise escalation plan with safety review between steps, consistent with Phase I objectives in para 3(2)(a). Vaccine-specific dose-selection guidance is an interface topic.</p>' },
    { id: 't2', title: 'The foreign Phase I offer', level: 'Evaluate', scenario: '<p>As in Case 2.</p>', questions: ['<b>(a)</b> Can AVRI accept it?', '<b>(b)</b> What would the position be if VX-01 had been discovered abroad?'], answer: '<p><b>(a)</b> No, if the product is discovered or developed in India: Second Schedule para 1(1)(iv)(a) requires trials in India right from Phase I. <b>(b)</b> Para 1(1)(iv)(b): the foreign Phase I data are submitted; the CLA may permit a repeat Phase I or a Phase II, and Phase III concurrently with global trials. For a drug introduced for the first time in India, Phase III may be required in India before marketing permission unless exempted.</p>' },
    { id: 't3', title: 'Plan the stages', level: 'Create', scenario: '<p>VX-01 for infants.</p>', questions: ['<b>(a)</b> Outline the stages of clinical development and when each permission is sought.', '<b>(b)</b> What accompanies each phase application?'], answer: '<p><b>(a)</b> Phase I in healthy adults (safety, tolerability, dose range) → Phase II (dose and schedule, immunogenicity and short-term safety, with age de-escalation to children and then infants as safety allows) → Phase III (confirmation) → marketing permission → Phase IV. Permission is generally given in stages considering earlier data (Second Schedule para 1(1)(iv)(c)), so each phase is applied for with the data from the previous one. <b>(b)</b> Investigator\'s brochure (Third Schedule Table 7), protocol (Table 2), case record form, informed consent documents (Table 3), investigator\'s undertaking (Table 4), EC clearance if available (Table 1) (Second Schedule para 1(1)(iv)(d)).</p>' },
    { id: 't4', title: 'Age de-escalation', level: 'Apply', scenario: '<p>The paediatrician on the team wants to go straight to infants because "adults are not the target".</p>', questions: ['<b>(a)</b> What does the First Schedule say?', '<b>(b)</b> When could adult studies be skipped?'], answer: '<p><b>(a)</b> Para 3(3)(B)(ii): for diseases predominantly or exclusively affecting children, trial data should be generated in children, except initial safety and tolerability data, which will usually be obtained in adults. <b>(b)</b> When such initial adult safety studies would yield little useful information or expose adults to inappropriate risk. The reviewing EC should have paediatric expertise (para 3(3)(B)(vii)).</p>' },
    { id: 't5', title: 'Maternal immunisation', level: 'Evaluate', scenario: '<p>The later indication in pregnancy.</p>', questions: ['<b>(a)</b> Is enrolling pregnant women permissible?', '<b>(b)</b> What follow-up must be planned?'], answer: '<p><b>(a)</b> Yes, because the product is intended for use in pregnant women to protect foetuses and newborns, and data from non-pregnant women cannot answer the question (para 3(3)(C)(i)). <b>(b)</b> Follow-up of the pregnancy, foetus and child for a period appropriate for the product (para 3(3)(C)(ii)), and, where applicable, examination of excretion in human milk with monitoring of the infant. Consent documents must state possible risks to the embryo or foetus (Third Schedule Table 3).</p>' }
  ]
});

  { s: 'The CLA writes on day 25 listing deficiencies. Is the thirty-day deemed approval still available?', o: ['Yes, the clock keeps running', 'No: the CLA has communicated within the period; the applicant rectifies the deficiencies within the period the CLA specifies', 'Yes, if the deficiencies are minor', 'Only if the EC has approved'], a: 1, why: 'Deemed approval arises only "where no communication has been received" within the period. A deficiency communication is one of the dispositions rule 23 allows; the rule 22(3) route for rectification then applies.' },

  format: 'cases',
  ruleRefs: [52, 53, 54, 55, 56, 57, 58, 67, 68, 69, 70, 71, 72, 73],
  reading: [],
  essentials: `
<ul>
<li><b>Manufacture in India</b> of a new drug or IND for a clinical trial needs CLA permission: Form <b>CT-10</b> → Form <b>CT-11</b> (rules 52, 53). Decision within <b>ninety working days</b>; silence means deemed approval, recorded by filing <b>CT-11A</b> before manufacturing (rule 53, as amended in 2022).</li>
<li>CT-11 is valid three years, extendable by one year in exceptional circumstances (rule 54). It is followed by a <span class="iface">Interface</span> licence to manufacture under the Drugs and Cosmetics Rules, 1945 (rule 56).</li>
<li>Conditions (rule 55): use only for the trial or testing; small quantities, at the specified places, under Good Manufacturing Practices; records of manufacture and supply; destruction of leftover, unused, damaged, expired or sub-standard drug, with records.</li>
<li><b>Import</b> of a new drug or any related substance for a clinical trial needs a licence: Form <b>CT-16</b> → Form <b>CT-17</b> (rules 67, 68). Decision within <b>ninety days</b>. Valid three years (rule 69).</li>
<li>Import conditions (rule 70) mirror rule 55: GMP at manufacture, trial use only, records, destruction. Imported containers carry the labels in rule 73.</li>
<li>Both permissions allow inspection (rules 57, 71) and can be suspended or cancelled (rules 58, 72).</li>
</ul>`,

  sections: [
    { id: 'n1', title: 'Manufacture and import compared', html: '<table class="data"><tr><th></th><th>Manufacture for trial</th><th>Import for trial</th></tr><tr><td>Application</td><td>CT-10 (rule 52)</td><td>CT-16 (rule 67)</td></tr><tr><td>Grant</td><td>CT-11 (rule 53)</td><td>CT-17 (rule 68)</td></tr><tr><td>Clock</td><td>90 working days; deemed approval, CT-11A</td><td>90 days</td></tr><tr><td>Reconsideration</td><td>60 working days</td><td>60 days</td></tr><tr><td>Appeal</td><td>45 days</td><td>60 days</td></tr><tr><td>Validity</td><td>3 years (+1 in exceptional cases)</td><td>3 years</td></tr><tr><td>Conditions</td><td>Rule 55</td><td>Rule 70</td></tr><tr><td>Then</td><td>Licence under the 1945 Rules (rule 56)</td><td>Labelling (rule 73)</td></tr></table>' },
    { id: 'n2', title: 'Interface: manufacturing licence and GMP', html: '<p><span class="iface">Interface</span> Rule 56 requires a licence under the Act and the Drugs and Cosmetics Rules, 1945 after CT-11. Rules 55(ii) and 70(i) require Good Manufacturing Practices. The content of the licence and GMP requirements (including vaccine-specific requirements) is in the 1945 Rules and is not taught from the NDCT text.</p>' }
  ],
  keyPoints: ['Manufacture of an IND for a trial: CT-10 → CT-11 in ninety working days, deemed approval via CT-11A.', 'Then a licence under the 1945 Rules (rule 56).', 'Import of a new drug or related substance for a trial: CT-16 → CT-17 in ninety days.', 'Trial drug may not be sold or supplied elsewhere; leftovers are destroyed and recorded (rules 55, 70).', 'Imported trial material is labelled as rule 73 requires.'],
  quiz: [
    { q: 'Which form grants permission to manufacture an IND for a clinical trial?', options: ['CT-06', 'CT-11', 'CT-17', 'CT-23'], answer: 1, why: 'Rule 53.' },
    { q: 'The import licence clock under rule 68 is:', options: ['Ninety working days', 'Ninety days', 'Thirty working days', 'Sixty days'], answer: 1, why: 'Rule 68(1)(i) and (iii) say "ninety days".' },
    { q: 'How long is CT-11 valid?', options: ['Two years', 'Three years, extendable by one year in exceptional circumstances', 'Five years', 'Until the trial ends'], answer: 1, why: 'Rule 54.' },
    { q: 'What must happen to expired trial drug?', options: ['Return to the supplier', 'Destroy it and record the action', 'Donate it', 'Store it for five years'], answer: 1, why: 'Rules 55(iv) and 70(iv).' },
    { q: 'Which is NOT required on the label of imported trial material?', options: ['Name or code number', 'Batch or lot number', 'Name of the trial site institution', 'The maximum retail price'], answer: 3, why: 'Rule 73(1) lists name or code, batch or lot number, date of manufacture, use-before date, storage, the institution where the trial will be conducted, manufacturer\'s name and address, and purpose of import. Retail price is not listed.' }
  ],
  tasks: [
    { id: 't0', title: 'Will the lots be ready?', level: 'Apply', scenario: '<p>CT-10 filed 1 February 2027; Phase I planned for 1 June 2027.</p>', questions: ['<b>(a)</b> When do the ninety working days end?', '<b>(b)</b> What else must happen before vials can be released to the site?'], answer: '<p><b>(a)</b> Using the regulatory clock with no holidays entered: Monday 7 June 2027, after the planned start. With public holidays it is later. <b>(b)</b> The manufacturing licence under the 1945 Rules (rule 56), manufacture under GMP (rule 55(ii)), and the trial\'s own permission (CT-06 or CT-4A) and EC approvals. The plan should move the start date or file CT-10 earlier; a pre-submission meeting (rule 98) could clarify expectations on quality data.</p>' },
    { id: 't1', title: 'Silence on CT-10', level: 'Apply', scenario: '<p>No communication from the CLA within ninety working days.</p>', questions: ['<b>(a)</b> What may AVRI do?', '<b>(b)</b> Does deemed approval remove the need for the 1945 Rules licence?'], answer: '<p><b>(a)</b> Treat the permission as deemed granted and inform the CLA in Form CT-11A before manufacturing (rule 53(1) and (2) provisos, rule 53(2A)). <b>(b)</b> No. Rule 56 requires an application for a licence under the Act and the 1945 Rules, accompanied by the permission; with a deemed approval, the CT-11A record is what AVRI has. How the licensing authority treats it is an interface question.</p>' },
    { id: 't2', title: 'Adjuvant and comparator', level: 'Analyse', scenario: '<p>As in Case 2.</p>', questions: ['<b>(a)</b> Which needs a CT-17?', '<b>(b)</b> When must CT-16 be filed for a 1 June start?'], answer: '<p><b>(a)</b> The imported adjuvant ("any substance relating thereto", rule 67(1)). The comparator, licensed and bought in India, is not imported by AVRI, so rule 67 does not apply; its use is covered by the trial protocol and permission. <b>(b)</b> At least ninety days before it is needed, plus shipping and release time: in practice by early February 2027. There is no deemed approval for import in the consolidated text.</p>' },
    { id: 't3', title: 'A "spare" consignment', level: 'Evaluate', scenario: '<p>The supplier offers extra adjuvant free for AVRI\'s other research.</p>', questions: ['<b>(a)</b> Can it be imported under the VX-01 CT-17?', '<b>(b)</b> What records must AVRI keep?'], answer: '<p><b>(a)</b> Only for the purposes in the licence: clinical trial, BA/BE study, or examination, test and analysis (rule 70(ii)); it cannot be supplied to any other person, agency or institution. Other research use needs its own basis. <b>(b)</b> Quantity imported, used, disposed of, and related matters (rule 70(iii)); destruction of leftover, damaged, expired or sub-standard material with records (rule 70(iv)).</p>' },
    { id: 't4', title: 'Label check', level: 'Apply', scenario: '<p>Imported cartons with only the supplier\'s label.</p>', questions: ['<b>(a)</b> What must the label show?', '<b>(b)</b> May the site add or change labels?'], answer: '<p><b>(a)</b> Rule 73(1): name of the drug or code number, batch or lot number where applicable, date of manufacture, use-before date, storage conditions, name of the institution or centre where the trial is to be conducted, name and address of the manufacturer, and the purpose of import. If imported on behalf of another person, rule 73(2) adds importer and recipient details. <b>(b)</b> No one may alter, obliterate or deface any inscription or mark on an imported container, label or wrapper without the CLA\'s permission (rule 73(3)). The fix lies with the licensee at import.</p>' },
    { id: 't5', title: 'Forty missing vials', level: 'Evaluate', scenario: '<p>Reconciliation fails at Site B.</p>', questions: ['<b>(a)</b> Which conditions are at stake?', '<b>(b)</b> What can the CLA do?'], answer: '<p><b>(a)</b> Record-keeping and destruction conditions (rules 55(iii), (iv) for manufactured material; 70(iii), (iv) for imported adjuvant), and the bar on supply outside the trial (rules 55(i), 70(ii)). <b>(b)</b> After an opportunity to be heard, suspend or cancel the permission or licence (rules 58, 72); for the trial, action under rule 30 is also possible.</p>' }
  ]
});

  { s: 'The first participant is to be vaccinated on Monday. The trial is not yet on the Clinical Trial Registry of India. Can enrolment proceed?', o: ['Yes, registration can follow within thirty days', 'No: registration with CTRI is required before enrolling the first subject', 'Yes, if the EC agrees', 'Only for Phase I'], a: 1, why: 'Rule 25(v).' },

registerModule({
  id: 'm06', num: 6, part: 'Clinical development',
  title: 'Running the trial lawfully',
  book: 'Rules 25 to 30; Third Schedule',
  minutes: 150,
  pending: 'Registration of Clinical Research Organisations was proposed in draft G.S.R. 364(E), 11 May 2023. A draft is not law. If it is finally notified, the parts of this module on delegating trial tasks will be updated.',
  summary: 'The seventeen conditions that come with permission, informed consent in children and vulnerable participants, protocol changes, inspection, and what happens when things go wrong.',
  objectives: ['Apply the conditions of permission in rule 25', 'Obtain and document informed consent as the Third Schedule requires, including parents, assent and audio-video recording', 'Handle protocol amendments and deviations', 'Explain post-trial access', 'State the CLA\'s inspection and enforcement powers', 'Explain the status of the draft CRO rules'],
  format: 'cases',
  ruleRefs: [25, 26, 27, 29, 30],
  reading: [],
  essentials: `
<ul>
<li>Permission comes with conditions (rule 25). Among them: EC approval at every site; CLA told of each EC approval within <b>fifteen working days</b>; registration on the <b>Clinical Trial Registry of India before the first enrolment</b>; trial run per protocol and the GCP Guidelines; enrolment status <b>quarterly</b> (or as appropriate, whichever is earlier); <b>six-monthly</b> status on SUGAM; termination reasons within <b>thirty working days</b>; analysed SAE reports within fourteen days; compensation per Chapter VI; inspection; data integrity.</li>
<li>Permission is valid for <b>two years</b> from issue unless extended (rule 26).</li>
<li>Consent: written, informed, freely given; information verbally and in a non-technical patient information sheet; documents approved by the EC and furnished to the CLA (Third Schedule para 2). For children: written consent from a parent or legal guardian, and assent where appropriate; mature minors and adolescents sign a separate assent form.</li>
<li>An <b>audio-video recording</b> of the consent process is kept for vulnerable subjects in trials of a New Chemical Entity or New Molecular Entity (Third Schedule para 2(g)).</li>
<li>Protocol changes need prior EC and CLA approval except to remove immediate hazards or for logistic, administrative or minor changes, which are notified within thirty days (Third Schedule para 1(vi)).</li>
<li>Non-compliance can lead to warning, rejection of results, suspension or cancellation, and debarment (rule 30).</li>
</ul>`,
  story: 'VX-01 Phase II is about to start in children aged 2 to 5 years at Sites A, B and C. AVRI has hired a contract organisation for monitoring. The team builds its trial master checklist from rule 25 and the Third Schedule.',
  defs: {
    'SUGAM': 'The CDSCO online portal named in rule 25(viii) for six-monthly status reports.',
    'Clinical Trial Registry of India': 'The registry maintained by ICMR in which trials are registered before the first enrolment (rule 25(v)).',
    'legally acceptable representative': 'A person able to give consent for, or authorise, an intervention in the patient as provided by the law of India (Third Schedule para 2(c)).',
    'assent': 'A child\'s own agreement to take part, in addition to the parent\'s consent (Third Schedule para 2(e)).',
    'impartial witness': 'A person present throughout the consent process who signs the form when the subject or representative cannot read or write (Third Schedule para 2(d)).',
    'post-trial access': 'Providing the drug free of cost after the trial under the conditions in rule 27.'
  },
  explainers: [],
  cases: [
    {
      id: 'c1', title: 'The conditions of permission', aim: 'turn rule 25 into a working compliance calendar.', minutes: 50,
      need: `<p>Rule 25 is the single most important list for an investigator and sponsor. Read it whole, then sort its seventeen clauses into: before the first participant; during the trial; when something goes wrong; always.</p>
<div data-rule="25,26"></div>`,
      scenario: '<p>Site A\'s EC approves on 15 June 2027. CTRI registration is pending. The first participant is booked for 21 June.</p>',
      widgets: '<div data-widget="drill" data-set="m06"></div><div data-widget="regClock" data-set="r25iv"></div>',
      tasks: [0, 1],
      takeaway: 'Rule 25 is a calendar: approvals and registration before enrolment, routine reports during, prompt reports when things go wrong.'
    },
    {
      id: 'c2', title: 'Consent with children and vulnerable participants', aim: 'apply the Third Schedule to consent in a paediatric vaccine trial.', minutes: 55,
      need: `<p>Third Schedule para 2 sets the consent standard; Table 3 gives the checklist and format. Key points for VX-01 Phase II: parents give written consent; children are informed as fully as possible and assent where appropriate; if a parent cannot read or write, an impartial witness attends throughout and signs; changes to consent documents are EC-approved and submitted to the CLA before use.</p>
<div data-sched="third" data-find="2. Informed Consent" data-n="12" data-label="informed consent"></div>`,
      scenario: '<p>At Site C, many parents have little schooling. One mother is 17 years old. A father asks whether he will be paid and whether his child will get the vaccine after the trial if it works.</p>',
      widgets: '',
      tasks: [2, 3],
      takeaway: 'In a paediatric vaccine trial, consent is from the parent, assent from the child where appropriate, with an impartial witness for parents who cannot read, and audio-video recording where para 2(g) applies.'
    },
    {
      id: 'c3', title: 'Changes, inspections and enforcement', aim: 'handle amendments and respond to an inspection lawfully.', minutes: 45,
      need: `<p>Protocol amendments go to the CLA with the EC's approval (Third Schedule para 1(v)); deviations need prior approval except to remove immediate hazards or for minor logistic changes notified within thirty days (para 1(vi)). The CLA may inspect sponsor premises and sites, with or without notice (rules 25(xiii), 29), and act under rule 30.</p>
<div data-rule="29,30"></div><div data-inst="gsr364"></div>`,
      scenario: '<p>The contract monitor finds that Site B vaccinated three children outside the age range. A week later CDSCO inspectors arrive unannounced.</p>',
      widgets: '',
      tasks: [4, 5],
      takeaway: 'Report deviations promptly, never implement substantive changes without approval, and keep the site inspection-ready; the sponsor remains responsible whatever it delegates.'
    }
  ],
  sections: [
    { id: 'n1', title: 'Rule 25 at a glance', html: '<table class="data"><tr><th>When</th><th>Condition</th></tr><tr><td>Before start</td><td>EC approval at each site (i)–(iii); CLA informed of EC approval within 15 working days (iv); CTRI registration before first enrolment (v)</td></tr><tr><td>During</td><td>Protocol and GCP (vi); enrolment status quarterly or as appropriate (vii); six-monthly status on SUGAM (viii); data integrity (xvii)</td></tr><tr><td>When things go wrong</td><td>Termination reasons within 30 working days (ix); SAE report within 14 days (x); compensation details within 30 working days of the order (xi), (xii)</td></tr><tr><td>Always</td><td>Inspection (xiii); apply for marketing if useful (xiv); R&D laboratory deemed registered (xv); additional CLA conditions (xvi)</td></tr></table>' },
    { id: 'n2', title: 'Draft CRO rules (G.S.R. 364(E), 2023)', html: '<p>The draft would define a Clinical Research Organisation (new rule 2(1)(ia)) and insert Chapter VA (rules 38A to 38G): registration in Form CT-07B → CT-07C, decision within forty-five working days, validity five years, conditions including CTRI registration and SAE reporting, inspection and suspension. It was published for objections within fifteen days. <b>It is a draft.</b> Teach it as a proposal, and check whether a final notification has been issued.</p>' }
  ],
  keyPoints: ['Rule 25: seventeen conditions; know the clocks: 15 working days (EC approval), before first enrolment (CTRI), quarterly and six-monthly reports, 30 working days (termination), 14 days (SAE).', 'Rule 26: two-year validity of CT-06 or CT-4A, unless extended.', 'Third Schedule: written consent from the parent; assent from the child where appropriate; impartial witness if unable to read or write.', 'Audio-video recording of consent for vulnerable subjects in trials of NCEs or NMEs.', 'Protocol changes: prior approval, except immediate hazards and minor logistic changes notified within thirty days.', 'Rule 30: warning, rejection of results, suspension or cancellation, debarment.'],
  quiz: [
    { q: 'When must a trial be registered with CTRI?', options: ['Within thirty days of starting', 'Before enrolling the first subject', 'Before the final report', 'Only for Phase III'], answer: 1, why: 'Rule 25(v).' },
    { q: 'How often is the trial status report submitted on SUGAM?', options: ['Monthly', 'Quarterly', 'Six-monthly', 'Annually'], answer: 2, why: 'Rule 25(viii). Enrolment status is quarterly or as appropriate (rule 25(vii)).' },
    { q: 'Who gives written consent for a 4-year-old in VX-01 Phase II?', options: ['The child', 'The parent or legal guardian, with the child informed and assenting where appropriate', 'The investigator', 'The EC'], answer: 1, why: 'Third Schedule para 2(e)(i) and (ii).' },
    { q: 'When is an audio-video recording of the consent process required?', options: ['In every trial', 'For vulnerable subjects in trials of a New Chemical Entity or New Molecular Entity', 'Only in Phase I', 'Only on CLA request'], answer: 1, why: 'Third Schedule para 2(g). For anti-HIV and anti-leprosy drugs, audio recording only.' },
    { q: 'What is the status of G.S.R. 364(E), 2023 on CRO registration?', options: ['In force since 2023', 'A draft published for objections', 'Withdrawn', 'Part of the 2019 Rules'], answer: 1, why: 'The notification publishes "draft rules" and invites objections within fifteen days. Check whether a final notification has followed.' }
  ],
  tasks: [
    { id: 't0', title: 'The start date', level: 'Apply', scenario: '<p>EC approval 15 June 2027; CTRI pending; first participant booked 21 June.</p>', questions: ['<b>(a)</b> Can the participant be enrolled on 21 June?', '<b>(b)</b> By when must the CLA hear of the EC approval?'], answer: '<p><b>(a)</b> Only if CTRI registration is complete before enrolment (rule 25(v)), and the trial permission (CT-06 or CT-4A record) is in place (rule 19). If CTRI is still pending, postpone. <b>(b)</b> Within fifteen working days of 15 June: 6 July 2027 with no holidays (rule 25(iv)).</p>' },
    { id: 't1', title: 'Build the reporting calendar', level: 'Create', scenario: '<p>Phase II starts 1 July 2027 and runs eighteen months.</p>', questions: ['<b>(a)</b> List the routine reports and their frequency.', '<b>(b)</b> List the event-driven reports and their clocks.'], answer: '<p><b>(a)</b> Enrolment status quarterly or as appropriate to the treatment duration, whichever is earlier (rule 25(vii)); six-monthly status on SUGAM (rule 25(viii)); periodic progress reports to the EC as it requires (rule 11(ii)). <b>(b)</b> SAE: investigator within 24 hours (rule 42(1)), analysed report within 14 days (rule 25(x)); termination reasons within 30 working days (rule 25(ix)); compensation details within 30 working days of the CLA\'s order (rule 25(xi), (xii)); minor protocol changes notified within 30 days (Third Schedule para 1(vi)); EC membership changes within 30 working days (rule 12(4)).</p>' },
    { id: 't2', title: 'Consent at Site C', level: 'Apply', scenario: '<p>As in Case 2.</p>', questions: ['<b>(a)</b> How is consent obtained from parents who cannot read?', '<b>(b)</b> What about the children?', '<b>(c)</b> Is audio-video recording required?'], answer: '<p><b>(a)</b> Information given verbally and with a non-technical patient information sheet in an understandable language (para 2(a)); an impartial witness present during the entire process who signs the consent form (para 2(d)); signature or thumb impression of the parent (Table 3 format). <b>(b)</b> Children aged 2 to 5 are informed as far as possible in terms they understand (para 2(e)(i)); formal written assent is for mature minors and adolescents (para 2(e)(ii)). <b>(c)</b> Para 2(g) requires it for vulnerable subjects in trials of a New Chemical Entity or New Molecular Entity. Young children are vulnerable; whether VX-01 counts as an NME is for the CLA and the EC to settle, so the prudent course is to record and to ask at the pre-submission meeting.</p>' },
    { id: 't3', title: 'The 17-year-old mother and the father\'s questions', level: 'Evaluate', scenario: '<p>As in Case 2.</p>', questions: ['<b>(a)</b> Can the 17-year-old consent for her child?', '<b>(b)</b> How should the investigator answer the father?'], answer: '<p><b>(a)</b> The Third Schedule refers to consent from a parent or legal guardian, and a legally acceptable representative as provided by Indian law (para 2(c), (e)). Whether a minor parent can consent is a legal question beyond the Rules; the EC should decide the approach in advance and seek guidance. <b>(b)</b> Answer from the approved consent documents, which per Table 3 address payments and compensation for injury. On access after the trial, rule 27 provides free post-trial access only if the investigator recommends it and the EC approves, for an indication with no alternative therapy, with written consent. For a preventive vaccine where licensed alternatives may exist, it may not apply; do not promise it.</p>' },
    { id: 't4', title: 'Three children outside the age range', level: 'Analyse', scenario: '<p>As in Case 3.</p>', questions: ['<b>(a)</b> Is this a deviation needing prior approval?', '<b>(b)</b> What should the sponsor do now?'], answer: '<p><b>(a)</b> It is an unapproved deviation from the protocol (Third Schedule para 1(vi)); it is not a minor logistic change. <b>(b)</b> Ensure the children\'s safety and follow-up; report the deviation to the EC and CLA; assess whether any event is an SAE (24 hours and 14 days); correct the cause (retraining, eligibility checks); consider whether data from these children should be analysed separately. Rule 41(b) treats protocol violation leading to an SAE as trial-related for compensation.</p>' },
    { id: 't5', title: 'The unannounced inspection', level: 'Apply', scenario: '<p>Inspectors arrive at AVRI and Site B without notice.</p>', questions: ['<b>(a)</b> Must they be admitted?', '<b>(b)</b> What can follow if non-compliance is found?', '<b>(c)</b> Does using a contract organisation shift responsibility?'], answer: '<p><b>(a)</b> Yes: rules 25(xiii) and 29 allow entry with or without prior notice, and search and seizure of records, results, documents and investigational product. <b>(b)</b> After a show cause notice and hearing: warning, rejection of results, suspension or cancellation of permission, debarment of investigator or sponsor (rule 30(1)); appeal within sixty working days (rule 30(2)). <b>(c)</b> No. Under the Rules in force, the sponsor (rule 2(1)(hh)) and investigator remain responsible. The draft CRO rules (G.S.R. 364(E)) would add registration and conditions for CROs, but they are not in force unless finally notified.</p>' }
  ]
});

;
App.DRILLS.m07 = [
  { s: 'A 3-year-old in VX-01 Phase II has a febrile seizure 8 hours after vaccination and is admitted overnight. Within what time must the investigator report it, and to whom?', o: ['Fourteen days, to the CLA only', 'Twenty-four hours of occurrence, to the CLA, the sponsor and the EC that approved the protocol', 'Seven days, to the sponsor', 'At the next six-monthly report'], a: 1, why: 'Rule 42(1). Hospitalisation makes it an SAE (rule 2(1)(ff)). A late report must come with reasons for the delay.' },
  { s: 'Which of these would make an injury "trial related" under rule 41?', o: ['Any injury during the trial period, whatever the cause', 'An adverse effect of the investigational product, a protocol violation or negligence leading to the SAE, a trial procedure, or an effect on a child in utero from a parent\'s participation, among others', 'Only death', 'Only injuries the sponsor accepts'], a: 1, why: 'Rule 41 lists seven grounds, (a) to (g).' },
  { s: 'The child recovers fully after two days in hospital. Which Seventh Schedule formula applies if the CLA finds the SAE trial-related?', o: ['The death formula', 'The permanent disability formula', 'Compensation = 2 × W × N, linked to days of hospitalisation (reversible SAE that resolved)', 'No compensation; only medical management'], a: 2, why: 'Seventh Schedule para 2(iii), (iv): for life-threatening disease and reversible SAE that resolved, compensation is linked to days of hospitalisation, at double the minimum wage of an unskilled worker in Delhi per day.' },
  { s: 'Who pays for the child\'s medical management while it is unclear whether the seizure is related?', o: ['The family, until relatedness is decided', 'The sponsor, free, as long as the investigator thinks it is needed or until the injury is shown to be unrelated, whichever is earlier', 'The hospital', 'The EC'], a: 1, why: 'Rule 40(1). Financial compensation is in addition to medical management expenses (rule 39(3)).' },
  { s: 'A healthy 25-year-old volunteer in Phase I dies, and the CLA finds the death trial-related. What risk factor R does the Seventh Schedule assign?', o: ['0.5', '1.0', '2.0', '4.0'], a: 3, why: 'Seventh Schedule para 1: R = 4.0 for healthy volunteers or trial subjects of no risk.' }

registerModule({
  id: 'm07', num: 7, part: 'Clinical development',
  title: 'Safety reporting, medical management and compensation',
  book: 'Rules 39 to 43, 25(x) to 25(xii); Third Schedule Table 5; Seventh Schedule',
  minutes: 150,
  summary: 'What to report, to whom and how fast when something goes wrong in a vaccine trial; who pays for care; how relatedness is decided; and how compensation is calculated.',
  objectives: ['Classify an event and start the right reporting clock', 'Trace the death and injury pathways in rule 42 with every deadline', 'Apply the seven grounds of relatedness in rule 41', 'Explain free medical management (rule 40)', 'Calculate compensation with the Seventh Schedule formulae'],
  format: 'cases',
  ruleRefs: [39, 40, 41, 42, 43],
  reading: [],
  essentials: `
<ul>
<li><b>Investigator</b>: report every SAE to the CLA, the sponsor and the approving EC within <b>twenty-four hours</b> of occurrence; give reasons if late (rule 42(1)).</li>
<li><b>Analysed reports</b> within <b>fourteen days</b>: to the CLA, the EC chairperson and the institute (rule 25(x), Third Schedule Table 5); for a death, sponsor and investigator report within fourteen days of knowledge of occurrence (rule 42(2)(ii)).</li>
<li><b>EC</b>: its report and opinion on compensation within <b>thirty days</b> of receiving the report (rule 42(2)(iii), (3)(ii)).</li>
<li><b>Expert committee</b>: for deaths, always; for injuries, if the CLA chooses; recommends within <b>sixty days</b> (rule 42(2)(v), (3)(iii)).</li>
<li><b>CLA</b>: decides relatedness and quantum by order within <b>ninety days</b>; the sponsor pays within <b>thirty days</b> of the order (rule 42(2)(viii)–(ix), (3)(iv)–(v)) and reports details to the CLA within thirty working days (rule 25(xi), (xii)).</li>
<li>Relatedness: seven grounds in rule 41, including adverse effect of the product, protocol violation or negligence, trial procedures, and harm to a child in utero.</li>
<li>Free medical management by the sponsor (rule 40); compensation is <b>in addition</b> (rule 39(3)). The Seventh Schedule gives the formulae: death (B × F × R) / 99.37; disability; congenital anomaly; hospitalisation 2 × W × N.</li>
</ul>`,
  story: 'VX-01 Phase II is under way. A child has a febrile seizure and is hospitalised; later, in a separate study, a healthy adult volunteer dies of a cause that is at first unclear. The team must meet every reporting deadline and understand how compensation would be decided.',
  defs: {
    'expert committee': 'An independent committee constituted by the CLA to examine SAEs of death (and, if the CLA so decides, of injury) and recommend cause and compensation (rule 42).',
    'medical management': 'Treatment and other necessary activities for the injured subject, provided free by the sponsor (rule 40).',
    'base amount': 'B in the Seventh Schedule death formula: 8 lacs.',

    {

    {
      id: 'c2', title: 'Relatedness and the decision pathway', aim: 'trace rule 42\'s pathway and apply rule 41.', minutes: 50,
      need: `<p>For a death, the pathway always goes through an independent expert committee. For permanent disability or other injury, the CLA decides, and may constitute an expert committee where it considers it necessary. In both, the CLA decides relatedness and quantum by order within ninety days of receiving the report. Rule 41 defines what counts as trial-related.</p>
<div data-rule="39,40,41"></div>`,

    {
      id: 'c3', title: 'Calculating compensation', aim: 'apply the Seventh Schedule formulae.', minutes: 45,
      need: `<p>The Seventh Schedule has four formulae. Death: compensation = (B × F × R) / 99.37, with B = 8 lacs, F from the age table (Annexure 1) and R from 0.5 to 4.0; a fixed 2 lacs where expected mortality was 90% or more within 30 days. Permanent disability: (C × D × 90) / (100 × 100), where C is the death amount and D the percentage disability. Congenital anomaly or birth defect: half the base amount, plus medical management for correctable deformity or permanent disability. Chronic life-threatening disease and resolved reversible SAE: 2 × W × N, with W the daily minimum wage of an unskilled worker in Delhi and N the days of hospitalisation.</p>

  sections: [
    { id: 'n1', title: 'Death and injury pathways compared', html: '<table class="data"><tr><th>Step</th><th>Death (rule 42(2))</th><th>Disability or injury (rule 42(3))</th></tr><tr><td>Investigator report</td><td colspan="2">24 hours of occurrence, to CLA, sponsor, EC (42(1))</td></tr><tr><td>Sponsor and investigator analysed reports</td><td>14 days of knowledge of occurrence, to CLA and head of institution</td><td>14 days of reporting, to CLA, EC chair and head of institution</td></tr><tr><td>EC report with compensation opinion</td><td>30 days of receiving the investigator\'s report</td><td>30 days of receiving the report</td></tr><tr><td>Expert committee</td><td>Always; recommends within 60 days</td><td>If the CLA decides; within 60 days</td></tr><tr><td>CLA order</td><td>90 days of receipt of the report</td><td>90 days of receipt of the report</td></tr><tr><td>Payment</td><td colspan="2">30 days of receipt of the order</td></tr></table>' },
    { id: 'n2', title: 'Biomedical and health research', html: '<p>For research overseen by a Chapter IV committee, medical management and compensation follow the ICMR National Ethical Guidelines (rule 43). <span class="iface">Interface</span></p>' }

  keyPoints: ['Twenty-four hours (investigator report) and fourteen days (analysed report) are separate duties.', 'Deaths always go to an independent expert committee; injuries if the CLA decides.', 'The CLA orders relatedness and quantum within ninety days; payment within thirty days of the order.', 'Rule 41: seven grounds of relatedness, including harm to a child in utero.', 'Medical management is free and separate from compensation.', 'Seventh Schedule: death (B × F × R) / 99.37 with R = 4 for healthy volunteers; disability; congenital anomaly; 2 × W × N for hospitalisation.'],
  quiz: [
    { q: 'Within what time must the investigator report an SAE?', options: ['Twenty-four hours of occurrence', 'Fourteen days', 'Seven working days', 'Thirty days'], answer: 0, why: 'Rule 42(1).' },
    { q: 'Who must always examine an SAE of death?', options: ['The EC alone', 'An independent expert committee constituted by the CLA', 'The State Licencing Authority', 'The sponsor\'s safety board'], answer: 1, why: 'Rule 42(2)(i), (v).' },
    { q: 'Within how long must the CLA pass its order on compensation?', options: ['Thirty days', 'Sixty days', 'Ninety days of receipt of the report', 'One year'], answer: 2, why: 'Rule 42(2)(viii) and (3)(iv).' },
    { q: 'In the death formula, what is R for a healthy volunteer?', options: ['0.5', '1.0', '3.0', '4.0'], answer: 3, why: 'Seventh Schedule para 1, risk factor scale.' },
    { q: 'Is compensation in place of free medical management?', options: ['Yes', 'No, it is in addition to medical management expenses', 'Only for deaths', 'Only if the sponsor agrees'], answer: 1, why: 'Rule 39(3).' },

  tasks: [
    { id: 't0', title: 'Was the report on time?', level: 'Apply', scenario: '<p>Seizure at 22:00 on 2 March; report at 15:00 on 3 March.</p>', questions: ['<b>(a)</b> Was rule 42(1) met?', '<b>(b)</b> What would a late report require?'], answer: '<p><b>(a)</b> Yes: seventeen hours after occurrence, within twenty-four hours. The report must go to the CLA, the sponsor and the approving EC. <b>(b)</b> Reasons for the delay to the satisfaction of the CLA, along with the report (rule 42(1)).</p>' },
    { id: 't1', title: 'The fourteen-day report', level: 'Apply', scenario: '<p>Same event.</p>', questions: ['<b>(a)</b> By when is the analysed report due, and to whom?', '<b>(b)</b> Name four data elements it must contain.'], answer: '<p><b>(a)</b> Within fourteen days of occurrence: 16 March 2027, to the CLA, the EC chairperson and the institution (rule 25(x)). <b>(b)</b> From Table 5 of the Third Schedule, for example: patient details; the suspected drug (with dose, route and dates); other treatments; details of the SAE (description, criterion for seriousness, onset and stop dates, setting); outcome (and for a death, cause and any post-mortem findings); reporter details and the dates the event was reported to the CLA and the EC.</p>' },
    { id: 't2', title: 'Map the death pathway', level: 'Apply', scenario: '<p>Volunteer dies 2 March; sponsor and investigator know 3 March; the investigator\'s report reaches the EC and CLA on 3 March.</p>', questions: ['<b>(a)</b> Use the SAE pathway tool to list each deadline.', '<b>(b)</b> Who decides whether the death is related?'], answer: '<p><b>(a)</b> Investigator report by 3 March (24 hours); sponsor and investigator analysed reports by 17 March (14 days of knowledge); EC report and compensation opinion by 2 April (30 days of receiving the report); expert committee recommendation by 2 May (60 days); CLA order by 1 June (90 days); payment within 30 days of the order. <b>(b)</b> The CLA, considering the expert committee\'s recommendations (rule 42(2)(vii)).</p>' },
    { id: 't3', title: 'Is it related?', level: 'Evaluate', scenario: '<p>The autopsy is inconclusive. The protocol required a 30-minute observation after dosing, but the site observed for 10 minutes.</p>', questions: ['<b>(a)</b> Which grounds in rule 41 might apply?', '<b>(b)</b> What does this show about protocol adherence?'], answer: '<p><b>(a)</b> (a) adverse effect of the investigational product, if causally plausible; (b) violation of the approved protocol or negligence leading to the SAE, if the shortened observation contributed; (g) trial procedures leading to the SAE. The expert committee and CLA weigh these. <b>(b)</b> A protocol violation that leads to an SAE is itself a ground of relatedness, so deviations carry direct compensation consequences.</p>' },
    { id: 't4', title: 'Compute the death compensation', level: 'Apply', scenario: '<p>Healthy volunteer, age 25, death found trial-related.</p>', questions: ['<b>(a)</b> Compute with the compensation calculator and show the formula.', '<b>(b)</b> What would it be for a 60-year-old patient with moderate risk?'], answer: '<p><b>(a)</b> F (age 25) = 216.91, R = 4.0, B = 8,00,000. (8,00,000 × 216.91 × 4) / 99.37 = ₹69,85,126 (approximately ₹69.85 lakh). <b>(b)</b> F (age 60) = 117.41, R = 2.0: (8,00,000 × 117.41 × 2) / 99.37 = ₹18,90,470 (approximately ₹18.9 lakh). These are illustrations; the CLA decides by order.</p>' },
    { id: 't5', title: 'The seizure, if related', level: 'Apply', scenario: '<p>The child was in hospital for two days and recovered fully.</p>', questions: ['<b>(a)</b> Which formula applies?', '<b>(b)</b> What input do you need that the Rules do not give?'], answer: '<p><b>(a)</b> Reversible SAE that resolved: compensation = 2 × W × N, with N = 2 (Seventh Schedule para 2(iii), (iv)). Medical management is separately free (rule 40). <b>(b)</b> W, the minimum wage per day of an unskilled worker in Delhi; the Rules link to it but do not state it, so the current notified figure must be used.</p>' }
  ]
});

App.DRILLS.m08 = [
  { s: 'VX-01 has completed Phase I to III in India, and AVRI will manufacture it for sale. Which form, and is a fee payable?', o: ['Form CT-18, full fee', 'Form CT-21; no fee where the same applicant paid the fee for the Phase I to III trials under these Rules', 'Form CT-21, always free', 'Form CT-04 again'], a: 1, why: 'Rule 80(1) and its first proviso: no fee for an application to manufacture a new drug based on successful completion of Phase I to III in India under these Rules, where fee has already been paid by the same applicant for those trials. AVRI paid no trial fee (rule 21(2) proviso), so check the Sixth Schedule fee with that in mind.' },
  { s: 'VX-01 is an unapproved new molecule. What must the CT-21 include?', o: ['Only Phase III results', 'Data including results of local clinical trial as specified in the Second Schedule, with the data in Table 1 of the Second Schedule', 'Table 2 data only', 'No clinical data'], a: 1, why: 'Rule 80(2).' },
  { s: 'Within what period does the CLA decide on CT-21?', o: ['Thirty working days', 'Ninety working days', 'Ninety days', 'No time limit'], a: 1, why: 'Rule 81(1)(i), (ii). Permission is in Form CT-22 for an API or Form CT-23 for a formulation.' },
  { s: 'A foreign company seeks to import a vaccine approved and marketed in a rule 101 country with no major unexpected SAEs. It undertakes to do a Phase IV trial and there is no reason to expect a difference in the Indian population. What does rule 75(7) say?', o: ['A local clinical trial must always be done', 'The local clinical trial may not be required', 'The CLA must waive all clinical data', 'The import is automatically permitted'], a: 1, why: 'Rule 75(7)(i), (iii), (iv): "may not be required". "May" leaves the decision to the CLA.' },
  { s: 'The same company refuses to give the Phase IV undertaking, arguing that dengue is a disease of special relevance to India. What could happen?', o: ['The waiver applies anyway', 'The proviso to rule 75(7) lets the CLA relax "this condition" for such diseases; it is for the CLA to decide', 'The application must be rejected', 'The company may start marketing'], a: 1, why: 'Rule 75(7) proviso: the CLA may relax the condition where the drug is indicated in life-threatening or serious diseases, or diseases of special relevance to India, or for an unmet need such as XDR tuberculosis, hepatitis C, H1N1, dengue, malaria or HIV, or rare diseases, or an orphan drug.' },
  { s: 'Phase II of an epidemic vaccine shows remarkable efficacy at a defined dose for a serious, life-threatening disease with unmet need. Can marketing approval be based on Phase II?', o: ['Never', 'It may be considered by the CLA, with additional post-licensure studies as required', 'Only with a rule 101 waiver', 'Only after Phase IV'], a: 1, why: 'Second Schedule para 1(2)(ii)(A)(d).' }
];
registerModule({
  id: 'm08', num: 8, part: 'Licensure and beyond',

  summary: 'How VX-01 moves from successful trials to permission for sale: the manufacture and import routes, the data required, the local clinical trial and its waiver, and expedited pathways.',
  objectives: ['Choose between Forms CT-18 and CT-21 and the matching grant forms', 'Identify the data table in the Second Schedule for the application', 'Apply the local clinical trial waiver conditions in rules 75(7) and 80(7)', 'Describe accelerated approval and expedited review', 'State the conditions and responsibilities after permission'],
  format: 'cases',
  ruleRefs: [74, 75, 76, 77, 80, 81, 82, 83, 85, 101],
  reading: [],
  essentials: `
<ul>
<li>No import or manufacture of a new drug for sale except under the Rules (rule 74).</li>
<li><b>Manufacture</b> for sale: Form <b>CT-21</b> (rule 80) → Form <b>CT-22</b> (API) or <b>CT-23</b> (formulation) within <b>ninety working days</b> (rule 81); then a manufacturing licence under the 1945 Rules (rule 83, <span class="iface">Interface</span>).</li>
<li><b>Import</b> for sale: Form <b>CT-18</b> (rule 75) → <b>CT-19</b> (API) or <b>CT-20</b> (formulation) within ninety working days (rule 76); then an import licence under the 1945 Rules (rule 79).</li>
<li>An unapproved new molecule needs results of a <b>local clinical trial</b> and Table 1 data of the Second Schedule (rules 75(2), 80(2)).</li>
<li>The local clinical trial <b>may not be required</b> if the conditions of rule 75(7) or 80(7) are met, including approval and marketing in a country specified under rule 101 and a Phase IV undertaking. The CLA may relax a condition for serious diseases, diseases of special relevance to India, unmet needs, rare diseases or orphan drugs.</li>
<li>Second Schedule para 1(2)(ii): accelerated approval on surrogate endpoints, approval on remarkable Phase II efficacy, expedited review, and special provision for disaster or defence use.</li>
<li>After permission: approved specifications, labelling under the 1945 Rules, prescription warning, <b>PSURs</b> as per the Fifth Schedule, reporting of adverse reactions, no new claims without approval, approved cartons and inserts (rules 77, 82); market only for the approved indication (rule 85).</li>
</ul>`,
  story: 'VX-01\'s Phase III succeeded. AVRI will manufacture it at a new commercial facility. Meanwhile, a foreign company wants to import a competing vaccine approved abroad, without an Indian trial.',

    'local clinical trial': 'A clinical trial conducted in India to support permission for a new drug (rules 75, 80).',

    'Form CT-18': 'Application for permission to import a new drug for sale or distribution (rule 75).',
    'accelerated approval': 'Approval based on a surrogate endpoint reasonably likely to predict clinical benefit, with post-marketing trials to confirm it (Second Schedule para 1(2)(ii)(A)).'
  },
  explainers: [],
  cases: [
    {
      id: 'c1', title: 'From Phase III to CT-23', aim: 'prepare the manufacture-for-sale application for an Indian vaccine.', minutes: 40,
      need: `<p>Rule 80 sets the data by category: Table 1 for an unapproved new molecule, Table 2 for a drug approved as a new drug in the country, Table 3 for new claims. Rule 81 is the decision. Rule 82 lists conditions; rule 83 sends the applicant to the 1945 Rules for the manufacturing licence.</p>
<div data-rule="80,81,82,83"></div>`,
      scenario: '<p>AVRI files Form CT-21 for VX-01 (formulation) on 1 March 2029, with Phase I to III data from India.</p>',
      widgets: '<div data-widget="regClock" data-set="r81"></div><div data-widget="drill" data-set="m08"></div>',
      tasks: [0, 1],
      takeaway: 'An Indian vaccine with Indian Phase I to III data goes CT-21 → CT-23 in ninety working days, then to a manufacturing licence under the 1945 Rules.'
    },
    {
      id: 'c2', title: 'The local clinical trial and its waiver', aim: 'apply rules 75(7) and 80(7) as written.', minutes: 45,
      need: `<p>The waiver conditions are almost the same in rules 75(7) (import) and 80(7) (manufacture), but the conjunctions differ. Rule 75(7) reads: (i) approved and marketed in a rule 101 country with no major unexpected SAEs, <i>or</i> (ii) a global trial ongoing in India and approval meanwhile in a rule 101 country; <i>and</i> (iii) no population difference; <i>and</i> (iv) Phase IV undertaking. Rule 80(7) reads: (i) <i>or</i> (ii) no population difference; <i>and</i> (iii) Phase IV undertaking. Read both. Data on animal toxicology, reproduction, teratogenicity, perinatal studies, mutagenicity and carcinogenicity may also be relaxed for drugs marketed abroad for some years (rules 75(8), 80(8)).</p>
<div data-rule="75,101"></div>`,
      scenario: '<p>The foreign company\'s vaccine is approved and marketed in its home country. It says no Indian trial is needed.</p>',
      widgets: '<div data-widget="waiverCheck"></div>',
      tasks: [2, 3],
      takeaway: 'The waiver is a "may", with cumulative conditions; which countries count depends on the rule 101 order.'

    {

      need: `<p>Second Schedule para 1(2)(ii) offers routes for serious or life-threatening conditions, diseases of special relevance to India and unmet medical need: accelerated approval on surrogate endpoints with confirmatory post-marketing trials; approval on remarkable Phase II efficacy with post-licensure studies; expedited review. After any approval, rules 77 and 82 attach conditions, and rule 85 confines marketing to the approved indication.</p>
<div data-sched="second" data-find="(A) Accelerated Approval Process" data-n="18" data-label="accelerated approval and expedited review"></div>`,
      scenario: '<p>During an outbreak, a second AVRI candidate, VX-02, shows a strong neutralising antibody response in Phase II. AVRI asks whether it can be licensed on the antibody data.</p>',

  sections: [
    { id: 'n1', title: 'Which table of the Second Schedule?', html: '<table class="data"><tr><th>Application</th><th>Table</th><th>Rules</th></tr><tr><td>Unapproved new molecule</td><td>Table 1, with local clinical trial results</td><td>75(2), 80(2)</td></tr><tr><td>Approved as a new drug in the country</td><td>Table 2</td><td>75(3), 80(3)</td></tr><tr><td>New claim, indication, dosage form, route or strength</td><td>Table 3, with local clinical trial results</td><td>75(4), 80(4)</td></tr><tr><td>Fixed-dose combination</td><td>Table 1, 2 or 3</td><td>75(5), 80(5)</td></tr><tr><td>Phytopharmaceutical</td><td>Table 4</td><td>75(6), 80(6)</td></tr></table>' },
    { id: 'n2', title: 'Interface: licences under the 1945 Rules', html: '<p><span class="iface">Interface</span> After CT-19 or CT-20, an import licence under the 1945 Rules (rule 79). After CT-22 or CT-23, a manufacturing licence under the 1945 Rules (rule 83). Vaccine lot release and other requirements under the 1945 Rules are outside the NDCT text.</p>' }

  quiz: [
    { q: 'Which form grants permission to manufacture a new drug formulation for sale?', options: ['CT-11', 'CT-20', 'CT-22', 'CT-23'], answer: 3, why: 'Rule 81(1)(i): CT-22 for an API, CT-23 for a pharmaceutical formulation.' },
    { q: 'What does rule 75(7) require before a local clinical trial may be waived for an import?', options: ['Only approval in any foreign country', 'Approval and marketing in a rule 101 country (or the global-trial route), no population difference, and a Phase IV undertaking', 'A fee', 'An EC opinion'], answer: 1, why: 'Rule 75(7)(i) or (ii), and (iii), and (iv).' },
    { q: 'Accelerated approval on a surrogate endpoint requires what afterwards?', options: ['Nothing', 'Post-marketing trials to validate the anticipated clinical benefit', 'A new CT-04', 'A rule 101 order'], answer: 1, why: 'Second Schedule para 1(2)(ii)(A)(b).' },
    { q: 'Rule 85 makes the importer or manufacturer responsible for:', options: ['All off-label use', 'Marketing only for the approved indication and dosage form', 'Clinical trials abroad', 'EC registration'], answer: 1, why: 'Rule 85; the proviso protects a manufacturer that proves it did not promote off-label use.' },
    { q: 'Which provision requires PSURs after permission to manufacture for sale?', options: ['Rule 25(viii)', 'Rule 82(iv), with the Fifth Schedule', 'Rule 42', 'Rule 99'], answer: 1, why: 'Rule 82(iv) (and rule 77(iv) for imports).' }
  ],
  tasks: [
    { id: 't0', title: 'Assemble the CT-21', level: 'Apply', scenario: '<p>VX-01 as in Case 1.</p>', questions: ['<b>(a)</b> Which sub-rule and Second Schedule table apply?', '<b>(b)</b> By when should AVRI expect a decision?'], answer: '<p><b>(a)</b> Rule 80(2): an unapproved new molecule; data including results of local clinical trial as in the Second Schedule, with Table 1 data. <b>(b)</b> Within ninety working days of receipt (rule 81(1)): Thursday 5 July 2029 with no holidays entered (use the clock, adding public holidays). If deficiencies are notified, they are rectified within the period the CLA specifies and the CLA decides within ninety working days of receiving the information (rule 81(2)).</p>' },
    { id: 't1', title: 'After CT-23', level: 'Understand', scenario: '<p>Permission is granted in CT-23.</p>', questions: ['<b>(a)</b> What licence comes next?', '<b>(b)</b> List four conditions in rule 82.'], answer: '<p><b>(a)</b> A licence to manufacture for sale under the Drugs and Cosmetics Rules, 1945, applied for with the CT-23 (rule 83). <b>(b)</b> For example: conform to approved specifications; labelling per the 1945 Rules; prescription warning in a box with red background; PSURs per the Fifth Schedule; report serious unexpected adverse reactions; no new claims without approval; approved carton, label and insert before marketing; continue stability studies if shelf-life is not covered.</p>' },
    { id: 't2', title: 'Test the waiver claim', level: 'Evaluate', scenario: '<p>The foreign company\'s claim in Case 2.</p>', questions: ['<b>(a)</b> Which facts must it establish?', '<b>(b)</b> What can you not decide from the Rules alone?'], answer: '<p><b>(a)</b> Approval and marketing in a country specified under rule 101 with no major unexpected SAEs (or the global-trial route in 75(7)(ii)); no probability or evidence of a difference in the Indian population affecting pharmacokinetics, pharmacodynamics, safety or efficacy; and a written Phase IV undertaking. <b>(b)</b> Whether its home country is specified under rule 101: that depends on the CLA\'s order, which is pending in this course. Even if all conditions are met, the trial "may not be required": the CLA decides.</p>' },
    { id: 't3', title: 'Two rules, two readings', level: 'Analyse', scenario: '<p>Compare rules 75(7) and 80(7).</p>', questions: ['<b>(a)</b> What is different?', '<b>(b)</b> How should a careful applicant handle it?'], answer: '<p><b>(a)</b> Rule 75(7) has four clauses: (i) or (ii), and (iii), and (iv). Rule 80(7) has three: (i) or (ii), and (iii), where (ii) is the population-difference condition. Read literally, rule 80(7) could be met by no population difference plus the undertaking, without approval in a rule 101 country. <b>(b)</b> Do not rely on a literal reading of a drafting difference. Show all conditions, and raise the point at a pre-submission meeting (rule 98).</p>' },
    { id: 't4', title: 'Licensing on antibody data', level: 'Evaluate', scenario: '<p>VX-02 in an outbreak, as in Case 3.</p>', questions: ['<b>(a)</b> Which route in the Second Schedule fits?', '<b>(b)</b> What obligations follow?'], answer: '<p><b>(a)</b> Accelerated approval: approval based on a surrogate endpoint reasonably likely to predict clinical benefit, for a serious or life-threatening condition or a disease of special relevance to India with unmet need (para 1(2)(ii)(A)(a), (c)). If remarkable efficacy is seen at a defined dose in Phase II, approval on Phase II data may be considered (para (A)(d)). <b>(b)</b> Post-marketing trials to validate the clinical benefit (para (A)(b)) or post-licensure studies on a larger population per a CLA-approved protocol (para (A)(d)), plus the usual conditions and PSURs.</p>' },
    { id: 't5', title: 'Off-label promotion', level: 'Apply', scenario: '<p>VX-01 is approved for children aged 2 to 5. Sales staff promote it for adults.</p>', questions: ['<b>(a)</b> Which rules are breached?', '<b>(b)</b> When is the manufacturer protected?'], answer: '<p><b>(a)</b> Rule 85 (marketing only for the approved indication and dosage form) and rule 82(vi) (no claims beyond those approved without prior approval). <b>(b)</b> Under the proviso to rule 85, the manufacturer is not punished for consequences of use for another indication if it proves it was not involved in any manner in promoting that use.</p>' }
  ]
});

  format: 'cases',
  ruleRefs: [77, 82],
  reading: [],
  essentials: `
<ul>
<li>Trials study few people under controlled conditions; real-world use reveals rarer events. Every importer or manufacturer of a new drug for sale must have a <b>pharmacovigilance system</b>, run by qualified people, with a medical officer or trained pharmacist in charge (Fifth Schedule paras (1) to (4)).</li>
<li>Post-marketing assessment takes three forms: <b>(A) Phase IV trials</b>, which are trials with full protections including compensation; <b>(B) post-marketing surveillance or observational studies</b> under a CLA-approved protocol; and <b>(C) periodic safety update reports</b>.</li>
<li><b>PSURs</b>: every six months for the first two years after approval, then annually for two years; due within <b>thirty calendar days</b> of the end of each period. The CLA may extend the total duration.</li>
<li>Serious unexpected adverse reactions: within <b>fifteen days</b> of initial receipt, whatever the PSUR cycle.</li>
<li>Rules 77(iv) and 82(iv) make PSURs a condition of permission; rules 77(v) and 82(v) require reporting of adverse reactions.</li>
<li>National AEFI surveillance under immunisation programmes is <span class="iface">Interface</span>.</li>

  sections: [
    { id: 'n1', title: 'PSUR structure (Fifth Schedule para 5(C)(v))', html: '<ol type="a"><li>Title page</li><li>Introduction</li><li>Current worldwide marketing authorisation status</li><li>Actions taken in the reporting interval for safety reasons</li><li>Changes to reference safety information</li><li>Estimated patient exposure (trials, India, rest of world)</li><li>Individual case histories and tabulations</li><li>Studies</li><li>Other information: signals, risk management plan</li><li>Overall safety evaluation</li><li>Conclusion</li></ol><p>Appendix: marketing authorisation, prescribing information, ICSR line listings.</p>' }

    { q: 'A PSUR is due within:', options: ['Fifteen days', 'Thirty calendar days of the end of the reporting period', 'Ninety working days', 'Six months'], answer: 1, why: 'Fifth Schedule para 5(C)(iii).' },
    { q: 'Who may be the officer in charge of pharmacovigilance data?', options: ['A sales manager', 'A medical officer or a pharmacist trained in collection and analysis of ADR reports', 'Any graduate', 'The EC chair'], answer: 1, why: 'Fifth Schedule para (4).' },

    { id: 't0', title: 'Can AVRI hand it over?', level: 'Evaluate', scenario: '<p>As in Case 1.</p>', questions: ['<b>(a)</b> What does the Fifth Schedule require of AVRI?', '<b>(b)</b> How can it work with the programme?'], answer: '<p><b>(a)</b> A person importing or manufacturing a new drug for sale must have a pharmacovigilance system for collecting, processing and forwarding adverse drug reaction reports to the CLA, managed by qualified and trained personnel, with a medical officer or pharmacist trained in ADR data in charge (paras (3), (4)). <b>(b)</b> It can draw on programme AEFI data (an interface), but its own system must receive, assess and forward reports and produce the PSURs. Responsibility stays with the licence holder.</p>' },

    { id: 't4', title: 'The PSUR calendar', level: 'Apply', scenario: '<p>Permission 15 April 2029.</p>', questions: ['<b>(a)</b> List the six PSUR periods and due dates.', '<b>(b)</b> Can the CLA ask for more?'], answer: '<p><b>(a)</b> From the PSUR tool: 15 Apr–14 Oct 2029, due 13 Nov 2029; 15 Oct 2029–14 Apr 2030, due 14 May 2030; 15 Apr–14 Oct 2030, due 13 Nov 2030; 15 Oct 2030–14 Apr 2031, due 14 May 2031; then annual: 15 Apr 2031–14 Apr 2032, due 14 May 2032; 15 Apr 2032–14 Apr 2033, due 14 May 2033. <b>(b)</b> Yes: the CLA may extend the total duration of PSUR submission in the interest of public health (para 5(C)(iii)).</p>' },

registerModule({

  summary: 'Routes that bring an unapproved vaccine to patients outside the normal path: Government hospital imports, manufacture for named patients during trials, expedited review for disasters, and stockpiling under emergency notifications.',
  objectives: ['Apply Chapter XI to Government hospital import and named-patient manufacture', 'State the quantity, validity and reporting limits', 'Explain expedited review for disaster or defence use', 'Read S.O. 553(E) and explain what it changed and for whom'],
  format: 'cases',
  ruleRefs: [86, 87, 88, 91, 92, 93],
  reading: [],
  essentials: `
<ul>
<li><b>Government hospital import</b> (rules 86 to 90): a medical officer of a Government hospital or medical institution, certified by its head, may import a new drug approved in its country of origin but not permitted in India, for patients with a life-threatening disease, a disease causing serious permanent disability, or unmet medical need: Form <b>CT-24</b> → <b>CT-25</b>. Licence valid three years; half-yearly stock reports.</li>
<li><b>Named-patient manufacture during a trial</b> (rules 91 to 96): for a patient with a serious or life-threatening disease and no satisfactory therapy, a drug under trial in India may be made by the manufacturer, after the patient's consent and the EC's recommendation: Form <b>CT-26</b> → <b>CT-27</b>. At most one hundred average dosages per patient unless allowed; valid one year; SAEs reported within fifteen days.</li>
<li>Unapproved API for developing formulations (rules 59 to 66): Forms CT-12, CT-13 → CT-14, CT-15.</li>
<li><b>Expedited review</b> for disaster or defence use in extraordinary situations, when real-life trials may not be possible, is in Second Schedule para 1(2)(ii)(B)(ii); such approval can be used only once.</li>
<li><b>S.O. 553(E)</b> (9 February 2022), under section 26B of the Act: for COVID-19 new drugs under trial, the licence to manufacture and stock could be obtained before CT-23, deferring rule 81 permission; sale only after CT-23. It is specific to COVID-19.</li>
</ul>`,

    'Form CT-24': 'Application by a Government hospital or medical institution to import an unapproved new drug for patients (rule 86).',
    'Form CT-26': 'Application by a manufacturer to make an unapproved new drug under clinical trial for a patient with a life-threatening disease (rule 91).'
  },
  explainers: [],

    {
      id: 'c1', title: 'Access through Government hospitals', aim: 'apply Chapter XI to outbreak requests.', minutes: 35,

      widgets: '<div data-widget="drill" data-set="m10"></div>',

  sections: [
    { id: 'n1', title: 'Chapter XI at a glance', html: '<table class="data"><tr><th></th><th>Government hospital import</th><th>Named-patient manufacture</th></tr><tr><td>Who applies</td><td>Medical officer, certified by the head (CT-24)</td><td>Manufacturer, after patient consent and EC recommendation (CT-26)</td></tr><tr><td>Product</td><td>Approved in country of origin, not permitted in India</td><td>Under clinical trial in India, not approved</td></tr><tr><td>Grant</td><td>CT-25 (rule 87)</td><td>CT-27 (rule 92)</td></tr><tr><td>Validity</td><td>3 years (rule 88(i))</td><td>1 year (rule 93(i))</td></tr><tr><td>Reports</td><td>Half-yearly stock report (rule 88(vi))</td><td>Half-yearly report; SAE within 15 days (rule 93(v), (ix))</td></tr></table>' }
  ],
  keyPoints: ['Rule 86: Government hospital import of an unapproved new drug for serious conditions, CT-24 → CT-25.', 'Rule 91: named-patient manufacture of a drug under trial, after consent and EC recommendation, CT-26 → CT-27; at most one hundred average dosages per patient.', 'Expedited review for disaster or defence use is one-time (Second Schedule).', 'S.O. 553(E): COVID-19 only; licence to manufacture and stock before CT-23, sale only after CT-23.'],
  quiz: [
    { q: 'Who may apply in Form CT-24?', options: ['Any doctor', 'A medical officer of a Government hospital or medical institution, certified by its head', 'A pharmaceutical importer', 'A patient'], answer: 1, why: 'Rule 86(1).' },
    { q: 'How long is a CT-27 permission valid?', options: ['One year', 'Two years', 'Three years', 'Until the trial ends'], answer: 0, why: 'Rule 93(i).' },

  tasks: [
    { id: 't0', title: 'The ICU request', level: 'Apply', scenario: '<p>As in Case 1.</p>', questions: ['<b>(a)</b> Is CT-24 available for prevention in ICU staff?', '<b>(b)</b> What conditions follow a CT-25?'], answer: '<p><b>(a)</b> Rule 86 is for "treatment of a patient suffering from" a life-threatening disease, a disease causing serious permanent disability, or one requiring therapies for unmet medical needs. Preventive use in healthy staff does not fit its wording; that is a point to raise with the CLA. For patients it may apply. <b>(b)</b> Valid three years; half-yearly report on status and stock imported, used and destroyed; other conditions in rule 88.</p>' },
    { id: 't1', title: 'VX-02 for one patient', level: 'Apply', scenario: '<p>As in Case 1.</p>', questions: ['<b>(a)</b> List the steps in order.', '<b>(b)</b> What limits apply?'], answer: '<p><b>(a)</b> The Government hospital medical officer prescribes in special circumstances (rule 91(1)); the manufacturer obtains the patient\'s or legal heirs\' written consent and the specific recommendation of the hospital\'s EC (rule 91(2)); applies in CT-26 with the consent (rule 91(3), (4)); CLA grants CT-27 or rejects within ninety days (rule 92(1)); a licence under the 1945 Rules follows (rule 96). <b>(b)</b> Not more than one hundred average dosages per patient unless the CLA allows more (rule 92(2)); valid one year; half-yearly reports; SAEs within fifteen days (rule 93).</p>' },
    { id: 't2', title: 'Can AVRI stockpile VX-02?', level: 'Evaluate', scenario: '<p>As in Case 2.</p>', questions: ['<b>(a)</b> Does S.O. 553(E) help?', '<b>(b)</b> What would be needed?'], answer: '<p><b>(a)</b> No: it applies to new drugs for COVID-19. VX-02 targets a different virus. <b>(b)</b> A notification for the new emergency under the relevant power (S.O. 553(E) used section 26B), or production under existing permissions (for example CT-11 for trial supply, rule 55, which limits use to trials). Raise it with the CLA early.</p>' },
    { id: 't3', title: 'What S.O. 553(E) deferred', level: 'Analyse', scenario: '<p>Read the notification.</p>', questions: ['<b>(a)</b> Which NDCT requirement was deferred?', '<b>(b)</b> Which was not?'], answer: '<p><b>(a)</b> The prior permission from the CLA under rule 81 to manufacture the new drug, required before the rule 83 licence, was deferred; the licence to manufacture and stock could be granted with the CT-06 trial permission (clause (a) proviso). <b>(b)</b> The clinical trial permission (CT-06) and the CT-23 permission before sale or distribution (clause (b)).</p>' },
    { id: 't4', title: 'The defence countermeasure', level: 'Apply', scenario: '<p>As in Case 3.</p>', questions: ['<b>(a)</b> Which conditions apply?', '<b>(b)</b> Can it be approved repeatedly on this basis?'], answer: '<p><b>(a)</b> Second Schedule para 1(2)(ii)(B)(ii): preclinical data make a case for efficacy; no possibility of obtaining consent and following a protocol; no established management and a clear possible advantage. <b>(b)</b> No: such approval can be used only once; subsequent approval needs a detailed efficacy report.</p>' },
    { id: 't5', title: 'Which route?', level: 'Evaluate', scenario: '<p>Three requests: a Government hospital wants a foreign-approved vaccine for patients; a private clinic wants VX-02 for a VIP; an industry body wants VX-02 stockpiled.</p>', questions: ['<b>(a)</b> Match each to a route, or say none exists.'], answer: '<p>Government hospital: rule 86 (CT-24). Private clinic: Chapter XI applies to Government hospitals and institutions, so no route exists for it; trial enrolment or a Government hospital prescription under rule 91 are the lawful paths. Stockpiling: no general route in the Rules; S.O. 553(E) covered COVID-19 only.</p>' }

registerRef({
  id: 'glossary',
  title: 'Glossary',
  html: `<p>Terms are listed alphabetically. Where the Rules define a term, the definition is paraphrased and the clause is cited; read the exact wording in the Rule reader.</p>
<p><b>Academic clinical trial.</b> A trial of a drug already approved for a certain claim, initiated by an investigator, academic or research institution for a new indication, route, dose or dosage form, with results only for academic or research purposes (rule 2(1)(a); rule 28).</p>
<p><b>Adverse event.</b> Any untoward medical occurrence, including a symptom, disease or abnormal laboratory finding, during treatment with an investigational drug or pharmaceutical product in a patient or trial subject, that does not necessarily have a relationship with the treatment (rule 2(1)(d)).</p>
<p><b>Automatic approval.</b> The record created when an applicant under rule 23 files Form CT-4A after the CLA is silent for thirty working days (rule 23(2)).</p>
<p><b>Central Licencing Authority.</b> The Drugs Controller, India, appointed by the Central Government (rules 2(1)(i), 3).</p>
<p><b>Clinical trial.</b> A systematic study of a new drug or investigational new drug in human subjects to generate data for discovering or verifying its clinical, pharmacological or adverse effects (rule 2(1)(j)).</p>
<p><b>Clinical Trial Registry of India.</b> The registry maintained by ICMR in which a trial is registered before the first subject is enrolled (rule 25(v)).</p>
<p><b>Deemed approval.</b> Permission treated as granted when the CLA does not communicate within the period set by the rule, recorded by an intimation form such as CT-02A, CT-06A or CT-11A (inserted by G.S.R. 778(E), 2022).</p>
<p><b>Ethics Committee.</b> For a clinical trial, a committee constituted under rule 7 and registered with the CLA under rule 8; for biomedical and health research, a committee registered under rule 17.</p>
<p><b>Global clinical trial.</b> A clinical trial conducted as part of the clinical development of a drug in more than one country (rule 2(1)(q)).</p>
<p><b>Interface.</b> In this course, a requirement that the Rules hand to another instrument, such as a licence under the Drugs and Cosmetics Rules, 1945.</p>
<p><b>Investigational new drug.</b> A new chemical or biological entity or substance not approved for marketing as a drug in any country (rule 2(1)(r)).</p>
<p><b>Investigator.</b> The person responsible for conducting the clinical trial at the trial site (rule 2(1)(t)).</p>
<p><b>Local clinical trial.</b> A clinical trial in India whose results support an application for permission to import or manufacture a new drug (rules 75, 80).</p>
<p><b>New chemical entity.</b> A substance not approved for marketing as a drug by any regulatory authority, proposed to be developed as a new drug for the first time (rule 2(1)(v)).</p>
<p><b>New drug.</b> A drug in one of the five limbs of rule 2(1)(w); vaccines are in limb (v) and are always deemed new drugs.</p>
<p><b>Orphan drug.</b> A drug intended to treat a condition affecting not more than five lakh persons in India (rule 2(1)(x)).</p>
<p><b>Pharmacovigilance.</b> The science and activities relating to detection, assessment, understanding and prevention of adverse effects or other drug-related problems (rule 2(1)(z)).</p>
<p><b>Post-trial access.</b> Providing a new drug or IND to a trial subject free of cost after the trial, on the conditions in rule 27.</p>
<p><b>PSUR.</b> Periodic safety update report, submitted on the Fifth Schedule calendar after permission to market.</p>
<p><b>Serious adverse event.</b> An untoward medical occurrence during a clinical trial resulting in death, permanent disability, hospitalisation or its prolongation, persistent or significant disability or incapacity, congenital anomaly, birth defect, or a life-threatening event (rule 2(1)(ff)).</p>
<p><b>Sponsor.</b> Includes a person, company, institution or organisation responsible for initiation and management of a clinical trial (rule 2(1)(hh)).</p>
<p><b>SUGAM.</b> The CDSCO online portal used for six-monthly trial status reports (rule 25(viii)).</p>
<p><b>Trial subject.</b> A patient or a healthy person to whom an investigational product is administered for the purposes of a clinical trial (rule 2(1)(jj)).</p>
<p><b>Working days.</b> Used for many clocks in the Rules but not defined in them. The course counts Monday to Friday, excluding public holidays you enter, and does not count the day of receipt.</p>`
});
