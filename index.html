<style>

:root {

  --f-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --surface: #171717; --ink: #EDEBE8; --muted: #B4B0AC; --line: #2E2E2E; --line2: #232323;
    --accent: #EC8B78; --accent-ink: #1C1214; --accent-soft: #3A2421; --plot: #141414;
    --c1: #EC8B78; --c2: #F5A04A; --c3: #9AAED6; --c4: #F2C46A;
    --good: #5fd18f; --good-soft: #14281d; --bad: #ff8f86; --bad-soft: #301917; --warn: #f0c36a; --warn-soft: #2d2411;
    --mch: #62d1c2; --mch-soft: #10262a; --book: #b9a8f0; --book-soft: #221d36; --eg: #aab7d6; --eg-soft: #1a2030;
    --hl: #6b5a14; --hl-ink: #f3ecd0;
    --chrome: #0C0C0C; --active: #2A2A2A;
    --learn: #9AAED6; --practise: #F5A04A; --check: #F2C46A; --answer: #EC8B78;

  }
}

  --bg: #111111; --surface: #171717; --ink: #EDEBE8; --muted: #B4B0AC; --line: #2E2E2E; --line2: #232323;
  --accent: #EC8B78; --accent-ink: #1C1214; --accent-soft: #3A2421; --plot: #141414;
  --c1: #EC8B78; --c2: #F5A04A; --c3: #9AAED6; --c4: #F2C46A;
  --good: #5fd18f; --good-soft: #14281d; --bad: #ff8f86; --bad-soft: #301917; --warn: #f0c36a; --warn-soft: #2d2411;
  --mch: #62d1c2; --mch-soft: #10262a; --book: #b9a8f0; --book-soft: #221d36; --eg: #aab7d6; --eg-soft: #1a2030;
  --hl: #6b5a14; --hl-ink: #f3ecd0;
  --chrome: #0C0C0C; --active: #2A2A2A;
  --learn: #9AAED6; --practise: #F5A04A; --check: #F2C46A; --answer: #EC8B78;
  --obs: #EDEBE8; --pred: #B3A6F2; --err: #FF7A6E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--chrome); color: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--f-body); font-size: 16px; line-height: 1.62; margin: 0; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* shell */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto; background: var(--chrome); padding: 18px 14px 28px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: block; text-decoration: none; color: var(--ink); padding: 2px 6px 14px; margin-bottom: 6px; }
.brand b { font-family: var(--f-head); font-size: 19px; font-weight: 400; line-height: 1.2; display: block; }
.brand span { font-size: 12.5px; color: var(--muted); }
.navgrp { margin: 22px 0 4px; padding: 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.nav a { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: baseline; gap: 4px; padding: 6px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.35; }
.nav a:hover { background: var(--line2); } .nav a { border-radius: 8px; }
.nav a[aria-current="page"] { background: var(--active); color: var(--ink); font-weight: 500; }
.nav .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.nav .dn { color: var(--good); font-size: 12px; text-align: right; }
.main { padding: 32px max(20px, env(safe-area-inset-right, 0px)) 80px 40px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); }
.col { max-width: 780px; margin: 0 auto; min-width: 0; }
.topbar { display: none; }

@media (max-width: 900px) {
  .shell { display: block; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--chrome); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); }
  .topbar b { font-family: var(--f-head); font-size: 16px; }
  .rail { display: none; position: fixed; z-index: 25; inset: 0; top: calc(48px + env(safe-area-inset-top, 0px)); height: auto; width: auto; border-right: 0; }
  .rail.open { display: block; }
  .main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 70px max(16px, env(safe-area-inset-left, 0px)); margin: 0; border: 0; border-radius: 0; min-height: 0; }
  body { background: var(--surface); }
}
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; line-height: 1.3; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* headings and prose */
.eyebrow { font-size: 14px; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
h1 { font-family: var(--f-head); font-weight: 400; font-size: clamp(27px, 4.4vw, 38px); line-height: 1.16; margin: 0 0 10px; text-wrap: balance; }

h3 { font-size: 17.5px; margin: 24px 0 6px; line-height: 1.3; }
h4 { font-size: 15px; margin: 18px 0 4px; }
p { margin: 0 0 13px; } ul, ol { margin: 0 0 13px; padding-left: 22px; } li { margin-bottom: 4px; }
.lede { color: var(--muted); font-size: 17px; margin-bottom: 16px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--muted); margin: 10px 0 22px; }
.meta b { color: var(--ink); font-weight: 500; }
.sec { padding: 26px 0 8px; border-top: 1px solid var(--line); margin-top: 18px; }
.sec:first-of-type { border-top: 0; }
.sec > p, .sec > ul, .sec > ol { max-width: 68ch; }
.src { font-size: 12.5px; color: var(--muted); font-family: var(--f-mono); margin-top: -4px; }
code, .m { font-family: var(--f-mono); font-size: .9em; }
code { background: var(--line2); padding: 1px 5px; border-radius: 4px; }
.m { white-space: nowrap; }
.formula { font-family: var(--f-mono); font-size: 14.5px; background: var(--bg); border: 0; padding: 10px 14px; margin: 12px 0 16px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.callout { border: 0; border-radius: 10px; padding: 13px 16px 5px; margin: 16px 0 18px; background: var(--bg); }
.callout > b:first-child { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.callout.key { background: var(--bg); } .callout.key > b:first-child { color: var(--ink); }
.callout.warn { background: var(--bad-soft); } .callout.warn > b:first-child { color: var(--bad); }
.callout.mch { background: var(--mch-soft); } .callout.mch > b:first-child { color: var(--mch); }
.callout.book { background: var(--book-soft); } .callout.book > b:first-child { color: var(--book); }
.callout.eg { background: var(--eg-soft); } .callout.eg > b:first-child { color: var(--eg); }
.tw { overflow-x: auto; margin: 12px 0 16px; max-width: 100%; }
table { border-collapse: collapse; font-size: 14.5px; }
table.data { min-width: 60%; } table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.data th { font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid var(--line); background: var(--surface); }
table.data td.r, table.data th.r { text-align: right; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
[data-live] { font-family: var(--f-mono); font-size: .92em; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; white-space: nowrap; }
ul.try { list-style: none; padding: 10px 14px; margin: 0 0 18px; border: 1px dashed var(--line); border-radius: 4px; background: var(--surface); }
ul.try::before { content: "Try this"; display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
ul.try li { position: relative; padding-left: 16px; } ul.try li::before { content: "\2192"; position: absolute; left: 0; color: var(--accent); }
figure { margin: 14px 0; overflow-x: auto; }

/* widgets */
.wg { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 18px 0 10px; overflow: hidden; }
.wg-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; background: var(--line2); border-bottom: 1px solid var(--line); }
.wg-h b { font-size: 14px; color: var(--muted); }
.wg-c { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 18px; padding: 12px 14px 4px; }
.ctl { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13.5px; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
.ctl label output { color: var(--ink); font-family: var(--f-mono); font-size: 13px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.ctl select, .ctl input[type=number], .ctl input[type=text], .ctl input[type=search] { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 5px 8px; min-width: 0; width: 100%; }
.ctl.chk { flex-direction: row; align-items: center; gap: 8px; padding-top: 18px; } .ctl.chk label { color: var(--ink); }
.wg-b { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 10px; align-items: center; }
.wg-o { padding: 6px 14px 14px; min-width: 0; }
.wg-o .note { font-size: 13.5px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin: 10px 0; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--bg); }
.stat small { display: block; font-size: 13px; color: var(--muted); }
.stat b { font-family: var(--f-mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.verdict { padding: 8px 12px; border-radius: 5px; background: var(--accent-soft); font-size: 14.5px; margin: 8px 0; }
.verdict.bad { background: var(--bad-soft); } .verdict.good { background: var(--good-soft); } .verdict.warn { background: var(--warn-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; align-items: start; }
.ax { font-size: 11px; fill: var(--muted); font-family: var(--f-body); } .axl { font-size: 12px; fill: var(--ink); font-family: var(--f-body); } .axt { font-size: 13px; fill: var(--ink); font-weight: 600; font-family: var(--f-body); }
.prog { height: 6px; background: var(--line2); border-radius: 3px; overflow: hidden; margin: 6px 0; } .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.hbars .hb { display: grid; grid-template-columns: 130px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 13px; margin: 2px 0; }
.hbt { height: 10px; background: var(--line2); border-radius: 2px; overflow: hidden; } .hbt i { display: block; height: 100%; background: var(--c1); } .hbv { font-family: var(--f-mono); text-align: right; }
.hbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl-s { font-size: 13px; } .tbl-s td, .tbl-s th { padding: 4px 8px; }
.scroll { overflow: auto; max-height: 340px; border: 1px solid var(--line); border-radius: 5px; }

/* quiz and tasks */
.q { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 16px 10px; margin: 12px 0; }
.q .qt { font-weight: 600; margin-bottom: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 12px; margin: 6px 0; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--f-mono); color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.why { margin-top: 8px; padding: 8px 12px; background: var(--bg); font-size: 14.5px; border-radius: 8px; }
.task { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px 18px 8px; margin: 14px 0; }
.task h3 { margin-top: 0; } .lvl { display: inline-block; font-size: 12.5px; background: var(--line2); border-radius: 10px; padding: 1px 9px; color: var(--muted); font-weight: 600; margin-left: 6px; vertical-align: middle; }
details.ans { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 10px 0; }
details.ans > summary { cursor: pointer; padding: 10px 16px; font-weight: 600; } details.ans[open] > summary { border-bottom: 1px solid var(--line); }
details.ans > div { padding: 12px 18px 4px; }
.kp li { margin-bottom: 6px; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin: 12px 0 26px; }
.card { display: block; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card small { color: var(--muted); font-size: 12.5px; display: block; } .card b { display: block; font-size: 15px; line-height: 1.3; margin: 2px 0; } .card span { font-size: 13.5px; color: var(--muted); }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 12px; margin: 6px 0 14px; }
.gl p { padding: 4px 0; border-bottom: 1px solid var(--line2); margin: 0; }
.foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 70ch; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 36px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .prog i { transition: none; } }
@media (max-width: 700px) { table.data { display: block; overflow-x: auto; max-width: 100%; } }
@media (max-width: 700px) { .m { white-space: normal; overflow-wrap: anywhere; } }

/* ===== accounts, annotation, instructor tools ===== */
.acct { display: grid; gap: 3px; padding: 10px 6px 12px; border-bottom: 1px solid var(--line2); margin-bottom: 8px; font-size: 13px; }
.acct small { color: var(--muted); font-size: 12px; } .acct .acts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.acct a:not(.btn) { color: var(--accent); } .acct .btn { justify-self: start; } .edtog { font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.nav a.lk { opacity: .55; } .nav .dn { font-size: 11px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
.tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.form { display: grid; gap: 12px; max-width: 460px; margin: 10px 0 18px; }
.form label, .myans label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.form input[type=text], .form input[type=email], .form input[type=password], .form input[type=date], .form textarea, .form select, .myans textarea, .note-card textarea, select#lsel {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
select#lsel { width: auto; max-width: 100%; }
.form input:focus, .form textarea:focus, .myans textarea:focus, .note-card textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.form .chk { display: flex; gap: 8px; align-items: flex-start; } .form .chk input { margin-top: 4px; }
.msg { margin: 0; font-size: 13.5px; min-height: 1.2em; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--good); }
.card-plain { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 16px; margin: 12px 0; }
.myans { margin: 12px 0 14px; } .myans label { font-weight: 600; color: var(--ink); } .myans label .sv, .note-card .sv { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 8px; }
.myans textarea, .note-card textarea { resize: vertical; line-height: 1.5; }
.note-card { border-left: 3px solid var(--c2); background: var(--surface); border-radius: 0 6px 6px 0; padding: 8px 12px 8px; margin: 8px 0 14px; max-width: 70ch; }
.note-card .nq { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-style: italic; } .note-card .nf { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.fb { border-left: 3px solid var(--good); background: var(--good-soft); border-radius: 0 6px 6px 0; padding: 6px 12px; margin: 8px 0; } .fb p { margin: 4px 0; } .fb small { color: var(--muted); }
mark.hl { background: var(--hl); color: var(--hl-ink); border-radius: 2px; padding: 0 1px; }
.seltb { position: fixed; z-index: 60; display: flex; gap: 2px; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }

/* ===== narrated explainers ===== */
.exp { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 18px 0 22px; overflow: hidden; outline-offset: 3px; }

.exh b { font-family: var(--f-head); font-weight: 400; font-size: 22px; line-height: 1.2; flex: 1 1 auto; }
.exh .exlen { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.exstage { background: var(--plot); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); aspect-ratio: 560 / 300; max-width: 100%; position: relative; }
.exstage svg { display: block; width: 100%; height: 100%; }
.exstage svg text { fill: var(--ink); font-family: var(--f-body); font-size: 15px; }
.exstage svg .ts { fill: var(--muted); font-size: 13px; }

.exstage .obs { stroke: var(--obs); } .exstage .pred { stroke: var(--pred); stroke-dasharray: 7 5; } .exstage .err { stroke: var(--err); }
.exstage .fobs { fill: var(--obs); } .exstage .fpred { fill: var(--pred); } .exstage .ferr { fill: var(--err); } .exstage .fmuted { fill: var(--muted); } .exstage .fline { fill: var(--line); }
.exstage .ex-in { opacity: 0; animation: exIn calc(.6s / var(--spd, 1)) ease-out forwards; animation-delay: calc(var(--d, 0s) / var(--spd, 1)); }
.exstage .ex-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: exDraw calc(var(--t, 1.4s) / var(--spd, 1)) ease-in-out forwards; animation-delay: calc(var(--d, 0s) / var(--spd, 1)); }
.exstage .ex-grow { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: exGrow calc(var(--t, .9s) / var(--spd, 1)) ease-out forwards; animation-delay: calc(var(--d, 0s) / var(--spd, 1)); }
@keyframes exIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes exDraw { to { stroke-dashoffset: 0; } }
@keyframes exGrow { to { transform: scaleY(1); } }
.exp.paused .exstage * { animation-play-state: paused; }
@media (prefers-reduced-motion: reduce) { .exstage .ex-in, .exstage .ex-draw, .exstage .ex-grow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } }
.excap { margin: 0; padding: 12px 16px; min-height: 4.4em; font-size: 16px; line-height: 1.5; max-width: none; }

/* ===== tap definitions ===== */

dfn[data-def]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.defpop { display: block; margin: 6px 0 8px; padding: 8px 12px; border-left: 3px solid var(--pred); background: var(--surface); border-radius: 0 6px 6px 0; font-size: 14px; line-height: 1.45; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
li > .defpop, p > .defpop { display: block; }

/* ===== visual code ===== */

.sw { display: inline-block; width: 28px; height: 0; border-top: 3px solid var(--obs); }
.sw.pred { border-top: 3px dashed var(--pred); } .sw.err { border-top-color: var(--err); }

/* Minimal SVG chart helper. Colours come from CSS variables so both themes work. */
var Chart = {};
Chart.NS = 'http://www.w3.org/2000/svg';
Chart.nice = function (lo, hi, n) {

Chart.fmtTick = function (v, step) { var d = step >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(step))); return v.toFixed(d); };

Chart.color = function (c) { return { a: 'var(--c1)', b: 'var(--c2)', c: 'var(--c3)', d: 'var(--c4)', ink: 'var(--ink)', muted: 'var(--muted)', obs: 'var(--obs)', pred: 'var(--pred)', err: 'var(--err)' }[c] || c || 'var(--c1)'; };

App.pageHome = function () {
  var mods = App.mods_sorted(), done = mods.filter(function (m) { return App.prog.done[m.id]; }).length;
  var h = '<p class="eyebrow">Self-study course for clinical researchers</p><h1>Regulating vaccine clinical development in India</h1>' +
    '<p class="lede">How a vaccine moves from the laboratory to licensure under the New Drugs and Clinical Trials Rules, 2019: who decides, which form goes where, how the clock runs, and what you owe trial participants. Read from the Rules themselves.</p>' +
    '<div class="callout key"><b>How the course works</b><p>Each module follows one fictional vaccine, VX-01, through one stage of its regulatory life. You read the rule that decides the question, use a tool (a timeline calculator, a form finder, a decision tree) to apply it, and then make the call yourself in short case tasks. Each module ends with a quiz, and worked answers are kept in a separate step so that you attempt the tasks first.</p></div>' +
    '<p>The primary source is the CDSCO consolidated text of the <b>New Drugs and Clinical Trials Rules, 2019</b> [G.S.R. 227(E), 19 March 2019], as amended up to G.S.R. 778(E), 14 October 2022. Every rule the course cites can be read verbatim in the <a href="#rules">Rule reader</a>. Where the Rules hand over to other instruments (manufacturing licences, GMP, lot release), the course says so and names the instrument.</p>' +
    '<div class="callout warn"><b>Currency</b><p>Instruments issued after October 2022 are not in the consolidated text. Modules that may be affected carry a <b>Pending update</b> notice. See <a href="#sources">Sources and currency</a>. This course is for teaching; it is not legal or regulatory advice on a specific product.</p></div>' +
    App.CODE_HTML +
    '<p><b>Niyam</b>, the study assistant, explains a passage, gives an example or quizzes you on it: select text in a module, or press <b>Ask Niyam</b>. Niyam is an AI and can make mistakes; the text of the Rules is the authority. It is switched off during the quiz.</p>';
  h += '<div class="prog" aria-hidden="true"><i style="width:' + (100 * done / mods.length).toFixed(0) + '%"></i></div><p class="num" style="color:var(--muted);font-size:14px">' + done + ' of ' + mods.length + ' modules marked complete.</p>';
  h += '<h3>Start where you are</h3><div class="home-grid">';
  h += App.homeBanner();
  var m0 = App.byId.m00;
  if (m0) h += '<a class="card" href="#m00"><small>Start here</small><b>Module 0: ' + m0.title + '</b><span>' + m0.summary + '</span></a>';
  h += '<a class="card" href="#rules"><small>Primary source</small><b>Rule reader</b><span>All 107 rules and the First to Seventh Schedules, verbatim and searchable, with amendment notes.</span></a>';
  h += '<a class="card" href="#forms"><small>Tool</small><b>Form navigator</b><span>Every CT form: what it is for, which rule governs it, and what comes next.</span></a>';
  h += '<a class="card" href="#mastery"><small>Self-test</small><b>Mastery check</b><span>A mixed quiz drawn from every module, with a list of modules to revisit.</span></a></div>';
  [['Foundations', 'Foundations'], ['Clinical development', 'Clinical development: permission, supply, conduct and safety'], ['Licensure and beyond', 'Licensure and beyond']].forEach(function (g) {
    var list = mods.filter(function (m) { return m.part === g[0] && m.id !== 'm00'; }); if (!list.length) return;
    h += '<h3>' + g[1] + '</h3><div class="home-grid">';
    list.forEach(function (m) { h += '<a class="card" href="#' + m.id + '"><small>Module ' + App.modLabel(m) + ' · ~' + m.minutes + ' min' + (m.pending ? ' · pending update' : '') + (App.lockInfo(m) ? ' · locked' : (App.prog.done[m.id] ? ' · done' : '')) + '</small><b>' + m.title + '</b><span>' + m.summary + '</span></a>'; });
    h += '</div>';
  });
  var cap = App.byId.cap; if (cap) h += '<h3>Capstone</h3><div class="home-grid"><a class="card" href="#cap"><small>Guided project</small><b>' + cap.title + '</b><span>' + cap.summary + '</span></a></div>';
  return { html: h };
};
App.pageAbout = function () {
  return { html: '<p class="eyebrow">About</p><h1>About this course</h1>' +
    '<h3>Purpose and audience</h3><p>The course is for PhD scholars and early-career investigators who will design, run or support vaccine trials in India. It assumes basic clinical research methods and awareness of Good Clinical Practice. No prior regulatory knowledge is needed.</p>' +
    '<h3>Course instructor</h3><p>Dr Ramachandran Thiruvengadam, MD, DCH, PhD, Associate Professor, Maternal and Child Health Programme, BRIC-Translational Health Science and Technology Institute (BRIC-THSTI), Faridabad.</p>' +
    '<h3>Source and scope</h3><p>The course is built on one primary instrument: the New Drugs and Clinical Trials Rules, 2019, made by the Central Government under sections 12 and 33 of the Drugs and Cosmetics Act, 1940 [G.S.R. 227(E), 19 March 2019]. The text used is the CDSCO consolidated copy, as amended vide G.S.R. 778(E), 14 October 2022. Rule numbers, timelines and forms are taken from that text and can be read verbatim in the Rule reader. No secondary commentary is used.</p>' +
    '<p>The Rules contain no chapter on vaccines. A vaccine is a new drug under rule 2(1)(w)(v) and is always deemed to be one, so it follows the full pathway. Topics that the Rules hand to other instruments, such as the manufacturing licence, Good Manufacturing Practice and lot release under the Drugs and Cosmetics Rules, 1945, the Good Clinical Practices Guidelines and the ICMR National Ethical Guidelines, are marked <b>Interface</b> and are not taught from the NDCT text.</p>' +
    '<h3>Currency</h3><p>Instruments issued after October 2022 are listed on the <a href="#sources">Sources and currency</a> page with their status. Modules that may be affected carry a Pending update notice until the instrument has been reviewed.</p>' +
    '<h3>The case</h3><p>VX-01, the institute that develops it, its trial sites and its participants are fictional. Any resemblance to a real product or study is coincidental. No participant data are used anywhere.</p>' +
    '<h3>Limits</h3><p>This course teaches how the Rules work. It is not legal advice, and it does not replace reading the current instrument, consulting the regulator (for example through a pre-submission meeting under rule 98), or institutional regulatory support.</p>' };
};
App.pageRef = function (id) { var r = App.refs[id]; return { html: '<p class="eyebrow">Reference</p><h1>' + r.title + '</h1>' + (id === 'glossary' ? '<input class="search" id="gsearch" type="search" placeholder="Search terms" aria-label="Search glossary">' : '') + '<div class="' + (id === 'glossary' ? 'gl' : '') + '" id="refbody">' + r.html + '</div>', after: function (root) {
  var s = root.querySelector('#gsearch'); if (!s) return;

} }; };

and Ethics Committee."]}, {"n": 2, "title": "Definitions", "chapter": "I", "paras": ["(1) In these rules, unless the context otherwise requires,—", "(a) \"academic clinical trial\" means a clinical trial of a drug already approved for a certain claim and initiated by any investigator, academic or research institution for a new indication or new route of administration or new dose or new dosage form, where the results of such a trial are intended to be used only for academic or research purposes and not for seeking approval of the Central Licencing Authority or regulatory authority of any country for marketing or commercial purpose;", "(b) \"Act\" means the Drugs and Cosmetics Act, 1940 (23 of 1940);", "(c) \" active pharmaceutical ingredient\" means any substance which can be used in a pharmaceutical formulation with the intention to provide pharmacological activity; or to otherwise have direct effect in the diagnosis, cure, mitigation, treatment or prevention of disease; or to have direct effect in restoring, correcting or modifying physiological functions in human beings or animals;", "(d) \"adverse event\" means any untoward medical occurrence (including a symptom or disease or an abnormal laboratory finding) during treatment with an investigational drug or a pharmaceutical product in a patient or a trial subject that does not necessarily have a relationship with the treatment being given;", "(e) \"bioavailability study\" means a study to assess the rate and extent to which the drug is absorbed from a pharmaceutical formulation and becomes available in the systemic circulation or availability of the drug at the site of action;", "(f) \"bioequivalence study\" means a study to establish the absence of a statistically significant difference in the rate and extent of absorption of an active ingredient from a pharmaceutical formulation in comparison to the reference formulation having the same active ingredient when administered in the same molar dose under similar conditions;", "(g) \"Bioavailability and bioequivalence study centre\" means a centre created or established to undertake bioavailability study or bioequivalence study of a drug for 2[either clinical part or analytical part or for both] clinical and analytical part of such study;", "(h) \"biomedical and health research\" means research including studies on basic, applied and operational research or clinical research, designed primarily to increase scientific knowledge about diseases and conditions (physical or socio-behavioural); their detection and cause; and evolving strategies for health promotion, prevention, or amelioration of disease and rehabilitation but does not include clinical trial as defined in clause (j);", "(i) \"Central Licencing Authority\" means the Drugs Controller, India as referred to in rule 3;", "(j) \"clinical trial\" in relation to a new drug or investigational new drug means any systematic study of such new drug or investigational new drug in human subjects to generate data for discovering or verifying its,—", "(i) clinical or;", "(ii) pharmacological including pharmacodynamics, pharmacokinetics or;", "(iii) adverse effects,", "with the objective of determining the safety, efficacy or tolerance of such drug or investigational new drug;", "(k) \"clinical trial protocol\" means a document containing the background, objective, rationale, design, methodology including matters concerning performance, management, conduct, analysis, adverse event, withdrawal, statistical consideration and record keeping pertaining to clinical trial;", "(1) \"clinical trial site\" means any hospital or institute or any other clinical establishment having the required facilities to conduct a clinical trial;", "<sup>3</sup>[(la) \"Designated Registration Authority\" means the authority designated under sub-rule (1) of rule 17;]", "(m) \"efficacy\" in relation to a drug means its ability to achieve the desired effect in a controlled clinical setting;", "(n) \"effectiveness\" in relation to a drug means its ability to achieve the desired effect in a real world clinical situation after approval of the drug;", "(o) \"Ethics Committee\" means, for the purpose of,—", "(i) clinical trial, Ethics Committee, constituted under rule 7 and registered under rule 8;", "(ii) biomedical and health research, Ethics Committee, constituted under ^ rule 16 and registered under rule 17;", "(p) \"Good Clinical Practices Guidelines\" means the Good Clinical Practices Guidelines for conduct of clinical studies in India, formulated by the Central Drugs Standard Control Organisation and adopted by the Drugs Technical Advisory Board;", "(q) \"global clinical trial\" means any clinical trial which is conducted as part of a clinical development of a drug in more than one country;", "(r) \"investigational new drug\" means a new chemical or biological entity or substance that has not been approved for marketing as a drug in any country;", "(s) \"investigational product\" means the pharmaceutical formulation of an active ingredient or placebo being tested or used in a clinical trial;", "(t) \"investigator\" means a person who is responsible for conducting clinical trial at the clinical trial site;", "(u) \"medical management\" means treatment and other necessary activities for providing the medical care to complement the treatment;", "(v) \"new chemical entity\" means any substance that has not been approved for marketing as a drug by a drug regulatory authority of any country including the authorities specified under these rules and is proposed to be developed as a new drug for the first time by establishing its safety and efficacy;", "(w) \"new drug\" means,—", "(i) a drug, including active pharmaceutical ingredient or phytopharmaceutical drug, which has not been used in the country to any significant extent, except in accordance with the provisions of the Act and the rules made thereunder, as per conditions specified in the labelling thereof and has not been approved as safe and efficacious by the Central Licencing Authority with respect to its claims; or", "(ii) a drug approved by the Central Licencing Authority for certain claims and proposed to be marketed with modified or new claims including indication, route of administration, dosage and dosage form; or", "(iii) a fixed dose combination of two or more drugs, approved separately for certain claims and proposed to be combined for the first time in a fixed ratio, or where the ratio of ingredients in an approved combination is proposed to be changed with certain claims including indication, route of administration, dosage and dosage form; or", "(iv) a modified or sustained release form of a drug or novel drug delivery system of any drug approved by the Central Licencing Authority; or", "(v) a vaccine, recombinant Deoxyribonucleic Acid (r-DNA) derived product, living modified organism, monoclonal anti-body, 4[cell or stem cell derived product], gene therapeutic product or xenografts, intended to be used as drug;", "Explanation : The drugs, other than drugs referred to in sub-clauses (iv) and", "(v), shall continue to be new drugs for a period of four years from the date of their permission granted by the Central Licencing Authority and the drugs referred to in sub-clauses (iv) and (v) shall always be deemed to be new drugs;", "(x) \"orphan drug\" means a drug intended to treat a condition which affects not more than five lakh persons in India;", "(y) \"pharmaceutical formulation\" means any preparation for human or veterinary use containing one or more active pharmaceutical ingredients, with or without pharmaceutical excipients or additives, that is formulated to produce a specific physical form, such as, tablet, capsule or solution, suitable for administration to human or animals;", "(z) \"pharmacovigilance\" means the science and activities relating to detection, assessment, understanding and prevention of adverse effects or any other drug- related problem;", "(aa) \"phytopharmaceutical drug\" means a drug of purified and standardised fraction, assessed qualitatively and quantitatively with defined minimum four bio-active or phytochemical compounds of an extract of a medicinal plant or its part, for internal or external use on human beings or animals, for diagnosis, treatment, mitigation or prevention of any disease or disorder but does not include drug administered through parenteral route;", "(bb) \"placebo\" means an inactive substance visually identical in appearance to a drug being tested in a clinical trial;", "(cc) \"post-trial access\" means making a new drug or investigational new drug available to a trial subject after completion of clinical trial through which the said drug has been found beneficial to a trial subject during clinical trial, for such period as considered necessary by the investigator and the Ethics Committee;", "(dd) \"registered pharmacist\" shall have the meaning as assigned to it in clause", "(i) of section 2 of the Pharmacy Act, 1948 (8 of 1948);", "(ee) \"Schedule\" means the Schedule annexed to these rules;", "(ff) \"serious adverse event\" means an untoward medical occurrence during clinical trial resulting in death or permanent disability, or hospitalisation of the trial subject where the trial subject is an outdoor patient or a healthy person, prolongation of hospitalisation where the trial subject is an indoor-patient, persistent or significant disability or incapacity, congenital anomaly, birth defect or life threatening event;", "(gg) \"similar biologic\" means a biological product which is similar in terms of quality, safety and efficacy to reference biological product licenced or approved in India, or any innovator product approved in International Council of Harmonisation (ICH) member countries;", "(hh) \"sponsor\" includes a person, a company or an institution or an organisation responsible for initiation and management of a clinical trial;", "(ii) \"State Licencing Authority\" means Licencing Authority appointed by a State Government having qualifications specified in rule 49A of the Drugs and Cosmetics Rules, 1945;", "(jj) \"trial subject\" means a person who is either a patient or a healthy person to whom investigational product is administered for the purposes of a clinical trial.", "(2) Words and expressions used in these rules but not defined herein but defined in the Drugs and Cosmetics Act, 1940 (23 of 1940) shall have the meaning assigned to them in the Act."]}, {"n": 3, "title": "Central Licencing Authority", "chapter": "II", "paras": ["The Drugs Controller, India appointed by the Central Government in the Ministry of Health and Family Welfare shall be the Central Licencing Authority for the purposes of these rules."]}, {"n": 4, "title": "Delegation of powers of Central Licencing Authority", "chapter": "II", "paras": ["(1) The Drugs Controller, India, with the prior approval of the Central Government, may, by an order in writing, delegate all or any of powers of the Central Licencing Authority to any other officer of the Central Drugs Standard Control Organisation not below the rank of Assistant Drugs Controller (India).", "(2) The officer to whom the powers have been delegated under sub-rule (1) shall exercise all or any of the powers of the Central Licencing Authority under its name and seal."]}, {"n": 5, "title": "Controlling Officer", "chapter": "II", "paras": ["(1) The Drugs Controller, India may designate any officer not below the rank of Assistant Drugs Controller (India) as Controlling Officer.", "(2) The Drugs Controller, India shall, by order, specify the areas and powers of the Controlling Officer.", "(3) The Controlling Officer, designated under sub-rule (1) shall supervise the work of subordinate officers and shall exercise powers and perform functions which may be assigned to that Officer."]}, {"n": 6, "title": "Requirement of the Ethics Committee", "chapter": "III", "paras": ["(1) Whoever intends to conduct clinical trial or bioavailability study or bioequivalence study shall be required to have approval of an Ethics Committee for clinical trial registered under rule 8.", "(2) The Ethics Committee shall apply for registration with the Central Licencing Authority under rule 8."]}, {"n": 7, "title": "Constitution of Ethics Committee for clinical trial", "chapter": "III", "paras": ["(1) The Ethics Committee shall have a minimum of seven members from medical, non-medical, scientific and non-scientific areas with at least,—", "(i) one lay person;", "(ii) one woman member;", "(iii) one legal expert;", "(iv) one independent member from any other related field such as social scientist or representative of non-governmental voluntary agency or philosopher or ethicist or theologian.", "(2) The Ethics Committee referred to in sub-rule (1) shall consist of at least fifty percent of its members who are not affiliated with the institute or organization in which such committee is constituted.", "(3) One member of the Ethics Committee who is not affiliated with the institute or organization shall be the Chairperson, and shall be appointed by such institute or organisation.", "(4) One member who is affiliated with the institute or organization shall be appointed as Member Secretary of the Ethics Committee by such Institute or organization.", "(5) The committee shall include at least one member whose primary area of interest or specialisation is non-scientific and at least one member who is independent of the institution.", "(6) The members of the Ethics Committee shall follow the provisions of these rules, Good Clinical Practices Guidelines and other regulatory requirements to safeguard the rights, safety and well-being of trial subjects.", "(7) Every member of the Ethics Committee shall be required to undergo such training and development programmes as may be specified by the Central Licencing Authority from time to time:", "PROVIDED that any member, who has not successfully completed such training and developmental programmes, shall be disqualified to hold the post of member of the Ethics Committee and shall cease to be a member of such committee.", "(8) The members representing medical scientists and clinicians shall possess at least post graduate qualification in their respective area of specialisation, adequate experience in the respective fields and requisite knowledge and clarity about their role and responsibility as committee members.", "(9) As far as possible, based on the requirement of research area such as Human Immunodeficiency Virus (HIV) or genetic disorder, specific patient group may also be represented in the Ethics Committee.", "(10) No member of an Ethics Committee, having a conflict of interest, shall be involved in the oversight of the clinical trial or bioavailability or bioequivalence study protocol being reviewed by it and all members shall sign a declaration to the effect that there is no conflict of interest.", "(11) While considering an application which involves a conflict of interest of any member of the Ethics Committee, such member may voluntarily withdraw from the Ethics Committee review meeting, by expressing the same in writing, to the Chairperson.", "(12) The details in respect of the conflict of interest of the member shall be duly recorded in the minutes of the meetings of the Ethics Committee."]}, {"n": 8, "title": "Registration of Ethics Committee relating to clinical trial, bioavailability and bioequivalence study", "chapter": "III", "paras": ["(1) Every Ethics Committee, constituted under rule 7, shall make an application for grant of registration to the Central Licencing Authority in Form CT-01.", "(2) The Ethics Committee shall furnish such information and documents as specified in Table 1 of the Third Schedule along with the application made in Form CT-01.", "(3) The Central Licencing Authority,—", "(i) shall scrutinise the information and documents furnished with the application under sub-rule (2); and", "(ii) make such further enquiry, if any, considered necessary and after being satisfied, that the requirements of these rules have been complied with, may grant registration to Ethics Committee in Form CT-02; and if the Central Licencing Authority is not satisfied with the compliance of these rules by the applicant Ethics Committee, it may, reject the application, for reasons to be recorded in writing, within a period of forty-five working days, from the date of the receipt of the application made under sub-rule (1).", "<sup>5</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of forty-five working days, the registration of Ethics Committee shall be deemed to have been granted by the Central Licensing Authority and such registration shall be deemed to be legally valid for all purposes and the applicant shall be authorised to initiate clinical trial in accordance with these rules.]", "<sup>6</sup>[(3A) The applicant who has got deemed approval under the proviso to clause (ii) of sub-rule (3) shall, before initiating the functions of the Ethics Committee, inform the Central Licensing Authority in Form CT-02A and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-02A which shall become part of the official record and shall be called deemed registration of the Central Licensing Authority.]", "(4) An applicant Ethics Committee aggrieved by the decision of rejection of the application by the Central Licencing Authority under clause (ii) of sub- rule (3), may file an appeal before the Central Government in the Ministry of Health and Family Welfare within sixty working days from the date of the receipt of order of such rejection.", "(5) The Central Government may, after such enquiry, as considered necessary, and after giving an opportunity of being heard to the appellant referred to in sub-rule (4), shall dispose of the appeal filed under that sub-rule within a period of sixty working days from the date on which the appeal has been filed."]}, {"n": 9, "title": "Validity period of registration of Ethics Committee for clinical trial", "chapter": "III", "paras": ["The registration granted in Form CT-02 shall remain valid for a period of five years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority."]}, {"n": 10, "title": "Renewal of registration of Ethics Committee for clinical trial", "chapter": "III", "paras": ["(1) On expiry of the validity period of registration granted under rule 9, an Ethics Committee may make an application for renewal of registration in Form CT-01 along with documents as specified in Table 1 of the Third Schedule ninety days prior to the date of the expiry of the registration:", "PROVIDED that if the application for renewal of registration is received by the Central Licencing Authority ninety days prior to the date of expiry, the registration shall continue to be in force until an order is passed by the said authority on such application:", "PROVIDED ALSO that fresh set of documents shall not be required to be furnished, if there are no changes in such documents furnished at the time of grant of registration, and the applicant renders a certificate to that effect indicating that there is no change.", "(2) The Central Licencing Authority shall, after scrutiny of information furnished with the application and after taking into account the inspection report, if any, and after such further enquiry, as considered necessary, and on being satisfied that the requirements of these rules have—", "(i) been complied with, renew the registration of Ethics Committee in Form CT-02;", "(ii) not been complied with, reject the application, for reasons to be recorded in writing, within a period of forty-five working days from the date of renewal application made under sub-rule (1)."]}, {"n": 11, "title": "Functions of Ethics Committee", "chapter": "III", "paras": ["The Ethics Committee for clinical trial shall perform the following functions for a person, institution or organization, namely:—", "(i) review and accord approval to a clinical trial, bioavailability or bioequivalence study protocol and other related documents, as the case may be, in the format specified in clause (B) of Table 1 of the Third Schedule and oversee the conduct of clinical trial to safeguard the rights, safety and wellbeing of trial subjects in accordance with these rules, Good Clinical Practices Guidelines and other applicable regulations;", "(ii) make at appropriate intervals, an ongoing review of the clinical trials for which it has accorded approval and such review may be based on periodic study progress reports furnished by the investigators or monitoring and internal audit reports furnished by the sponsor or by visiting the study sites;", "(iii) indicate the reasons that weighed with it while rejecting or asking for a change or notification in the protocol in writing and a copy of such reasons shall also be made available to the Central Licencing Authority;", "(iv) where any serious adverse event occurs to a trial subject or to study subject during clinical trial or bioavailability or bioequivalence study, the Ethics Committee shall analyse the relevant documents pertaining to such event and forward its report to the Central Licencing Authority and comply with the provisions of Chapter VI;", "(v) where at any stage of a clinical trial, it comes to a conclusion that the trial is likely to compromise the right, safety or wellbeing of the trial subject, the committee may order discontinuation or suspension of the clinical trial and the same shall be intimated to the head of the institution conducting clinical trial and the Central Licencing Authority;", "(vi) allow any officer authorised by the Central Licencing Authority to enter, with or without prior notice, to inspect the premises, any record, or any documents related to clinical trial, furnish information to any query raised by such authorised person, in relation to the conduct of clinical trial and to verify compliance with the requirements of these rules, Good Clinical Practices Guidelines and other applicable regulations for safeguarding the rights, safety and well-being of trial subjects;", "(vii) comply with the requirements or conditions in addition to the requirements specified under the Act and these rules as may be specified by the Central Licencing Authority with the approval of the Central Government, to safeguard the rights of clinical trial subject or bioavailability or bioequivalence study subject."]}, {"n": 12, "title": "Proceedings of Ethics Committee for clinical trial", "chapter": "III", "paras": ["(1) No clinical trial or bioavailability or bioequivalence protocol and related documents shall be reviewed by an Ethics Committee unless at least five of its members as detailed below are present, namely:—", "(i) medical scientist (preferably a pharmacologist);", "(ii) clinician;", "(iii) legal expert;", "(iv) social scientist or representative of non-governmental voluntary agency or philosopher or ethicist or theologian or a similar person;", "(v) lay person.", "(2) The Ethics Committee may constitute one or more sub-committees of its members to assist in the functions assigned to it.", "(3) The Ethics Committee may associate such experts who are not its members, in its deliberations but such experts shall not have voting rights, if any.", "(4) Any change in the membership or the constitution of the registered Ethics Committee shall be intimated in writing to the Central Licencing Authority within thirty working days."]}, {"n": 13, "title": "Maintenance of records by Ethics Committee for clinical trial", "chapter": "III", "paras": ["(1) The Ethics Committee shall maintain data, record, registers and other documents related to the functioning and review of clinical trial or bioavailability study or bioequivalence study, as the case may be, for a period of five years after completion of such clinical trial.", "(2) In particular and without prejudice to the generality of the sub-rule (1), the Ethics Committee shall maintain the following records for a period of five years after completion of every clinical trial or bioavailability study or bioequivalence study, namely:—", "(i) the constitution and composition of the Ethics Committee;", "(ii) the curriculum vitae of all members of the Ethics Committee;", "(iii) standard operating procedures followed by the Ethics Committee;", "(iv) national and international guidelines followed by the Ethics Committee;", "(v) copies of the protocol, data collection formats, case report forms, investigators brochures; etc., submitted for review;", "(vi) all correspondence with committee members and investigators regarding application, decision and follow up;", "(vii) agenda of all Ethics Committee meetings and minutes of all Ethics Committee meetings with signature of the Chairperson;", "(viii) copies of decisions communicated to applicants;", "(ix) records relating to any order issued for premature termination of study with a summary of the reasons thereof;", "(x) final report of the study including microfilms, compact disks or video recordings;", "(xi) recommendation given by Ethics Committee for determination of compensation;", "(xii) records relating to the serious adverse event, medical management of trial subjects and compensation paid.", "(3) The Ethics Committee shall furnish the information maintained under sub-rule (1) and sub-rule (2), as and when required by the Central Licencing Authority or any other officer authorised on its behalf."]}, {"n": 14, "title": "Suspension or cancellation of registration of Ethics Committee for clinical trial", "chapter": "III", "paras": ["(1) Where Central Licencing Authority is of the opinion that any Ethics Committee fails to comply with any provision of the Act or these rules, it may issue show cause notice to such Ethics Committee specifying therein such non- compliances and the period within which reply shall be furnished by such Ethics Committee.", "(2) On receipt of reply for the show cause notice within a period specified in the show cause notice, the Central Licencing Authority may give an opportunity of being heard, in person to such Ethics Committee.", "(3) After consideration of the facts and reply given by the Ethics Committee under sub-rule (2), the Central Licencing Authority, may take one or more of the following actions, namely:—", "(i) withdraw show cause notice issued under sub-rule (1);", "(ii) issue warning to the Ethics Committee describing the deficiency or defect observed during inspection or otherwise, which may adversely affect the rights or well-being of the trial subject or the validity of clinical trial or bioavailability or bioequivalence study being conducted;", "(iii) reject the results of clinical trial or bioavailability and bioequivalence study;", "(iv) suspend for such period as considered appropriate or cancel the registration issued under rule 8;", "(v) debar its members to oversee any clinical trial in future for such period as may be considered appropriate by the Central Licencing Authority.", "(4) Where the Ethics Committee or any member of the Ethics Committee is aggrieved by an order of the Central Licencing Authority under sub-rule (3), such aggrieved Ethics Committee or member, may, within a period of sixty working days of the receipt of the order, file an appeal to the Central Government.", "(5) Where an appeal has been filed under sub-rule (4), the Central Government may, after such enquiry, as it thinks necessary, and after giving an opportunity of being heard, pass such order in relation thereto as it thinks appropriate in the facts and circumstances of the case within a period of sixty working days from the date of filing of the appeal."]}, {"n": 15, "title": "Ethics Committee for biomedical and health research", "chapter": "IV", "paras": ["Any institution or organisation which intends to conduct biomedical and health research shall be required to have an Ethics Committee to review and oversee the conduct of such research as detailed in National Ethical Guidelines for Biomedical and Health Research Involving Human Participants."]}, {"n": 16, "title": "Constitution of Ethics Committee for biomedical and health research", "chapter": "IV", "paras": ["(1) The Ethics Committee referred to in rule 15, relating to biomedical and health research shall be constituted in accordance with the National Ethical Guidelines for Biomedical and Health Research Involving Human Participants as may be specified by the Indian Council of Medical Research from time to time and shall function in accordance with said guidelines.", "(2) The Ethics Committee referred to in sub-rule (1), shall review the work of the biomedical and health research centre before initiation and oversee throughout the duration of the biomedical and health research as per National Ethical Guidelines for Biomedical and Health Research Involving Human Participants.", "(3) An institution or organisation or any person shall conduct any biomedical and health research with the approval of the Ethics Committee for biomedical and health research registered under rule 17.", "(4) Any biomedical and health research shall be conducted in accordance with the National Ethical Guidelines for Biomedical and Health Research Involving Human Participants as may be specified by the Indian Council of Medical Research from time to time.", "(5) Institutions desirous of conducting biomedical and health research as well as clinical trials or bioavailability or bioequivalence study shall require obtaining registration from specified authorities as provided in rule 8 and rule 17."]}, {"n": 17, "title": "Registration of Ethics Committee related to biomedical and health research", "chapter": "IV", "paras": ["(1) An Ethics Committee constituted under rule 16, shall be required to register with the authority designated by the Central Government in the Ministry of Health and Family Welfare, Department of Health Research under these rules for which an application shall be made in Form CT-01 to the said authority.", "(2) The application referred to in sub-rule (1) shall be accompanied with the information and documents as specified in Table 1 of the Third Schedule.", "(3) On receipt of application in Form CT-01 under sub-rule (1), the authority designated under sub-rule (1) shall grant provisional registration which shall remain valid for a period of two years.", "(4) After the grant of provisional registration under sub-rule (3), the authority designated under sub-rule (1) shall scrutinise the documents and information furnished with the application, and if satisfied that the requirements of these rules have been complied with, grant final registration to Ethics Committee in Form CT-03; or if not satisfied, reject the application, for reasons to be recorded in writing and the final registration in Form CT-03 shall supersede the provisional registration granted under sub-rule (3).", "(5) An applicant who is aggrieved by the decision of the authority designated under sub-rule (1), may file an appeal within sixty working days from the date of receipt of such rejection before the Central Government in the Ministry of Health and Family Welfare, and the Central Government, may, after such enquiry as is considered necessary in the facts and circumstances of the case, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days.", "(6) The Ethics Committee shall make an application for renewal of registration in Form CT-01 along with documents as specified in sub-rule (2) at least ninety days prior to the date of the expiry of its final registration:", "PROVIDED that if the application for renewal of registration is received by the authority designated under sub-rule (1), ninety days prior to the date of expiry, the registration shall continue to be in force until an order is passed by the said authority on the application:", "PROVIDED FURTHER that fresh set of documents shall not be required to be furnished, if there are no changes in such documents furnished at the time of grant of final registration, and if the applicant renders a certificate to that effect indicating that there is no change.", "(7) The authority designated under sub-rule (1) shall after scrutiny of information furnished with the application and after such further enquiry, as considered necessary and on being satisfied that the requirements of these rules have been complied with, renew the registration of Ethics Committee in Form CT-03, or if not, reject the application, for reasons to be recorded in writing.", "(8) The authority shall take a decision under sub-rule (7) within a period of forty-five working days, from the date of application made under sub-rule (1).", "(9) The registration granted in Form CT-03 shall remain valid for a period of five years from the date of its issue, unless suspended or cancelled by the authority designated under sub-rule (1).", "(10) The function, proceedings of ethics committee and maintenance of records shall be as per the National Ethical Guidelines for Biomedical and Health Research Involving Human Participants.", "(11) In case there is a change in composition of registered Ethics Committee in an institution it shall be reported to the authority designated under sub-rule (1)."]}, {"n": 18, "title": "Suspension or cancellation of registration of Ethics Committee for biomedical and health research", "chapter": "IV", "paras": ["(1) Subject to provisions of rule 17, where the Ethics Committee fails to comply with any provision of these rules, the authority designated under sub- rule (1), may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "(i) issue warning to the Ethics Committee describing the deficiency or defect observed, which may adversely affect the rights or well-being of the study subjects;", "(ii) suspend for such period as considered appropriate or cancel the registration issued under rule 17;", "(iii) debar its members to oversee any biomedical health research in future for such period as may be considered appropriate.", "(2) Where the Ethics Committee or its member, as the case may be, is aggrieved by an order of the authority designated under sub-rule (1), it may, within a period of forty-five working days of the receipt of the order, make an appeal to the Central Government in the Ministry of Health and Family Welfare, and that Government may, after such enquiry, as deemed necessary, and after giving an opportunity of being heard, pass such order in relation thereto as may be considered appropriate in the facts and circumstances of the case."]}, {"n": 19, "title": "Clinical trial of new drug or investigational new drug", "chapter": "V", "paras": ["(1) No person or institution or organisation shall conduct clinical trial of a new drug or investigational new drug,—", "(i) except in accordance with the permission granted by the Central Licencing Authority; and", "(ii) without the protocol thereof having been approved by the Ethics Committee for clinical trial registered in accordance with the provisions of rule 8.", "(2) Every person associated with the conduct of clinical trial of a new drug or investigational new drug shall follow the general principles and practices as specified in the First Schedule.", "(3) No person or institution or organisation shall conduct clinical trial of a new drug or investigational new drug except in accordance with the procedure prescribed under the provisions of the Act and these rules."]}, {"n": 20, "title": "Oversight of clinical trial site", "chapter": "V", "paras": ["The work of every clinical trial site shall be overseen by an Ethics Committee for clinical trial registered under rule 8, before initiation and throughout the duration of the conduct of such trial."]}, {"n": 21, "title": "Application for permission to conduct clinical trial of a new drug or investigational new drug", "chapter": "V", "paras": ["(1) Any person or institution or organisation which intends to conduct clinical trial of a new drug or an investigational new drug shall make an application to the Central Licencing Authority duly filled in Form CT-04.", "(2) The application made under sub-rule (1) shall be accompanied with the information and documents as specified in the Second Schedule and fee as specified in the Sixth Schedule:", "PROVIDED that no fee shall be payable for conduct of a clinical trial by a person of an institution or organisation funded or owned, wholly or partially by the Central Government or by a State Government."]}, {"n": 22, "title": "Grant of permission to conduct clinical trial", "chapter": "V", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-04 and such further enquiry, if any, as may be considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant the permission to conduct clinical trial for a new drug or investigational new drug in Form CT-06;", "(ii) in case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, the said Authority shall inform the applicant about the deficiencies;", "(iii) if not satisfied that the requirements of these rules have been complied with, reject the application, for the reasons to be recorded in writing.", "(2) The decision under sub-rule (1) shall be taken within ninety working days.", "<sup>8</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, the permission to conduct all clinical trial shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to initiate clinical trial in accordance with these rules.]", "<sup>9</sup>[(2A) The applicant who has got deemed approval under the proviso to sub-rule(2) shall, before initiating the clinical trial, inform the Central Licensing Authority in Form CT-06A and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-06A which shall become part of the official record and shall be called deemed approval of the Central Licensing Authority.]", "(3) The applicant, after being informed, as referred to in clause (ii) of sub- rule (1), by the Central Licencing Authority, may,—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority;", "(ii) where the applicant rectifies the deficiency, as referred in sub-rule (1), and provides required information and documents, the Central Licencing Authority shall scrutinize the application again and if satisfied, grant permission to conduct clinical trial of the new drug or investigational new drug, or if not satisfied, reject the application within a period of ninety days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty working days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(4) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (3), may file an appeal before the Central Government in the Ministry of Health and Family Welfare within forty-five days from the date of receipt of such decision and that the Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days."]}, {"n": 23, "title": "Permission to conduct clinical trial of a new drug or investigational new drug as part of discovery, research and manufacture in India", "chapter": "V", "paras": ["(1) Notwithstanding anything contained in these rules, where any person or institution or organisation make an application under rule 21 to conduct clinical trial of a new drug or an investigational new drug which is complete as per these rules and fulfills the following conditions, namely:—", "(i) the drug is discovered in India; or", "(ii) research and development of the drug are being done in India and also the drug is proposed to be manufactured and marketed in India, such application shall be disposed by way of grant of permission or rejection or processed by way of communication to rectify any deficiency of the application, as the case may be, as specified in rule 22, by the Central Licencing Authority within a period of thirty working days from the date of the receipt of the application by the said authority:", "PROVIDED that, where no communication has been received from the Central Licencing Authority to the applicant within the said period, the permission to conduct clinical trial shall be deemed to have been granted by the Central Licencing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to initiate clinical trial in accordance with these rules.", "(2) The applicant who has taken deemed approval under the proviso to sub-rule (1) shall before initiating the clinical trial, inform the Central Licencing Authority in Form CT-4A and the Central Licencing Authority shall on the basis of the said information, take on record the Form CT-4A which shall become part of the official record and shall be called automatic approval of the Central Licencing Authority."]}, {"n": 24, "title": "Permission to conduct clinical trial of a new drug already approved outside India", "chapter": "V", "paras": ["Notwithstanding anything contained in these rules, where any person or institution or organisation makes an application under rule 21 to conduct clinical trial of a new drug which is already approved and marketed in a country, as specified under rule 101, the application, shall be disposed of by way of grant of permission or rejection or processed by way of communication to rectify any deficiency, as the case may be, as specified in rule 22, by the Central Licencing Authority within a period of ninety working days from the date of the receipt of the application by the said Authority.", "<sup>10</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, the permission to conduct clinical trial shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to initiate clinical trial in accordance with these rules:", "Provided further that the applicant who has got deemed approval under this rule shall before initiating the clinical trial, inform the Central Licensing Authority in Form CT-06A and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-06A which shall become part of the official record and shall be called deemed approval of the Central Licensing Authority.]"]}, {"n": 25, "title": "Conditions of permission for conduct of clinical trial", "chapter": "V", "paras": ["The permission granted by the Central Licencing Authority to conduct clinical trial under this Chapter shall be subject to following conditions, namely:—", "(i) clinical trial at each site shall be initiated after approval of the clinical trial protocol and other related documents by the Ethics Committee of that site, registered with the Central Licencing Authority under rule 8;", "(ii) where a clinical trial site does not have its own Ethics Committee, clinical trial at that site may be initiated after obtaining approval of the protocol from the Ethics Committee of another trial site; or an independent Ethics Committee for clinical trial constituted in accordance with the provisions of rule 7:", "PROVIDED that the approving Ethics Committee for clinical trial shall in such case be responsible for the study at the trial site or the centre, as the case may be:", "PROVIDED FURTHER that the approving Ethics Committee and the clinical trial site or the bioavailability and bioequivalence centre, as the case may be, shall be located within the same city or within a radius of 50 kms of the clinical trial site;", "(iii) in case an ethics committee of a clinical trial site rejects the approval of the protocol, the details of the same shall be submitted to the Central Licensing Authority prior to seeking approval of another Ethics Committee for the protocol for conduct of the clinical trial at the same site;", "(iv) the Central Licencing Authority shall be informed about the approval granted by the Ethics Committee within a period of fifteen working days of the grant of such approval;", "(v) clinical trial shall be registered with the Clinical Trial Registry of India maintained by the Indian Council of Medical Research before enrolling the first subject for the trial;", "(vi) clinical trial shall be conducted in accordance with the approved clinical trial protocol and other related documents and as per requirements of Good Clinical Practices Guidelines and the provisions of these rules;", "(vii) status of enrolment of the trial subjects shall be submitted to the Central Licencing Authority on quarterly basis or as appropriate as per the duration of treatment in accordance with the approved clinical trial protocol, whichever is earlier;", "(viii) six monthly status report of each clinical trial, as to whether it is ongoing, completed or terminated, shall be submitted to the Central Licencing Authority electronically in the SUGAM portal;", "(ix) in case of termination of any clinical trial the detailed reasons for such termination shall be communicated to the Central Licencing Authority within thirty working days of such termination;", "(x) any report of serious adverse event occurring during clinical trial to a subject of clinical trial, shall, after due analysis, be forwarded to the Central Licencing Authority, the chairperson of the Ethics Committee and the institute where the trial has been conducted within fourteen days of its occurrence as per Table 5 of the Third Schedule and in compliance with the procedures as specified in Chapter VI;", "(xi) in case of injury during clinical trial to the subject of such trial, complete medical management and compensation shall be provided in accordance with Chapter VI and details of compensation provided in such cases shall be intimated to the Central Licencing Authority within thirty working days of the receipt of order issued by Central Licencing Authority in accordance with the provisions of the said Chapter;", "(xii) in case of clinical trial related death or permanent disability of any subject of such trial during the trial, compensation shall be provided in accordance with Chapter VI and details of compensation provided in such cases shall be intimated to the Central Licencing Authority within thirty working days of receipt of the order issued by the Central Licencing Authority in accordance with the provisions of the said Chapter;", "(xiii) the premises of the sponsor including his representatives and clinical trial sites, shall be open for inspection by officers of the Central Licencing Authority who may be accompanied by officers of the State Licencing Authority or outside experts as authorised by the Central Licencing Authority, to verify compliance of the requirements of these rules and Good Clinical Practices Guidelines, to inspect, search and seize any record, result, document, investigational product, related to clinical trial and furnish reply to query raised by the said officer in relation to clinical trial;", "(xiv) where the new drug or investigational new drug is found to be useful in clinical development, the sponsor shall submit an application to the Central Licencing Authority for permission to import or manufacture for sale or for distribution of new drug in India, in accordance with Chapter X of these rules, unless otherwise justified;", "(xv) the laboratory owned by any person or a company or any other legal entity and utilised by that person to whom permission for clinical trial has been granted used for research and development, shall be deemed to be registered with the Central Licensing Authority and may be used for test or analysis of any drug for and on behalf of Central Licensing Authority;", "(xvi) the Central Licencing Authority may, if considered necessary, impose any other condition in writing with justification, in respect of specific clinical trials, regarding the objective, design, subject population, subject eligibility, assessment, conduct and treatment of such specific clinical trial;", "(xvii) the sponsor and the investigator shall maintain the data integrity of the data generated during clinical trial."]}, {"n": 26, "title": "Validity period of permission to initiate a clinical trial", "chapter": "V", "paras": ["The permission to initiate clinical trial granted under rule 22 in Form CT-06 or automatic approval under rule 23 in Form CT 4A shall remain valid for a period of two years from the date of its issue, unless extended by the Central Licencing Authority."]}, {"n": 27, "title": "Post-trial access of investigational new drug or new drug", "chapter": "V", "paras": ["Where any investigator of a clinical trial of investigational new drug or new drug has recommended post-trial access of the said drug after completion of clinical trial to any trial subject and the same has been approved by the Ethics Committee for clinical trial, the post-trial access shall be provided by the sponsor of such clinical trial to the trial subject free of cost—", "(i) if the clinical trial is being conducted for an indication for which no alternative therapy is available and the investigational new drug or new drug has been found to be beneficial to the trial subject by the investigator; and", "(ii) the trial subject or legal heir of such subject, as the case may be, has consented in writing to use post-trial investigational new drug or new drug; and the investigator has certified and the trial subject or his legal heir, as the case may be, has declared in writing that the sponsor shall have no liability for post trial use of investigational new drug or new drug."]}, {"n": 28, "title": "Academic clinical trial", "chapter": "V", "paras": ["(1) No permission for conducting an academic clinical trial shall be required for any drug from the Central Licencing Authority where,—", "(i) the clinical trial in respect of the permitted drug formulation is intended solely for academic research purposes for a new indication or new route of administration or new dose or new dosage form; and", "(ii) the clinical trial referred to in clause (i) has been initiated after prior approval by the Ethics Committee for clinical trial; and", "(iii) the observations generated from such clinical trial are not required to be submitted to the Central Licencing Authority; and", "(iv) the observations of such clinical trial are not used for promotional purposes.", "(2) In the event of a possible overlap between the academic clinical trial and clinical trial or a doubt on the nature of study, the Ethics Committee concerned shall inform the Central Licencing Authority in writing indicating its views within thirty working days from the receipt of application to that effect.", "(3) The Central Licencing Authority shall, after receivin
