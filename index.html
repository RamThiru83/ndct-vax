vidence, on the basis of existing knowledge, of difference in Indian population of the enzymes or gene involved in the metabolism of the new drug or any factor affecting pharmacokinetics and pharmacodynamics, safety and efficacy of the new drug; and", "(iv) the applicant has given an undertaking in writing to conduct Phase IV clinical trial to establish safety and effectiveness of such new drug as per design approved by the Central Licencing Authority:", "PROVIDED that the Central Licencing Authority may relax this condition, where the drug is indicated in life threatening or serious diseases or diseases of special relevance to Indian health scenario or for a condition which is unmet need in India such as XDR tuberculosis, hepatitis C, H1N1, dengue, malaria, HIV, or for the rare diseases for which drugs are not available or available at a high cost or if it is an orphan drug.", "(8) The submission of requirements relating to animal toxicology, reproduction studies, teratogenic studies, perinatal studies, mutagenicity and carcinogenicity in the application referred to in sub-rule (1), may be modified or relaxed in case of new drugs approved and marketed for more than two years in other countries, if the Central Licencing Authority is satisfied that there is adequate published evidence regarding the safety of the drug, subject to other provisions of these rules."]}, {"n": 76, "title": "Grant of permission for import of new drugs for sale or distribution", "chapter": "X", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-18 and such further enquiry, if any, as may be considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant the permission to import new drug, in the form of active pharmaceutical ingredient for sale or for distribution in Form CT-19 or pharmaceutical formulation for sale or for distribution in Form CT-20, as the case may be, within a period of ninety working days from the date of receipt of its application in Form CT-18;", "(ii) in case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, said Authority shall inform the applicant of the deficiencies within the stipulated period referred to in clause (i);", "(iii) if not satisfied that the requirements of these rules have been complied with, reject the application, for that reasons to be recorded in writing, within a period of ninety working days, from the date of the application made under rule 75.", "(2) The applicant may, after being informed by the Central Licencing Authority as referred to in clause (ii) of sub-rule (1),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority;", "(ii) where the applicant rectifies the deficiency, as referred in clause (i), within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant permission to import new drug, in the form of active pharmaceutical ingredient for sale or for distribution in Form CT-19 or pharmaceutical formulation for sale or for distribution in Form CT-20, as the case may be; or if not satisfied, reject the application within a period of ninety days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(3) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) and sub-rule (2), may file an appeal before the Central Government within sixty days from the date of receipt of such rejection and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days from the date of filing the appeal."]}, {"n": 77, "title": "Condition of permission for import of new drugs for sale or distribution", "chapter": "X", "paras": ["The permission for import of new drugs for sale or for distribution under rule 76 shall be subject to the following conditions, namely:—", "(i) the new drugs shall conform to the specifications approved by the Central Licencing Authority;", "(ii) the labeling of the drugs shall conform to the requirements specified in the Drugs and Cosmetics Rules, 1945;", "(iii) the label on the immediate container of the drug as well as the packing in which the container is enclosed should contain the following warning:", "\"WARNING: To be sold by retail on the prescription of a...............only\"", "which shall be in red box;", "(iv) as post marketing surveillance, the applicant shall submit Periodic Safety Update Reports as specified in the Fifth Schedule;", "(v) all reported adverse reactions related to drug shall be intimated to the Central Licencing Authority and regulatory action resulting from their review shall be complied with;", "(vi) no claims except those mentioned above shall be made for the drug without prior approval of the Central Licencing Authority;", "(vii) specimen of the carton, labels, package insert that will be adopted for marketing the drug in the country shall be got approved from the Central Licencing Authority before the drugs is marketed;", "(viii) in case of import, each consignment shall be accompanied by a test or analysis report;", "(ix) if long-term stability data submitted do not cover the proposed shelf-life of the product, the stability study shall be continued to firmly establish the shelf-life and the complete stability data shall be submitted."]}, {"n": 78, "title": "Suspension or cancellation of import permission for new drug", "chapter": "X", "paras": ["(1) Where the importer fails to comply with any provision of the Act and these Rules, the Central Licencing Authority may, after giving show cause notice and an opportunity of being heard, by an order in writing, may suspend the permission for such period as considered appropriate or cancel the permission.", "(2) Where the importer whose permission has been suspended or cancelled under sub-rule (1), is aggrieved by an order of the Central Licencing Authority, such importer may, within forty-five days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after giving an opportunity of being heard, pass such order as may be considered appropriate in the facts and circumstances of the case."]}, {"n": 79, "title": "Licence to import new drug for sale or for distribution under the Drugs and Cosmetics Rules, 1945", "chapter": "X", "paras": ["(1) After obtaining permission under Rule 76, the person intending to import new drug for sale shall make an application to the Central Licencing Authority as per provisions of the Drugs and Cosmetics Rules, 1945 to obtain a licence for import of new drug for sale or for distribution.", "(2) The application referred in sub-rule (1) shall be accompanied by the permission in Form CT-19 or Form CT-20, as the case may be, obtained by the applicant from the Central Licencing Authority to import the new drugs."]}, {"n": 80, "title": "Application for permission to manufacture new drug for sale or distribution", "chapter": "X", "paras": ["(1) A person who intends to manufacture new drug in the form of active pharmaceutical ingredient or pharmaceutical formulation, as the case may be, for sale or distribution, shall make an application for grant of permission to the Central Licencing Authority in Form CT-21 along with a fee as specified in the Sixth Schedule:", "PROVIDED that no fee shall be required to be paid along with the application for manufacture of a new drug based on successful completion of clinical trials from Phase I to Phase III under these Rules in India, where fee has already been paid by the same applicant for conduct of such clinical trials:", "PROVIDED FURTHER that an application for grant of permission to manufacture a new drug for sale or distribution in the form of active pharmaceutical ingredient having a new drug molecule not approved earlier shall be accompanied by an application for grant of permission to manufacture for sale or distribution of pharmaceutical formulation of the said new drug.", "(2) Where a new drug, proposed to be manufactured, is a new drug having unapproved new molecule, the application in Form CT-21 shall be accompanied by data and other particulars including results of local clinical trial as specified in the Second Schedule along with data specified in Table 1 of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(3) Where a new drug, proposed to be manufactured which has been approved as a new drug, the application in Form CT-21 shall be accompanied by data and other particulars as specified in the Second Schedule along with data specified in Table 2 of the Second Schedule and accompanied with fee as specified in Sixth Schedule.", "(4) Where a new drug which is already permitted for certain claims, is now proposed to be manufactured for new claims, namely new indication or new dosage form or new route of administration or new strength, application in Form CT-21 shall be accompanied by data and other particulars including results of local clinical trial as specified in the Second Schedule along with data specified in Table 3 of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(5) In case of a new drug which is a fixed dose combination, the application in Form CT-21 shall be accompanied by data and other particulars including results of local clinical trial as specified in the Second Schedule along with data specified in Table 1 or Table 2 or Table 3, as the case may be, of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(6) A person who intends to market phyto-pharmaceutical drugs shall make an application in Form CT-21 to the Central Licencing Authority along with data specified in Table 4 of Second Schedule and it shall be accompanied with a fee as specified in the Sixth Schedule.", "(7) The local clinical trial may not be required to be submitted along with the application referred to in sub-rule (1) if,—", "(i) the new drug is approved and marketed in countries specified by the Central Licencing Authority under rule 101 and if no major unexpected serious adverse events have been reported; or", "(ii) there is no probability or evidence, on the basis of existing knowledge, of difference in Indian population of the enzymes or gene involved in the metabolism of the new drug or any factor affecting pharmacokinetics and pharmacodynamics, safety and efficacy of the new drug; and", "(iii) the applicant has given an undertaking in writing to conduct Phase IV clinical trial to establish safety and effectiveness of such new drug as per design approved by the Central Licencing Authority:", "PROVIDED that the Central Licencing Authority may relax this condition, where the drug is indicated in life threatening or serious diseases or diseases of special relevance to Indian health scenario or for a condition which is unmet need in India such as XDR tuberculosis, hepatitis C, H1N1, dengue, malaria, HIV, or for the rare diseases for which drugs are not available or available at a high cost or if it is an orphan drug.", "(8) In the application referred to in sub-rule (1), the submission of requirements relating to animal toxicology, reproduction studies, teratogenic studies, perinatal studies, mutagenicity and carcinogenicity may be modified or relaxed in case of new drugs approved and marketed for several years in other countries, if the Central Licencing Authority is satisfied that there is adequate published evidence regarding the safety of the drug, subject to other provisions of these rules."]}, {"n": 81, "title": "Grant of permission for manufacture of new drug for sale or distribution", "chapter": "X", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-21 and such further enquiry, if any, as may be considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant permission to manufacture new drug, in the form of active pharmaceutical ingredient for sale or for distribution in Form CT-22 or pharmaceutical formulation for sale or for distribution in Form CT-23, as the case may be, within a period of ninety working days from the date of receipt of its application in Form CT-21;", "(ii) if not satisfied that the requirements of these rules have been complied with, reject the application, for reasons to be recorded in writing, within a period of ninety working days, from the date, the application made under rule 80; and", "(iii) in case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, said Authority shall inform the applicant of the deficiencies within the stipulated period referred to in clause (i).", "(2) The applicant may, after being informed by the Central Licencing Authority as referred to in clause (iii) of sub-rule (1),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority;", "(ii) where the applicant rectifies the deficiency within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant permission to manufacture new drug, in the form of active pharmaceutical ingredient for sale or for distribution in Form CT-22 or pharmaceutical formulation for sale or for distribution in Form CT-23, as the case may be; or if not satisfied, reject the application within a period of ninety working days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty working days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(3) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (2), may file an appeal before the Central Government within sixty days from the date of receipt of such rejection and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days from the date of filing the appeal."]}, {"n": 82, "title": "Condition of permission for manufacture of new drugs for sale or distribution", "chapter": "X", "paras": ["The permission granted under rule 81 in Form CT-22 or in Form CT-23 shall be subject to following conditions, namely:—", "(i) the new drugs shall conform to the specifications approved by the Central Licencing Authority;", "(ii) the labeling of the drugs shall conform to the requirements specified in the Drugs and Cosmetics Rules, 1945;", "(iii) the label on the immediate container of the drug as well as the packing in which the container is enclosed should contain the following warning:", "\"WARNING: To be sold by retail on the prescription of a.......................Only\" and it shall be in box with red back ground.", "(iv) as post marketing surveillance, the applicant shall submit Periodic Safety Update Reports as specified in the Fifth Schedule;", "(v) all reported serious unexpected adverse reactions related to the drug shall be intimated to the Central Licencing Authority and regulatory action resulting from their review shall be complied with;", "(vi) no claims except those mentioned above shall be made for the drug without prior approval of the Central Licencing Authority;", "(vii) specimen of the carton, labels, package insert that will be adopted for marketing the drug in the country shall be got approved from the Central Licencing Authority before the drugs is marketed;", "(viii) if long-term stability data submitted do not cover the proposed shelf-life of the product, the stability study shall be continued to firmly establish the shelf-life and the complete stability data shall be submitted."]}, {"n": 83, "title": "Licence to manufacture a new drug for sale or for distribution under Drugs Rules, 1945", "chapter": "X", "paras": ["(1) After obtaining permission granted under rule 81, the person intending to manufacture a new drug for sale shall make an application for grant of licence to manufacture for sale or for distribution in accordance with the provisions of the Act and the Drugs and Cosmetics Rules, 1945.", "(2) The application referred in sub-rule (1) shall be accompanied by the permission in Form CT-22 or Form CT-23, as the case may be, obtained by the applicant from the Central Licencing Authority to manufacture the new drug."]}, {"n": 84, "title": "Suspension or cancellation of permission", "chapter": "X", "paras": ["(1) Where the manufacturer fails to comply with any provisions of the Act, these rules and any condition of the permission, the Central Licencing Authority may, after affording an opportunity of being heard, suspend or cancel the permission for such period as considered appropriate either wholly or in respect of some of the substances to which the violation relates.", "(2) Where the manufacturer whose permission has been suspended or cancelled under sub-rule (1) is aggrieved by an order of the Central Licencing Authority, such manufacturer may, within thirty days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as considered appropriate."]}, {"n": 85, "title": "Responsibility of importers or manufacturers in marketing of new drugs", "chapter": "X", "paras": ["The manufacturer or importer of new drugs shall be responsible for marketing a new drug for the approved indication and in only such dosage form for which it has been permitted:", "PROVIDED that the manufacturer or importer of new drug shall not be punished for the consequences resulting from use of the drug for an indication other than for which the drug has been approved where the manufacturer proves that he has not been involved in any manner in the promotion of use of the new drug for other than approved indication."]}, {"n": 86, "title": "Application for import of unapproved new drug by Government hospital and Government medical institution", "chapter": "XI", "paras": ["(1) Notwithstanding anything contained in these rules, a medical officer of a Government hospital or a Government medical institution, may import new drug, which has not been permitted in the country under Chapter X of these rules, but approved for marketing in the country of origin for treatment of a patient suffering from life threatening disease or disease causing serious permanent disability or disease requiring therapies for unmet medical needs, by making an application duly certified by the Medical Superintendent of the Government hospital or Head of the Government medical institution, as the case may be, to the Central Licencing Authority in Form CT-24.", "(2) The application under sub-rule (1) shall be accompanied by such other particulars and documents as are specified in Form CT-24 along with fee as specified in the Sixth Schedule."]}, {"n": 87, "title": "Grant of licence for import of unapproved new drug by Government hospital and medical institution", "chapter": "XI", "paras": ["(1) The Central Licencing Authority, after scrutiny of information and documents enclosed with the application and such further enquiry, if any, as considered necessary, may,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant licence for import of an unapproved new drug by Government hospital and Government medical institution in Form CT-25;", "(ii) if not satisfied with the requirements as referred to in sub-clause (i), reject the application, for reasons to be recorded in writing, within a period of ninety days, from the date of application made under sub-rule (1) of rule 86.", "(2) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1), may file an appeal before the Central Government within forty-five days from the date of receipt of such rejection and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days from the date of filing the appeal.", "(3) The quantity of any single drug imported on the basis of licence granted under sub-rule (1), shall not exceed one hundred average dosages per patient but in exceptional circumstances and on being satisfied about the necessity and exigency the Central Licencing Authority may allow import of unapproved new drugs in larger quantities depending on the condition and requirement of such patient."]}, {"n": 88, "title": "Conditions of licence", "chapter": "XI", "paras": ["The import licence granted under rule 87 in Form CT-25 shall be subject to the following conditions, namely: —", "(i) the licence shall remain valid for a period of three years from the date it has been issued;", "(ii) the licence shall be displayed in the premises of the medical institution including where the unapproved new drug is being stocked and used in the office of the Medical Superintendent of the Government hospital or Head of Government medical institution;", "(iii) the licencee shall stock the unapproved new drug imported under this licence under proper storage conditions;", "(iv) the unapproved new drug imported under this licence shall be exclusively used for treatment of the patient and supplied under the supervision of a registered pharmacist and no part of such unapproved new drug shall be sold in the market or supplied to any other person, agency, institution or place;", "(v) the registered pharmacist shall maintain a record as specified in Annexure of Form CT-25, countersigned by the Medical Superintendent of the Government hospital or Head of the Government medical institution which shall be produced, on demand by the officer authorised by the Central Licencing Authority under these rules;", "(vi) the Government hospital and Government medical institution referred to in sub-rule (1) of rule 87, shall submit to the Central Licencing Authority a half yearly report about the status and stock of unapproved new drugs imported, utilised and destroyed;", "(vii) where the unapproved new drugs imported under licence granted under sub-rule (1) of rule 87, are left over or remain unused or get damaged or its specified shelf-life has expired or has been found to be of sub-standard quality, the same shall be destroyed and the action taken in respect thereof be recorded as referred to in clause (iv) by the registered pharmacist."]}, {"n": 89, "title": "Suspension or cancellation of import licence for unapproved new drug of Government hospital or Government medical institution", "chapter": "XI", "paras": ["(1) Where any licencee referred to in rule 87, fails to comply with any provision of the Act and these rules, the Central Licencing Authority, may after affording an opportunity of being heard, by an order in writing, suspend or cancel the permission for such period as considered appropriate either wholly or in respect of some of the substances to which the violation relates.", "(2) Where the licencee, whose licence has been suspended or cancelled under sub-rule (1) is aggrieved by an order of the Central Licencing Authority, he may, within a period of forty-five days from the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as considered appropriate."]}, {"n": 90, "title": "Inspection of unapproved new drug imported by Government hospital or Government medical institution", "chapter": "XI", "paras": ["The licencee referred in rule 87, shall allow any person authorised by the Central Licencing Authority who may be accompanied by an officer authorised by the State Licencing Authority, to enter the premises where the unapproved new drugs are stored and is being used, with or without prior notice, and records, to inspect such premises, store and record, investigate the manner in which the drugs are being used and stocked and to take sample thereof."]}, {"n": 91, "title": "Application for permission to manufacture unapproved new drug but under clinical trial, for treatment of patient of life threatening disease", "chapter": "XI", "paras": ["(1) Where any medical officer Of a Government hospital or Government medical institution prescribes in special circumstances any new drug for a patient suffering from serious or life threatening disease for which there is no satisfactory therapy available in the country and which is not yet approved by the Central Licencing Authority but the same is under clinical trial in the country, then, such new drug may be approved to be manufactured in limited quantity subject to provisions of these rules.", "(2) Where any manufacturer intends to manufacture new drug referred to in sub-rule (1), he shall obtain the consent in writing from the patient to whom the unapproved new drug has been prescribed under sub-rule (1) or his legal heirs and make an application to the Ethics Committee of the Government hospital or medical institution, as the case may be, for obtaining its specific recommendation for manufacture of such unapproved new drug.", "(3) After obtaining the recommendation of the Ethics Committee under sub-rule (2), the manufacturer shall make an application in Form CT-26 to obtain the permission to the Central Licencing Authority for manufacturing specific new drug.", "(4) The application under sub-rule (3) shall be accompanied by consent in writing from the patient referred to in sub-rule (1) or his legal heirs regarding use of such unapproved new drug and such other particulars and documents as are specified in Form CT-26 along with fee as specified in the Sixth Schedule."]}, {"n": 92, "title": "Grant of permission to manufacture unapproved new drug but under clinical trial, for treatment of patient of life threatening disease", "chapter": "XI", "paras": ["(1) The Central Licencing Authority may, after scrutiny of information and documents enclosed with the application and such further enquiry, if any, as considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant permission to manufacture unapproved new drug but under clinical trial for treatment of patient of serious or life threatening disease in Form CT-27;", "(ii) if not satisfied with the requirements as referred to in clause (i), reject the application, for reasons to be recorded in writing, within a period of ninety days, from the date of application made under rule 91.", "(2) The quantity of any single new drug manufactured on the basis of permission granted under sub-rule (1) shall not exceed one hundred average dosages per patient but in exceptional circumstances on the basis of the prescription of the medical officer referred to in sub-rule (1) and the recommendation of the Ethics Committee, the Central Licencing Authority may allow the manufacture of such new drug in larger quantity."]}, {"n": 93, "title": "Condition of permission", "chapter": "XI", "paras": ["The permission granted under rule 92 in Form CT-27, is subject to the following conditions, namely:—", "(i) the permission shall remain valid for a period of one year from the date it has been issued;", "(ii) the patient to whom the unapproved new drug is prescribed under sub-rule (1) of rule 92 shall use such unapproved new drug under the supervision of the medical officer at the place specified in the permission or at such other places, as the Central Licencing Authority may authorise;", "(iii) the manufacturer to whom the permission is granted under sub-rule (1) of rule 92, shall make use of the unapproved new drug only for the purposes specified in the permission and no part of it shall be sold in the market or supplied to any other person, agency, institution or place;", "(iv) the manufacturer referred to in clause (iii) shall keep record of the unapproved new drugs manufactured, stored and supplied by him to the patient in a register in the format as specified in annexure of Form CT-27;", "(v) the manufacturer referred to in clause (iii), shall submit to the Central Licencing Authority a half yearly report about the status of the unapproved new drugs manufactured, supplied to the authorised patient;", "(vi) the manufactured unapproved new drugs shall be kept and stored in accordance with the storage conditions specified on its label and supplied to the patient under the supervision of the medical officer referred to in sub-rule (1) of rule 91 or a registered pharmacist duly authorised by him;", "(vii) the registered pharmacist shall maintain a record of the full name and address of the patients, diagnosis, dosage schedule, total quantity of drugs received and issued, countersigned by the Medical Superintendent of the Government hospital or Head of the medical institution which shall be produced, on demand by the officer authorised by the Central Licencing Authority under the Act;", "(viii) where the unapproved new drug manufactured in accordance with the permission issued under sub-rule (1) of rule 92, is left over or remain unused or get damaged or its specified shelf-life has expired or has been found to be of sub-standard quality, the same shall be destroyed by the manufacturer and the action taken in respect thereof shall be recorded;", "(ix) the permission holder shall inform the Central Licencing Authority of the occurrence of any serious adverse event and action taken thereon including any recall within fifteen days of occurrence of such event."]}, {"n": 94, "title": "Inspection of unapproved new drug but under clinical trial manufactured for patient of life threatening disease", "chapter": "XI", "paras": ["The manufacturer referred to in rule 92, shall allow persons authorised by the Central Licencing Authority including the person authorised by the State Licencing Authority to enter the premises where the unapproved new drug is being manufactured, stored and supplied, with or without prior notice, to inspect such premises and records, investigate the manner in which the unapproved new drug is being manufactured, supplied and to take sample thereof."]}, {"n": 95, "title": "Suspension or cancellation of permission to manufacture unapproved new drug but under clinical trial", "chapter": "XI", "paras": ["(1) Where the manufacturer to whom permission is granted under rule 92 fails to comply with any provision of the Act and these rules, the Central Licencing Authority, may, after giving an opportunity of being heard, by an order, in writing, suspend or cancel the permission for such period as considered appropriate either wholly or in respect of some of the substances to which the violation relates.", "(2) Where the manufacturer whose permission is suspended or cancelled under sub-rule (1) is aggrieved by an order of the Central Licencing Authority, he may, within a period of forty-five days from the receipt of the order, make an appeal to the Central Government in respect of suspension or cancellation of the permission and that Government, may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as considered appropriate."]}, {"n": 96, "title": "Licence to manufacture an unapproved new drug but under clinical trial, for treatment of patient of life threatening disease under the Drugs and Cosmetics Rules, 1945", "chapter": "XI", "paras": ["(1) After obtaining permission under rule 92, the person intending to manufacture an unapproved new drug, which is under clinical trial, for treatment of patient of serious or life threatening disease, shall make an application for grant of licence to manufacture the unapproved new drug under the provisions of the Act and the Drugs and Cosmetics Rules, 1945.", "(2) The application referred in sub-rule (1) shall be accompanied by the permission in Form CT-27 obtained by the applicant from the Central Licencing Authority to import the new drugs."]}, {"n": 97, "title": "In the Drugs and Cosmetics Rules, 1945, after rule 122DA, the following new rule shall be inserted, namely:—", "chapter": "XII", "paras": ["\"122D AA. Non-application of certain rules for new drugs and investigational new drugs for human use", "Part XA and Schedule Y shall not be applicable in respect of new drugs and investigational new drugs for human use from the date of coming into force of the New Drugs and Clinical Trials Rules, 2019, and the references in respect of human use made in these rules shall respectively be omitted, and the construction thereof shall be construed accordingly and shall stand amended with all cogent meaning of the grammar.\""]}, {"n": 98, "title": "Pre-submission meeting", "chapter": "XIII", "paras": ["(1) Any person who intends to make an application for grant of licence or permission for import or manufacture of new drugs or to conduct clinical trial may, request by making an application in writing, for a pre-submission meeting with the Central Licencing Authority or any other officer authorised by the Central Licencing Authority for seeking guidance about the requirements of law and procedure of such licence or permission of manufacturing process, clinical trial and other requirements.", "(2) The application for pre-submission meeting under sub-rule (1) may be accompanied by particulars and documents referred to in the Second Schedule, as available with the applicant to support his proposal along with fee as specified in the Sixth Schedule.", "(3) Where the applicant intends to seek guidance about the sale process of new drugs or import licence, in addition to the purposes referred to in sub-rule (2), the fee as specified in the Sixth Schedule shall be submitted along with the application.", "(4) Where the Central Licencing Authority is satisfied that the application is incomplete or the information or the documents submitted along with the same are inadequate, he may within a period of thirty days from the receipt of the same intimate the facts to the applicant in writing and direct him to furnish such further information or documents as are necessary in accordance with the provisions of the Act and these rules.", "(5) In the pre-submission meeting, the Central Licencing Authority or any other person authorised by it shall provide suitable clarification to the applicant."]}, {"n": 99, "title": "Post-submission meeting", "chapter": "XIII", "paras": ["(1) If the applicant desires to seek clarification in person in respect of pending application and queries related thereto, the applicant may make an application for a post-submission meeting with the officer designated by the Central Licencing Authority within a period of fifteen days from the date the query was received for seeking guidance with regards to the queries concerning pending application.", "(2) The applicant shall clearly state the points on which clarification is required and after receipt of such application, the designated officer shall inform the time and date scheduled for post submission meeting.", "(3) The summary of the clarification provided by the designated officer shall be made available to the applicant.", "(4) The application for post-submission meeting under sub-rule (1) shall be accompanied with the fee as specified in the Sixth Schedule.", "(5) In the post submission meeting, the officer designated by the Central Licencing Authority shall provide suitable clarification to the applicant."]}, {"n": 100, "title": "Constitution of expert committee or group of experts by Central Licensing Authority", "chapter": "XIII", "paras": ["The Central Licencing Authority may, when so required, constitute one or more expert committee or group of experts with specialisation in relevant fields, with the approval of Central Government, to evaluate scientific and technical matters relating to drugs and such committee or group may, give its recommendations to that authority on matters referred to it within a period of sixty days from the date of reference."]}, {"n": 101, "title": "Name of countries for purpose of new drug approval", "chapter": "XIII", "paras": ["The Central Licencing Authority, with the approval of the Central Government, may specify, by an order, the name of the countries, from time to time, for considering waiver of local clinical trial for approval of new drugs under Chapter X and for grant of permission for conduct of clinical trial under Chapter V."]}, {"n": 102, "title": "Mode of payment of fee", "chapter": "XIII", "paras": ["The fees prescribed under these rules, in case of application made to the Central Licencing Authority, shall be paid through challan or by electronic mode, in the Bank of Baroda, Kasturba Gandhi Marg, New Delhi-110001 or any other branch of Bank of Baroda, or any other bank, notified by the Ministry of Health and Family Welfare in the Central Government, to be credited under the Head of Account \"0210- Medical and Public Health, 04-Public Health, 104- Fees and Fines."]}, {"n": 103, "title": "Debarment of applicant", "chapter": "XIII", "paras": ["(1) Whoever himself or, any other person on his behalf, or applicant is found to be guilty of submitting misleading, or fake, or fabricated documents, may, after giving him an opportunity to show cause as to why such an order should not be made, in writing, stating the reasons thereof, be debarred by the Central Licencing Authority for such period as deemed fit.", "(2) Where an applicant is aggrieved by an order made by the Central Licencing Authority under sub-rule (1), such applicant may, within thirty days from the receipt of the order, make an appeal to that Government and that Government, may, after such enquiry as it considers necessary, and after affording an opportunity of being heard, pass such orders as considered appropriate."]}, {"n": 104, "title": "Order of suspension or revocation in public domain", "chapter": "XIII", "paras": ["In case, the Central Licencing Authority issue any order of suspension or revocation or cancellation of any permission or licence or registration granted under these rules, such order shall be made available in the public domain immediately by uploading it in the website of Central Drugs Standard Control Organisation."]}, {"n": 105, "title": "Digitalisation of Forms", "chapter": "XIII", "paras": ["The forms prescribed under these rules may be suitably modified for conversion into digital forms by the Central Drugs Standard Control Organisation and such modification shall not require any amendment in these rules."]}, {"n": 106, "title": "Applicability in case of inconsistency", "chapter": "XIII", "paras": ["If there is any inconsistency between these rules and any other rule made under the Act, the provisions of these rules shall prevail over such other rules."]}, {"n": 107, "title": "Savings", "chapter": "XIII", "paras": ["(1) Notwithstanding the non-applicability of the Drugs and Cosmetics Rules, 1945, the approvals or permissions or licences or certificates issued under the provisions of the Act and the said rules in respect of new drugs and investigational new drugs for human use, prior to commencement of these rules, shall be deemed to be valid till its expiry under the corresponding provisions of said rules.", "(2) Any things done or any action taken or purported to have been done or taken, including any rule, notification, inspection, order or notice made or issued or any appointment or declaration made or any operation undertaken or any direction given or any proceedings taken or any penalty, punishment, forfeiture or fine imposed under the Drugs and Cosmetics Rules, 1945, shall be deemed to have been done or taken under the corresponding provisions of these rules and shall always remain valid for all purposes."]}], "schedules": [{"id": "first", "name": "First Schedule", "paras": ["1. General Principles", "(1) The principles and guidelines for protection of trial subjects as described in Third Schedule as well as Good Clinical Practices guidelines shall be followed in conduct of any clinical trial.", "(2) The sponsor and investigator share the responsibilities for the protection of trial subject together with ethics committee. The responsibilities of sponsor, investigator and ethics committee are described in the Third Schedule.", "(3) The results of non-clinical studies or previous clinical trials should be sufficient to ensure that the new drugs or investigational new drug is safe for the proposed clinical trial.", "(4) Throughout the clinical trial and drug development process, the animal toxicological data and clinical data generated should be evaluated to ensure their impact for the safety of the trial subject.", "2. Approach in design and analysis", "(1) Clinical trial should be planned, designed, conducted, analysed and reported according to sound scientific and ethical principles. Following important principles should be followed:—", "(a) The primary objective of any clinical trial should be clearly and explicitly stated which may include exploratory or confirmatory characterisation of safety, efficacy, assessment of pharmacokinetic and pharmacodynamic parameters;", "(b) The clinical trial should be designed appropriately so that it provides the desired information;", "(c) Appropriate comparator may be utilised to achieve the objective with respect to primary and secondary end points. Comparison may be made with placebo, no treatment, active controls or of different doses of the new drug or investigational new drug;", "(d) The number of subjects to be included in the clinical trial should be adequate depending on the nature and objective of the clinical trial.", "3. Development Methodology:", "(1) Non-clinical studies,—", "(a) The nature of non-clinical studies and their timing in respect of conduct of clinical trial should be determined taking following aspects into consideration:", "(i) characteristics of the new drug or investigational new drug;", "(ii) disease of conditions for which the new drug or investigational new drug is intended to be indicated;", "(iii) duration and exposure in clinical trial subject;", "(iv) route of administration.", "[(b) (I) The general requirements of non-clinical studies have been specified in the Second Schedule.", "(II) The non-clinical testing methods to assess the safety and efficacy of a new drug or investigational new drug include the following, namely: -", "(i) Cell-based assay;", "(ii) Organ chips and micro physiological systems;", "(iii) Sophisticated computer modeling;", "(iv) Other human biology-based test methods;", "(v) Animal Studies.]<sup>A1</sup>", "(c) For first in human studies the dose should be calculated carefully based on the non-clinical pharmacological, toxicological data generated.", "(2) Phases in Clinical Trial: Clinical drug development generally consists of four phases (Phase I-IV). The details of these phases are described as under:", "(a) Phase I: The objective of studies in this phase is the estimation of safety and tolerability with the initial administration of an investigational new drug into humans. Studies in this phase of development usually have non-therapeutic objectives and may be conducted in healthy subjects or certain types of patients. Drugs with significant potential toxicity e.g. cytotoxic drugs are usually studied in patients. Phase I trial should preferably be carried out by investigators trained in clinical pharmacology with access to the necessary facilities to closely observe and monitor the subjects. Studies conducted in Phase I, usually intended to involve one or a combination of the following objectives:—", "(a) Maximum tolerated dose: To determine the tolerability of the dose range expected to be needed for later clinical studies and to determine the nature of adverse reactions that can be expected. These studies include both single and multiple dose administration.", "(b) Pharmacokinetics, i.e., characterisation of a drug's absorption, distribution, metabolism and excretion:", "Although these studies continue throughout the development plan, they should be performed to support formulation development and determine pharmacokinetic parameters in different age groups to support dosing recommendations.", "(c) Pharmacodynamics: Depending on the drug and the endpoints studied, pharmacodynamic studies and studies relating to drug blood levels (pharmacokinetic or pharmacodynamic studies) may be conducted in healthy volunteer subjects or in patients with the target disease. If there are appropriate validated indicators of activity and potential efficacy, pharmacodynamic data obtained from patients may guide the dosage and dose regimen to be applied in later studies.", "(d) Early measurement of drug activity: Preliminary studies of activity or potential therapeutic benefit may be conducted in Phase I as a secondary objective. Such studies are generally performed in later phases but may be appropriate when drug activity is readily measurable with a short duration of drug exposure in patients at this early stage.", "(b) Phase II:", "(i) The primary objective of Phase II trials is to evaluate the effectiveness of a drug for a particular indication or indications in patients with the condition under study and to determine the common short-term side-effects and risks associated with the drug. Studies in Phase II should be conducted in a group of patients who are selected by relatively narrow criteria leading to a relatively homogeneous population. These studies should be closely monitored. An important goal for this phase is to determine the dose and regimen for Phase III trials. Doses used in Phase II are usually (but not always) less than the highest doses used in Phase I.", "(ii) Additional objectives of Phase II studies can include evaluation of potential study endpoints, therapeutic regimens (including concomitant medications) and target populations (e.g. mild versus severe disease) for further studies in Phase II or III. These objectives may be served by exploratory analyses, examining subsets of data and by including multiple endpoints in trials.", "(c) Phase III:", "(i) Phase III studies have primary objective of demonstration or confirmation of therapeutic benefits. Studies in Phase III are designed to confirm the preliminary evidence accumulated in Phase II that a drug is safe and effective for use in the intended indication and recipient population. These studies should be intended to provide an adequate basis for marketing approval. Studies in Phase III may also further explore the dose-response relationships (relationships among dose, drug concentration in blood and clinical response), use of the drug in wider populations, in different stages of disease, or the safety and efficacy of the drug in combination with other drugs.", "(ii) For drugs intended to be administered for long periods, trials involving extended exposure to the drug are ordinarily conducted in Phase III, although they may be initiated in Phase II. These studies carried out in Phase III complete the information needed to support adequate instructions for use of the drug (prescribing information).", "(iii) For new drugs approved outside India, Phase III studies may need to be carried out if scientifically and ethically justified, primarily to generate evidence of efficacy and safety of the drug in Indian patients when used as recommended in the prescribing information. Prior to conduct of Phase III studies in Indian subjects, Central Licencing Authority may require pharmacokinetic studies to be undertaken to verify that the data generated in Indian population is in conformity with the data already generated abroad.", "In case of an application of a new drug already approved and marketed in other country, where local clinical trial in India is waived off or not found scientifically justified for its approval for manufacturing first time in the country, the bioequivalence studies of such drug, as appropriate, is required to be carried out and the test batches manufactured for the purpose shall be inspected before its approval.", "(d) Phase IV: Phase IV or post marketing trial of new drugs are performed after the approval of the drug and related to the approved indication. Such trials go beyond the prior demonstration of the drug's safety, efficacy and dose definition. Such trial might not have been considered essential at the time of new drug approval due to various reasons such as limitation in terms of patient exposure, duration of treatment during clinical development of the drug, need for early introduction of the new drug in the interest of patients etc. Phase IV trials include additional drug-drug interaction, dose response or safety studies and trials design to support use under the approved indication e.g. mortality or morbidity studies, epidemiological studies, etc.", "(3) Studies in special populations: Information supporting the use of the drug in children, pregnant women, nursing women, elderly patients, patients with renal or other organ systems failure, and those on specific concomitant medication is required to be submitted if relevant to the clinical profile of the drug and its anticipated usage pattern.", "(A) Geriatrics—Geriatric patients should be included in Phase III clinical trials (and in Phase II trials, at the Sponsor's option) in meaningful numbers, if—", "(a) the disease intended to be treated is characteristically a disease of aging; or", "(b) the population to be treated is known to include substantial numbers of geriatric patients; or", "(c) when there is specific reason to expect that conditions common in the elderly are likely to be encountered; or", "(d) when the new drug is likely to alter the geriatric patient's response (with regard to safety or efficacy) compared with that of the non-geriatric patient.", "(B) Paediatrics", "(i) The timing of paediatric studies in the new drug development program will depend on the medicinal product, the type of disease being treated, safety considerations, and the efficacy and safety of available treatments. For a drug expected to be used in children, evaluations should be made in the appropriate age group. When clinical development is to include studies in children, it is usually appropriate to begin with older children before extending the trial to younger children and then infants.", "(ii) If the new drug is for diseases predominantly or exclusively affecting paediatric patients, clinical trial data should be generated in the paediatric population except for initial safety and tolerability data, which will usually be obtained in adults unless such initial safety studies in adults would yield little useful information or expose them to inappropriate risk.", "(iii) If the new drug is intended to treat serious or life-threatening diseases, occurring in both adults and paediatric patients, for which there are currently no or limited therapeutic options, paediatric population should be included in the clinical trials early, following assessment of initial safety data and reasonable evidence of potential benefit. In circumstances where this is not possible, lack of data should be justified in detail.", "(iv) If the new drug has a potential for use in paediatric patients - paediatric studies should be conducted. These studies may be initiated at various phases of clinical development or after post marketing surveillance in adults if a safety concern exists. In cases where there is limited paediatric data at the time of submission of application, more data in paediatric patients would be expected after marketing authorisation for use in children is granted.", "(v) The paediatric studies should include—", "(a) clinical trials,", "(b) relative bioequivalence comparisons of the paediatric formulation with the adult formulation performed in adults, and definitive pharmacokinetic studies for dose selection across the age ranges of paediatric patients in whom the drug is likely to be used. These studies should be conducted in the paediatric patient population with the disease under study.", "(vi) If the new drug is a major therapeutic advance for the paediatric population the studies should begin early in the drug development, and this data should be submitted with the new drug application.", "(vii) For clinical trials conducted in the paediatric population, the reviewing ethics committee should include members who are knowledgeable about paediatric, ethical, clinical and psychosocial issues.", "(C) Pregnant or nursing women", "(i) Pregnant or nursing women should be included in clinical trials only when the drug is intended for use by pregnant or nursing women or foetuses or nursing infants and where the data generated from women who are not pregnant or nursing, is not suitable.", "(ii) For new drugs intended for use during pregnancy, follow-up data (pertaining to a period appropriate for that drug) on the pregnancy, foetus and child will be required. Where applicable, excretion o# the drug or its metabolites into human milk should be examined and the infant should be monitored for predicted pharmacological effects of the drug.", "4. Conduct of Clinical Trial", "Clinical trial should be conducted in accordance with the principles as specified in Third Schedule. Adherence to the clinical trial protocol is essential and if amendment of the protocol becomes necessary the rationale for the amendment shall be provided in the form of a protocol amendment. Serious adverse events shall be reported during clinical trial in accordance with these Rules. 5. Analysis", "The results of a clinical trial shall be analysed according to the plan specified in the clinical trial protocol. Safety data should be appropriately tabulated and all adverse events should be classified according to their seriousness and causal relationship with the study drug.", "6. Reporting", "Report of clinical trial shall be documented in accordance with the approaches specified in Table 6 of the Third Schedule. The report shall be certified by the principal investigator or if no principal investigator is designated then by each of the participating investigators of the study."]}, {"id": "second", "name": "Second Schedule", "paras": ["(1) Application for permission to import or manufacture new drug for sale or to undertake clinical trials under these Rules shall be made to the Central Licencing Authority accompanied with following data in accordance with the Table 1 or Table 2 or Table 3 or Table 4 of this Schedule, as the case may be, namely:—", "(i) chemical and pharmaceutical information;", "(ii) animal pharmacology data;", "(a) specific pharmacological actions and demonstrating, therapeutic potential for humans shall be described according to the animal models and species used. Wherever possible, dose-response relationships and ED50 shall be submitted. Special studies conducted to elucidate mode of action shall also be described;", "(b) general pharmacological actions;", "(c) pharmacokinetic data related to the absorption, distribution, metabolism and excretion of the test substance. Wherever possible, the drug effects shall be co-related to the plasma drug concentrations;", "(iii) animal toxicology data;", "(iv) human clinical pharmacology data as prescribed and as stated below:—", "(a) for new drug substances discovered or developed in India, clinical trials are required to be carried out in India right from Phase I and data should be submitted as prescribed;", "(b) for new drug substances discovered or developed in countries other than India, Phase I data should be submitted along with the application. After submission of Phase I data generated outside India to the Central Licensing Authority, permission may be granted to repeat Phase I trials or to conduct Phase II trials and subsequently Phase III trial concurrently with other global trials for that drug. For a drug going to be introduced for the first time in the country, Phase III trial may be required to be conducted in India before permission to market the drug is granted unless otherwise exempted;", "(c) the data required will depend upon the purpose of the new drug application. The number of study subjects and sites to be involved in the conduct of clinical trial will depend upon the nature and objective of the study. Permission to carry out these trials shall generally be given in stages, considering the data emerging from earlier phases;", "(d) application for permission to initiate specific phase of clinical trial should also accompany investigator's brochure as per Table 7 of Third Schedule, proposed protocol as per Table 2 of Third Schedule, case record form, trial subject's informed consent document as per Table 3 of Third Schedule, investigator's undertaking as per Table 4 of Third Schedule and ethics committee clearance, if available as per Table 1 of Third Schedule;", "(e) reports of clinical studies submitted should be in consonance with the format specified in Table 6 of Third Schedule. The study report shall be certified by the principal investigator or, if no principal investigator is designated, then by each of the investigators participating in the study. The certification should acknowledge the contents of the report, the accurate presentation of the study was undertaken, and express agreement with the conclusions. Each page should be numbered;", "(v) regulatory status in other countries as prescribed including information in respect of restrictions imposed, if any, on the use of the drug in other countries, e.g. dosage limits, exclusion of certain age groups, warning about adverse drug reactions etc. Likewise, if the drug has been withdrawn in any country by the manufacturer or by regulatory authorities, such information should also be furnished along with the reasons and their relevance, if any, to India. This information must continue to be submitted by the sponsor to the Central Licencing Authority during the course of marketing of the drug in India;", "(vi) the full prescribing information should be submitted as part of the new drug application for marketing. The format of prescribing information is specified in Table 8 of Third Schedule.", "(vii) all package inserts, promotional literature and patient education material subsequently produced are required to be consistent with the contents of the approved full prescribing information. The drafts of label and carton texts should comply with provisions of rule 96 and rule 97 of the Drugs and Cosmetics Rules, 1945. After submission and approval by the Central Licencing Authority, no changes in the package insert shall be effected without such changes being approved by the Central Licencing Authority;", "(viii) complete testing protocol for quality control testing together with a complete impurity profile and release specifications for the product as prescribed should be submitted as part of new drug application for marketing. Samples of the pure drug substance and finished product are to be submitted when desired by the regulatory authority;", "(ix) if the application is for the conduct of clinical trials as a part of multi- national clinical development of the drug, the number of sites and patients as well as the justification for undertaking such trials in India should be provided to the Central Licencing Authority along with the application.", "(2) Special situations for a new drug where relaxation, abbreviations, omission or deferment of data may be considered (i) Depending on categories and nature of new drugs to be imported or manufactured for sale or clinical trial to be undertaken (viz. New Chemical Entity, biological products, similar biologies, approved new drug or new dosage form or new indication or new route of administration or new strength of already approved drugs, etc.,) requirements of chemical and pharmaceutical information, animal pharmacology and toxicology data, clinical data may differ. The requirements may also differ depending on the specific phase of clinical trial proposed to be conducted as well as clinical parameters related to the specific study drug.", "(ii) For drugs intended to be used in life threatening or serious disease conditions or rare diseases and for drugs intended to be used in the diseases of special relevance to Indian scenario or unmet medical need in India, disaster or special defence use e.g. haemostatic and quick wound healing, enhancing oxygen carrying capacity, radiation safety, drugs for combating chemical, nuclear, biological infliction etc., following mechanism may be followed to expedite the development of new drug and approval process.", "(A) Accelerated Approval Process: Accelerated approval process may be allowed to a new drug for a disease or condition, taking into account its severity, rarity, or prevalence and the availability or lack of alternative treatments, provided that there is a prima facie case of the product being of meaningful therapeutic benefit over the existing treatment.", "(a) In such case, the approval of the new drug may be based on data generated in clinical trial where surrogate endpoint shall be considered rather than using standard outcome measures such as survival or disease progression, which are reasonably likely to predict clinical benefit, or a clinical endpoint. These should be measurable earlier than irreversible morbidity or mortality (IMM) and reasonably likely to predict clinical benefit.", "(b) After granting accelerated approval for such drug, the post marketing trials shall be required to validate the anticipated clinical benefit.", "(c) Accelerated approval may also be granted to a new drug if it is intended for the treatment of a serious or life-threatening condition or disease of special relevance to the country, and addresses unmet medical needs. This provision is intended to facilitate and expedite review of drugs so that an approved product can reach the therapeutic armamentarium expeditiously.", "(d) If the remarkable efficacy is observed with a defined dose in the Phase II clinical trial of investigational new drug for the unmet medical needs of serious and life threatening diseases in the country, it may be considered for grant of marketing approval by the Central Licencing Authority based on Phase II clinical trial data.", "In such cases, additional post licensure studies may be required to be conducted after approval to generate the data on larger population to further verify and describe the clinical benefits, as per the protocol approved by the Central Licensing Authority.", "(e) The type of information needed to demonstrate the potential of a drug to address an unmet medical need will depend on the stage of drug development. Early in development, such potential should be sufficiently demonstrated based on non-clinical models, a mechanistic rationale and pharmacologic data. Later in development, prior to new drug approval such potential should be demonstrated through clinical data to address an unmet medical need.", "Explanation: For the purpose of this clause, an unmet medical need is a situation where treatment or diagnosis of disease or condition is not addressed adequately by available therapy. An unmet medical need includes an immediate need for a defined population (i.e., to treat a serious condition with no or limited treatment) or a longer-term need for society (e.g., to address the development of resistance to antibacterial drugs).", "(B) Situations where quick or expeditious review process can be sought for approval of a new drug after clinical development:", "(i) In situation where the evidence for clinical safety and efficacy have been established even if the drug has not completed the all or normal clinical trial phases, the sponsor or applicant may apply to the licencing authority for expedited review process wherein the licencing authority will examine and satisfy the following conditions:—", "(a) it is for a drug that is intended to treat a serious or life threatening or rare disease or condition;", "(b) if approved, the drug would provide a significant advantage in terms of safety or efficacy;", "(c) there is substantial reduction of a treatment-limiting adverse reaction and enhancement of patient compliance that is expected to lead to an improvement in serious outcomes;", "(ii) the sponsor or applicant may also apply to the licensing authority for expedited review process for new drugs developed for disaster or defence use in extraordinary situation, such as war time, the radiation exposure by accident or intention, sudden deployment of forces at areas with higher health risk, where specific preventive and treatment strategy is required, where new intervention in the form of new drug, route of delivery or formulation has been developed and where real life clinical trial may not be possible. The permission for manufacture of such new drug may be granted if following conditions are satisfied:—", "(a) The preclinical data makes a case for claimed efficacy;", "(b) there is no possibility of obtaining informed consent from the patient or his legally acceptable representative, as the case may be, adopting inclusion and exclusion criteria and strict protocol adherence by each subject;", "(c) there is no established management or therapeutic strategy available as on date and proposed intervention has clear possible advantage;", "(d) such approval can be used only for one time. The subsequent approval shall only be granted once detailed efficacy report of such intervention is generated.", "(iii) the new drug is an orphan drug as defined in clause (x) of rule 2 of these Rules.", "(3) Requirements of data and information for permission to import or manufacture of a drug already approved which is now proposed to be clinically tried or marketed with certain new claims:", "(i) In case a drug already approved by the Central Licencing Authority for certain claims, which is now proposed to be clinically tried or marketed with modified or new claims, namely, indications, dosage, dosage form (including sustained release dosage form) and route of administration or novel drug delivery system (NDDS), the requirements of data and information for permission to import or manufacture of such new drug for sale or to undertake clinical trial shall depend on nature and regulatory status of the drug for the new claim in other country. Application for approval of manufacture or import of such new drug or to undertake Clinical trial may differ from application for a new drug molecule in that they allow the applicant and regulatory authority to rely at least in part, on the safety or efficacy data of drug formulation already approved. However, additional non-clinical or clinical data may be necessary to substantiate the new claims considering the following:—", "(A) Chemical and pharmaceutical information will be same as prescribed in this Schedule. However, the data requirements may be omitted depending on whether the drug formulation is already approved and marketed in the country by the applicant in the same dosage form for certain indication. If it is approved and marketed, no further chemical and pharmaceutical data is required to be submitted.", "(B) The animal pharmacological and toxicological data and clinical data needed in such cases will usually be determined on case-by-case basis depending on the type of new claims being made by the applicant as well as the mechanism of action, patho-physiology of the disease or condition, safety and efficacy profile in the respective conditions or population and clinical data already generated with the drug in the approved claim. The requirements may be abbreviated or relaxed or omitted as considered appropriate by the Central Licencing Authority under following conditions:", "(a) the drug is already approved and marketed in other country for the proposed new claim;", "(b) clinical data supporting the benefit-risk ratio in favour of the drug in the proposed new claim is available;", "(c) the clinical trial doesn't involve a route of administration, dose, patient population that significantly increases the risk associated with the use of the drug.", "(ii) In case of an application for permission to undertake clinical trial of a new drug formulation, which is already approved in the country, no chemical and pharmaceutical data and non-clinical and clinical data is required to be submitted provided the clinical trial is proposed to be conducted with a new drug manufactured or imported by a firm under necessary new drug permission or import registration and licence, as the case may be, granted by the Central Licencing Authority.", "Note: The data requirements stated in this Schedule are expected to provide adequate information to evaluate the efficacy, safety and therapeutic rationale of new drugs prior to the permission for sale Depending upon the nature of new drugs and diseases, additional information may be required by the Central Licencing Authority. The applicant shall certify the authenticity of the data and documents submitted in support of an application for new drug. The Central Licencing Authority reserves the right to reject any data or any documents if such data or contents of such documents are found to be of doubtful integrity.", "2. Animal toxicology (Non-clinical toxicity studies)", "(1) General principles: Toxicity studies should comply with the norms of Good Laboratory Practices (GLP). Briefly, these studies should be performed by suitably trained and qualified staff employing properly calibrated and standardized equipment of adequate size and capacity. Studies should be done as per written protocols with modifications (if any) verifiable retrospectively. Standard operating procedures (SOPs) should be followed for all managerial and laboratory tasks related to these studies. Test substances and test systems (in-vitro or in-vivo) should be properly characterised and standardized. All documents belonging to each study, including its approved protocol, raw data, draft report, final report, and histology slides and paraffin tissue blocks should be preserved for a minimum of five years after marketing of the drug. Toxic kinetic studies (generation of pharmacokinetic data either as an integral component of the conduct of non-clinical toxicity studies or in specially designed studies) should be conducted to assess the systemic exposure achieved in animals and its relationship to dose level and the time course of the toxicity study. Other objectives of toxic kinetic studies include obtaining data to relate the exposure achieved in toxicity studies to toxicological findings and contribute to the assessment of the relevance of these findings to clinical safety, to support the choice of species and treatment regimen in non-clinical toxicity studies and to provide information which, in conjunction with the toxicity findings, contributes to the design of subsequent non-clinical toxicity studies.", "1.1 Systemic toxicity studies", "1.1.1 Single-dose toxicity studies—These studies (see Table 1) should be carried out in 2 rodent species (mice and rats) using the same route as intended for humans. In addition, unless the intended route of administration in humans is only intravenous, at least one more route should be used in one of the species to ensure systemic absorption of the drug. This route should depend on the nature of the drug. A limit of 2g/kg (or 10 times the normal dose that is intended in humans, whichever is higher) is recommended for oral dosing. Animals should be observed for 14 days after the drug administration, and Minimum Lethal Dose (MLD) and Maximum Tolerated Dose (MTD) should be established. If possible, the target organ of toxicity should also be determined. Mortality should be observed for up to seven days after parenteral administration and up to 14 days after oral administration. Symptoms, signs and mode of death should be reported, with appropriate macroscopic and microscopic findings where necessary. LD10 and LD50 should be reported preferably with 95 percent confidence limits. If LD50 cannot be determined, reasons for the same should be stated.", "The dose causing severe toxic manifestations or death should be defined in the case of cytotoxic anticancer agents, and the post-dosing observation period should be up to 14 days. Mice should first be used for determination of MTD. Findings should then be confirmed in rat for establishing linear relationship between toxicity and body surface area. In case of non-linearity, data of the more sensitive species should be used to determine the Phase I starting dose. Where rodents are known to be poor predictors of human toxicity (e.g., antifolates), or where the cytotoxic drug acts by a novel mechanism of action, Maximum Tolerated Dose (MTD) should be established in non-rodent species.", "1.1.2 Repeated-dose systemic toxicity studies. These studies (see Table 1) should be carried out in at least two mammalian species, of which one should be a non-rodent. Dose ranging studies should precede the 14-, 28-, 90- or 180- day toxicity studies. Duration of the final systematic toxicity study will depend on the duration, therapeutic indication and scale of the proposed clinical trial. If a species is known to metabolise the drug in the same way as humans, it should be preferred for toxicity studies.", "In repeated-dose toxicity studies the drug should be administered seven days a week by the route intended for clinical use. The number of animals required for these studies, i.e. the minimum number of animals on which data should be available.", "Wherever applicable, a control group of animals given the vehicle alone should be included, and three other groups should be given graded d oses of the drug. The highest dose should produce observable toxicity; the lowest dose should not cause observable toxicity, but should be comparable to the intended therapeutic dose in humans or a multiple of it. To make allowance for the sensitivity of the species the intermediate dose should cause some symptoms, but not gross toxicity or death, and should be placed logarithmically between the other two doses.", "The parameters to be monitored and recorded in long-term toxicity studies should include behavioural, physiological, biochemical and microscopic observations. In case of parenteral drug administration, the sites of injection should be subjected to gross and microscopic examination. Initial and final electrocardiogram and fundus examination should be carried out in the non- rodent species.", "In the case of cytotoxic anticancer agents dosing and study design should be in accordance with the proposed clinical schedule in terms of days of exposure and number of cycles. Two rodent species may be tested for initiating Phase I trials. A non-rodent species should be added if the drug has a novel mechanism of action, or if permission for Phase II, III or marketing is being sought. For most compounds, it is expected that single dose tissue distribution studies with sufficient sensitivity and specificity will provide an adequate assessment of tissue distribution and the potential for accumulation. Thus, repeated dose tissue distribution studies should not be required uniformly for all compounds and should only be conducted when appropriate data cannot be derived from other sources. Repeated dose studies may be appropriate under certain circumstances based on the data from single dose tissue distribution studies, toxicity and toxicokinetic studies. The studies may be most appropriate for compounds which have an apparently long half-life, incomplete elimination or unanticipated organ toxicity.", "Notes :", "(i) Single dose toxicity study: Each group should contain at least five animals of either sex. At least four graded doses should be given. Animals should be exposed to the test substance in a single bolus or by continuous infusion or several doses within 24 hours. Animals should be observed for 14 days. Signs of intoxication, effect on body weight, gross pathological changes should be reported. It is desirable to include histo- pathology of grossly affected organs, if any.", "(ii) Dose-ranging study: Objectives of this study include the identification of target organ of toxicity and establishment of Maximum Tolerated Dose (MTD) for subsequent studies.", "(a) Rodents—Study should be performed in one rodent species (preferably rat) by the proposed clinical route of administration. At least four graded doses including control should be given, and each dose group as well as the vehicle control should consist of a minimum of five animals of each sex. Animals should be exposed to the test substance daily for 10 consecutive days. Highest dose should be the maximum tolerated dose of single-dose study. Animals should be observed daily for signs of intoxication (general appearance, activity and behaviour etc), and periodically for the body weight and laboratory parameters. Gross examination of viscera and microscopic examination of affected organs should be done.", "(b) Non-rodents—One male and one female are to be taken for ascending Phase Maximum Tolerated Dose (MTD) study. Dosing should start after initial recording of cage-side and laboratory parameters. Starting dose may be three to five times the extrapolated effective dose or Maximum Tolerated Dose (MTD) (whichever is less), and dose escalation in suitable steps should be done every third day after drawing the samples for laboratory parameters. Dose should be lowered appropriately when clinical or laboratory evidence of toxicity are observed. Administration of test substance should then continue for 10 days at the well-tolerated dose level following which, samples for laboratory parameters should be taken. Sacrifice, autopsy and microscopic examination of affected tissues should be performed as in the case of rodents.", "(iii) 14-28 Day repeated-dose toxicity studies: One rodent (6-10 / sex / group) and one non-rodent (2-3 / sex / group) species are needed. Daily dosing by proposed clinical route at three dose levels should be done with highest dose having observable toxicity, mid dose between high and low dose, and low dose. The doses should preferably be multiples of the effective dose and free from toxicity. Observation parameters should include cage side observations, body weight changes, food or water intake, blood biochemistry, haematology, and gross and microscopic studies of all viscera and tissues.", "(iv) 90 Days repeated-dose toxicity studies: One rodent (15-30 / sex/group) and one non-rodent (4- 6/sex/group) species are needed. Daily dosing by proposed clinical route at three graded dose levels should be done. In addition to the control a \"high-dose-reversal\" group and it
