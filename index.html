and medical institution", "Application for permission to manufacture", "unapproved new drug but under clinical trial,", "39  91  5,000", "for treatment of patient of life threatening", "disease", "40  98  Pre-submission meeting  5,00,000", "41  99  Post-submission meeting  50,000", "Any other application which is not specified", "42  -  50,000", "above", "Note 1: No fee shall be chargeable in respect of application for conduct of", "clinical trial for orphan drugs as defined in clause (x) of rule 2.", "Note 2 : In case of application received from Micro Small Medium", "Enterprises (MSME) firms for conduct of clinical trial, approval of new drug", "and pre and post submission meeting, the fee payable shall be half of the fee", "specified above."], "pre": true}, {"id": "seventh", "name": "Seventh Schedule", "paras": ["FORMULAE TO DETERMINE THE QUANTUM OF COMPENSATION IN THE CASES OF CLINICAL TRIAL RELATED INJURY OR DEATH", "1. Formula in case of clinical trial related death:", "Compensation = (B x F x R) / 99.37", "Where,", "B = Base amount (i.e. 8 lacs)", "F = Factor depending on the age of the trial subject as per Annexure 1 (based on Workmen Compensation Act)", "R = Risk Factor depending on the seriousness and severity of the disease, presence of co-morbidity and duration of disease of the trial subject at the time of enrolment in the clinical trial between a scale of 0.5 and 4.0 as under:", "(1) 0.5 terminally ill patient (expected survival not more than (NMT) 6 months) (2) 1.0 Patient with high risk (expected survival between 6 and 24 months) (3) 2.0 Patient with moderate risk (4) 3.0 Patient with mild risk (5) 4.0 Healthy Volunteers or trial subject of no risk.", "However, in case of patients whose expected mortality is 90% or more within 30 days, a fixed amount of Rs. 2 lacs should be given. 2. Formula in case of clinical trial related injury (other than death):", "For calculation of quantum of compensation related to injury (other than death), the compensation shall be linked to the criteria considered for calculation of compensation in cases of death of the trial subject as referred to in section of this Schedule. The quantum of compensation in case of Clinical Trial related SAE should not exceed the quantum of compensation which would have been due for payment in case of death of the trial subject since the loss of life is the maximum injury possible. As per the definition of SAE, the following sequelae other than death are possible in a clinical trial subject, in which the trial subject shall be entitled for compensation in case the SAE is related to clinical trial.", "(i) A permanent disability:", "In case of SAE causing permanent disability to the trial subject, the quantum of compensation in case of 100% disability shall be 90% of the compensation which would have been due for payment to the nominee(s) in case of death of the trial subject.", "The quantum for less than 100% disability will be proportional to the actual percentage disability the trial subject has suffered.", "Accordingly, following formula shall be applicable for determination of compensation:", "Compensation = (C x D x 90) / (100 x 100)", "Where:", "D = Percentage disability the trial subject has suffered.", "C = Quantum of Compensation which would have been due for payment to the trial subject's nominees) in case of death of the trial subject.", "(ii) Congenital anomaly or birth defect:", "The congenital anomaly or birth defect in a baby may occur due to participation of anyone or both the parent in clinical trial. Following situations may arise due to congenital anomaly or birth defect:", "(a) Still birth;", "(b) Early death due to anomaly;", "(c) No death but deformity which can be fully corrected through appropriate intervention;", "(d) Permanent disability (mental or physical).", "The compensation in such cases would be a lump sum amount such that if that amount is kept by way of fixed deposit or alike, it shall bring a monthly interest amount which is approximately equivalent to half of minimum wage of the unskilled worker (in Delhi). The quantum of compensation in such cases of SAE shall be half of the base amount as per formula for determining the compensation for SAE resulting into death.", "In case of birth defect leading to sub-clauses (c) and (d) of this clause to any child, the medical management as long as required shall be provided by the Sponsor or his representative which will be over and above the financial compensation.", "(iii) Chronic life-threatening disease; and", "(iv) Reversible SAE in case it is resolved", "In case of clinical trial related SAE causing life-threatening disease and reversible SAE in case it is resolved, the quantum of compensation would be linked to the number of days of hospitalisation of the trial subject. The compensation per day of hospitalization shall be equal to the wage loss. The wage loss per day shall be calculated based upon the minimum wage of the unskilled worker (in Delhi).", "Since, in case of hospitalisation of any patient not only the patient loses his/her wage, there will be direct or indirect losses of various kinds including inconvenience, wage loss of attendant, etc. The compensation per day of hospitalization in such case shall be double the minimum wage. Accordingly, following formula shall be applicable for determination of compensation:", "Compensation = 2 X W X N. Where,", "W = Minimum wage per day of the unskilled worker (in Delhi) N = Number of days of hospitalization", "Factor (F) for calculating the amount of compensation", "ANNEXURE 1 Age Factor Not more than... 16 228.54 17 227.49 18 226.38 19 225.22 20 224.00 21 222.71 22 221.37 23 219.95 24 218.47 25 216.91 26 215.28 27 213.57 28 211.79 29 209.92 30 207.98 31 205.95 32 203.85 33 201.66 34 199.40 35 197.06 36 194.64 37 192.14 38 189.56 39 186.90 40 184.17 41 181.37 42 178.49 43 175.54 44 172.52", "45 169.44 46 166.29 47 163.07 48 159.80 49 156.47 50 153.09 51 149.67 52 146.20 53 142.68 54 139.13 55 135.56 56 131.95 57 128.33 58 124.70 59 121.05 60 117.41 61 113.77 62 110.14 63 106.52 64 102.93 65 or more 99.37"]}], "footnotes": {"1": "Enforced w.e.f. 19-3-2019 and Chapter IV is effective from 15-9-2019 (i.e. after 180 days of publication in Official Gazette).", "2": "Substituted for “either clinical part or for both” vide GSR 605(E) dated 31-8-2021, w.e.f. 31-8-2021", "3": "Inserted vide GSR 21(E) dated 18-1-2022, w.e.f. 18-1-2022", "4": "Substituted for “stem cell derived product” vide GSR 14(E) dated 13-1-2022, w.e.f. 13-1-2022.", "5": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "6": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "7": "Chapter IV shall be enforced w.e.f. 15-9-2019 (i.e., 180 days after the publication of these rules in the Official Gazette).", "8": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "9": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "10": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "11": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "12": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "13": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "14": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "15": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "16": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "17": "Substituted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "18": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "19": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "20": "Substituted for “The designate authority” vide GSR 21(E) dated 18-1-2022,w.e.f. 18-1-2022.", "21": "Words “Regulation of” omitted, ibid.", "22": "Substituted for “Central Licensing Authority”, ibid.", "23": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "24": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "25": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022.", "26": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022", "27": "Inserted vide GSR 778(E) dated 14-10-2022, w.e.f. 14-10-2022", "A1": "Clause (b) substituted vide GSR 175(E) dated 9-3-2023 (New Drugs and Clinical Trials (Amendment) Rules, 2023), in force from its publication in the Official Gazette. Added by this course from the Gazette notification; not part of the CDSCO consolidated copy."}, "instruments": [{"id": "gsr364", "title": "G.S.R. 364(E), 11 May 2023: draft rules on registration of Clinical Research Organisations", "status": "DRAFT, published for objections and suggestions within fifteen days. Not in force unless and until finally notified. Text of draft clauses 2 and 3 (new rule 2(1)(ia) and Chapter VA, rules 38A to 38G).", "paras": ["2. In the New Drugs and Clinical Trials Rules, 2019 (hereinafter referred to as said rules), in rule 2, in sub-rule (1), after clause (i), the following clause shall be inserted, namely:— “(ia) ‘Clinical Research Organization’ means a body commercial or academic or of other category owned by an individual or an organisation having status of legal entity by whatsoever name called to which the sponsor may delegate or transfer some or all of the tasks, duties and/or obligations regarding clinical trial, such transfer or delegation of contractual transfers or obligations must be in writing.”", "3. In the said rules, after Chapter V, the following Chapter shall be inserted, namely:—", "“CHAPTER VA", "CLINICAL RESEARCH ORGANISATION", "38A. Registration of Clinical Research Organisation.— No Clinical Research Organisation shall conduct any clinical trial or bioavailability or bioequivalence study of new drug or investigational new drug in human subjects except in accordance with the registration granted by the Central Licencing Authority under these rules.", "38B. Application for Registration of Clinical Research Organisation.—", "1. Application for registration of Clinical Research Organisation for the purpose of conducting clinical trial or bioavailability or bioequivalence study with the Central Licencing Authority shall be made to the said authority in Form CT-07B.", "Provided that bioavailability /bioequivalence study centres already registered under rule 44 of these Rules, shall be considered as Clinical Research Organization defined under rule 2(1)(ia) for bioavailability /bioequivalence study and registered under rule 38A of these Rules and shall not be required to make any application under this rule for bioavailability /bioequivalence study.", "(2) The application under sub-rule (1) shall be accompanied by a fee as specified in the Sixth Schedule such documents and other information as specified in the Ninth Schedule.", "38C. Grant of registration to Clinical research organisation.—", "(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-07B and such further enquiry, if any, as may be considered necessary, and if satisfied, that the requirements of these rules have been complied with, grant registration to the applicant in Form CT-07C within a period of forty-five working days from the date of receipt of its application in Form CT-07B; or if not satisfied, reject the application, for reasons to be recorded in writing, from the date the application was made under sub-rule (1) of rule 38B;", "(2) In case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same are to be rectified, said authority shall inform the applicant of the deficiencies within the period as provided in sub-rule (1);", "(3) The applicant may, after being informed by the Central Licencing Authority as specified in sub-rule (2),—", "i. rectify the deficiencies within a period specified by the Central Licencing Authority; and", "ii. where the applicant rectifies the deficiency within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinize the application again and if satisfied, grant registration to the applicant in Form CT-07C or if not satisfied, reject the application within a period of ninety days reckoned from the day when the required information and documents were provided:", "Provided that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(4) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub rule (3), may file an appeal within forty-five days from the date of receipt of such rejection before the Central Government and that Government may, after such enquiry and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty days.", "38D. Validity period and renewal of registration of Clinical Research Organisation.—", "(1) The registration granted under rule 38C in Form CT-07C shall remain valid for a period of five years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) The clinical Research Organisation shall make an application for renewal of registration in Form CT-07B along with documents as specified in the Ninth Schedule prior to date of expiry of its registration:", "Provided that if the application for renewal of registration is received by the Central Licencing Authority prior to date of expiry, the registration shall continue to be in force until orders are passed by the said authority on the application.", "(3) The Central Licencing Authority shall, after scrutiny of information enclosed with the application and such further enquiry, if any, as may be considered necessary, if satisfied, that the requirements of these rules,—", "i. have been complied with, grant registration or renew registration in Form CT-07C;", "ii. have not been complied with, reject the application, for reasons to be recorded in writing, within a period of forty-five days, from the date the application was made under sub-rule (2).", "38E. Conditions of registration.— The registration granted under rule 38C in Form CT-07C shall be subject to the rule 25 and rule 35 and the following conditions, namely:—", "i. the organisation shall maintain the facilities and adequately qualified and trained personnel as specified in the Ninth Schedule for performing its functions;", "ii. the organisation shall initiate conduct of any clinical trial or bioavailability or bioequivalence study of any new drug or investigational new drug in human subjects after approval of the protocol and other related documents by the Ethics Committee for clinical trial or bioavailability or bioequivalence study, as the case may be, and permission of such study granted by the Central Licencing Authority;", "iii. where a clinical trial site or bioavailability or bioequivalence centre does not have its own Ethics Committee, the study at that site or centre may be initiated after obtaining approval of the protocol from another Ethics Committee of another trial site or an independent Ethics Committee for clinical trial or bioavailability or bioequivalence study registered under rule 8:", "Provided that the approving Ethics Committee shall be responsible for the study at the trial site or centre, as the case may be, and both the approving Ethics Committee and the trial site or the centre are located within the same city or within a radius of fifty km of the trial site or the centre", "iv. the Central Licencing Authority shall be informed about the approval of the Ethics Committee for clinical trial or bioavailability or bioequivalence study;", "v. clinical trial of new drug or investigational new drug shall be registered with the Clinical Trial Registry of India before enrolling the first subject for the study;", "vi. bioavailability or bioequivalence study of investigational new drug shall be registered with the Clinical Trial Registry of India before enrolling the first subject for the study", "vii. study shall be conducted in accordance with the approved protocol and other related documents and as per requirements of Good Clinical Practices Guidelines and provisions of the Act and these rules;", "viii. in case of termination of any such study prematurely, the detailed reasons for such termination shall be communicated to the Central Licencing Authority immediately;", "ix. any report of serious adverse event occurring during study to the subject of such study shall, after due analysis, be forwarded to Central Licencing Authority within fourteen days of its occurrence in the format as specified in Table 5 of the Third Schedule and in compliance with the procedures as specified in rule 42;", "x. in case of an injury to the study subject during study, the complete medical management and compensation in the case of study related injury shall be provided in accordance with the provisions of Chapter VI and details of compensation paid to the trial subject in such cases shall be intimated to the Central Licencing Authority within thirty days of receipt of the order;", "xi. in case of death, permanent disability, injury other than death and permanent disability, as the case may be, of a study subject, compensation shall be provided in accordance with the provisions of Chapter VI and details of compensation paid to the trial subject or his legal heir, as the case may be, in such cases shall be intimated to the Central Licencing Authority within thirty days of receipt of the order;", "xii. if there is any change in constitution or ownership of the Clinical Research Organisation, the organisation shall intimate about the change in writing to the Central Licencing Authority within thirty days of such change;", "xiii. the organisation shall maintain data, records, and other documents related to the conduct of the clinical trials for a period of five years after completion of such study or for at least two years after the expiration date of the batch of the new drug or investigational new drug studied, whichever is later;", "xiv. the clinical research organisation shall allow any officer authorized by the Central Licencing Authority who may be accompanied by an officer authorised by State Licencing Authority to enter the premises with or without prior notice, to inspect any record, statistical observation or results or any documents related to clinical trials and furnish information to the queries raised by such authorised person, in relation to the conduct of the said study;", "xv. the Central Licencing Authority may, if considered necessary, impose additional condition, in writing with justification, in respect of specific clinical trials regarding the objective, design, subject population, subject eligibility, assessments, conduct and treatment of such specific study.", "38F. Inspection of Clinical Research Organisation registered with Central Licencing Authority.— The Clinical Research Organisation registered by the Central Licencing Authority under rule 38C in Form CT-07C, shall allow any officer authorized by the Central Licencing Authority, who may be accompanied by an officer authorized by the State Licencing Authority, to enter the premises of the Clinical Research Organisation with or without prior consent, to inspect, search or seize, any record, document, investigational product and other related material and reply to queries raised by the inspecting authority in relation to functioning of the organisation.", "38G. Suspension or cancellation of registration of Clinical Research Organisation.—", "(1) Where any Clinical Research Organisation fails to comply with any provision of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "a. withdraw show cause notice issued under sub-rule (1)", "b. issue warning in writing to the Clinical Research Organisation describing the deficiency or defect observed during inspection or otherwise, which may affect adversely the right or well-being of trial subject or the validity of any study conducted;", "c. reject the results of the clinical trial or the bioavailability or bioequivalence study ;", "d. suspend for such period as considered appropriate or cancel the registration granted under rule 38C;", "e. debar the organisation to conduct any clinical trial study or bioavailability or bioequivalence study in future for such period as considered appropriate by the Central Licencing Authority.", "(2) Where a Clinical Research Organisation registered under Form CT- 07C against whom an order has been made under sub-rule (1) is aggrieved by the order of the Central Licencing Authority, the Clinical Research Organisation may within a period of sixty days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as may be considered appropriate in the facts and circumstances of the case.”"]}, {"id": "so553", "title": "S.O. 553(E), 9 February 2022: manufacture and stocking of new drugs for COVID-19 under clinical trial", "status": "Notification under section 26B of the Drugs and Cosmetics Act, 1940, limited to new drugs for COVID-19. Its current operation should be checked before relying on it.", "paras": ["S.O. 553(E).—Whereas, there is an outbreak of COVID-19 pandemic throughout India, resulting into dangerous and opportunist infections, disease like Mucormycosis, etc., due to which emergency has arisen to make available new drugs for treatment or management of COVID-19 and related diseases; Whereas, the Central Government is satisfied that making available suitable new drugs is essential to meet the requirements of emergency arising due to pandemic COVID-19, and in public interest it is necessary and expedient to regulate the manufacture and stock for sale or distribution of such new drugs for prevention and treatment of COVID-19 and associated infection; Now, therefore, notwithstanding anything contained in the Drugs Rules, 1945 and New Drugs and Clinical Trials Rules, 2019, for the purposes of making available suitable drugs to meet the requirements of emergency arising due to COVID-19, in exercise of the powers conferred by section 26B of the Drugs and Cosmetics Act, 1940 (23 of 1940), the Central Government, hereby notifies the following, namely:―", "(a) In case a person intends to manufacture and stock a new drug for COVID-19, which is under clinical trial for marketing authorisation for sale or distribution, then, such person shall have to obtain permission in Form CT-06 to conduct clinical trial of such drug and on successful completion of the clinical trial and after obtaining permission in Form CT-23 from the Central Licensing Authority under the New Drugs and Clinical Trials Rules, 2019, he shall make an application under rule 69 or rule 70A or rule 75 or rule 75A of the Drugs Rules, 1945, as the case may be, to the concerned Licensing Authority appointed by the State Government along with the permission obtained for conducting clinical trial in Form CT-06 under the New Drugs and Clinical Trials Rules, 2019, for grant of license to manufacture and stock the drug for sale or distribution under the provisions of the Drugs and Cosmetics Act, 1940 (23 of 1940) (hereinafter referred to as the said Act) and the rules made thereunder:", "Provided that the requirement of prior permission from the Central Licensing Authority under rule 81 of the New Drugs and Clinical Trials Rules, 2019 to manufacture the new drug as required under rule 83 of the said rules shall be deferred in public interest to meet the emergent situation arisen out of COVID-19 and such person shall obtain the said permission after successful completion of the clinical trial and submission of application along with fees, data and particulars in accordance with the provisions of the New Drugs and Clinical Trials Rules, 2019.", "(b) The Central License Approving Authority or the State Licensing Authority, as the case may be, if satisfied that requirements under the provisions of the said Act and the Drugs Rules, 1945 and the New Drugs and Clinical Trials Rules, 2019 have been complied with, grant License in accordance with the provisions of the Drugs Rules, 1945 to manufacture and stock the new drug subject to the condition that the licensee shall sell or distribute the new drug only after obtaining permission for such new drug in Form CT-23 from the Central Licensing Authority under the New Drugs and Clinical Trials Rules, 2019.", "2. In case of any inconsistency between this notification and any rule made under the said Act, the provisions of this notification shall prevail over such rule in public interest so as to meet the emergency which has arisen due to COVID-19 pandemic.", "3. This order shall come into force on the date of its publication in the Official Gazette."]}, {"id": "gsr175", "title": "G.S.R. 175(E), 9 March 2023: New Drugs and Clinical Trials (Amendment) Rules, 2023", "status": "FINAL, in force from publication. Substitutes clause (b) of paragraph 3(1) of the First Schedule; the substituted text is shown in the First Schedule in this reader.", "paras": ["2. In the New Drugs and Clinical Trials Rules, 2019, in the First Schedule, in paragraph 3, in sub paragraph (1), for clause (b), the following shall be substituted, relating to development methodology namely: —", "“(b) (I) The general requirements of non-clinical studies have been specified in the Second Schedule.", "(II) The non-clinical testing methods to assess the safety and efficacy of a new drug or investigational new drug include the following, namely: -", "(i) Cell-based assay;", "(ii) Organ chips and micro physiological systems;", "(iii) Sophisticated computer modeling;", "(iv) Other human biology-based test methods;", "(v) Animal Studies.”."]}]};

/* ===== NDCT-Vax: primary-source layer =====
   App.NDCT (content/rules_data.js) holds the verbatim text of the Rules. This file renders it:
   - the Rule reader page (#rules) and the Form navigator (#forms);
   - "Read the rule" blocks inside modules: <div data-rule="22,23"></div>, <div data-sched="fifth" data-find="periodic safety" data-n="6"></div>,
     <div data-inst="gsr364"></div>;
   - a popover with the verbatim rule when a learner taps any "rule 22" reference in course text. */
App.CODE_HTML = '';
App.ruleBy = {};
(App.NDCT.rules || []).forEach(function (r) { App.ruleBy[r.n] = r; });
App.schedBy = {};
(App.NDCT.schedules || []).forEach(function (s) { App.schedBy[s.id] = s; });
App.instBy = {};
(App.NDCT.instruments || []).forEach(function (s) { App.instBy[s.id] = s; });
App.chapTitle = {};
(App.NDCT.chapters || []).forEach(function (c) { App.chapTitle[c.num] = c.title; });

function ndEsc(s) { return K.esc(String(s)).replace(/&lt;sup&gt;([A-Z]?\d+)&lt;\/sup&gt;/g, '<sup class="fn" title="Amendment note $1">$1</sup>'); }
function ndCls(p) {
  if (/^(<sup>[A-Z]?\d+<\/sup>)?\[?\((\d+[A-Z]?)\)/.test(p)) return 'l1';
  if (/^(<sup>[A-Z]?\d+<\/sup>)?\[?\(([ivxl]+)\)/.test(p) || /^[ivx]+\.\s/.test(p)) return 'l2';
  if (/^(<sup>[A-Z]?\d+<\/sup>)?\[?\(([a-z]{1,2})\)/.test(p) || /^[a-e]\.\s/.test(p)) return 'l3';
  if (/^(<sup>[A-Z]?\d+<\/sup>)?\[?(PROVIDED|Provided|Explanation)/.test(p)) return 'pv';
  return 'l0';
}
App.parasHtml = function (paras) { return paras.map(function (p) { return '<p class="rp ' + ndCls(p) + '">' + ndEsc(p) + '</p>'; }).join(''); };
App.ruleText = function (n) {
  var r = App.ruleBy[n]; if (!r) return '';
  return 'Rule ' + r.n + '. ' + r.title + ' (Chapter ' + r.chapter + ')\n' + r.paras.join('\n').replace(/<\/?sup>/g, '');
};
App.ruleHtml = function (n, open) {
  var r = App.ruleBy[n]; if (!r) return '<p class="note">Rule ' + n + ' not found.</p>';
  return '<details class="rule"' + (open ? ' open' : '') + ' id="rule-' + r.n + '"><summary><span class="rn">Rule ' + r.n + '</span> ' + K.esc(r.title) + '</summary><div class="rbody"><p class="rmeta">Chapter ' + r.chapter + ': ' + K.esc(App.chapTitle[r.chapter] || '') + '</p>' + App.parasHtml(r.paras) + App.fnHtml(r.paras) + '</div></details>';
};
App.fnHtml = function (paras) {
  var seen = {}, out = [];
  paras.join(' ').replace(/<sup>([A-Z]?\d+)<\/sup>/g, function (_, k) { if (!seen[k] && App.NDCT.footnotes[k]) { seen[k] = 1; out.push('<li><b>' + k + '</b> ' + K.esc(App.NDCT.footnotes[k]) + '</li>'); } return _; });
  return out.length ? '<ul class="rfn">' + out.join('') + '</ul>' : '';
};
App.SRC_LINE = 'Verbatim from the New Drugs and Clinical Trials Rules, 2019 (CDSCO consolidated text, as amended to G.S.R. 778(E), 14 October 2022).';

/* blocks placed in module text */
App.renderRuleBlocks = function (root) {
  Array.prototype.forEach.call(root.querySelectorAll('[data-rule]'), function (el) {
    if (el.__done) return; el.__done = true;
    var ns = el.getAttribute('data-rule').split(',').map(function (x) { return +x.trim(); });
    el.className = 'readrule';
    el.innerHTML = '<p class="rr-h"><b>Read the rule</b> <span>' + App.SRC_LINE + '</span></p>' + ns.map(function (n) { return App.ruleHtml(n, false); }).join('');
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-sched]'), function (el) {
    if (el.__done) return; el.__done = true;
    var s = App.schedBy[el.getAttribute('data-sched')]; if (!s) return;
    var f = (el.getAttribute('data-find') || '').toLowerCase(), n = +(el.getAttribute('data-n') || 6), i0 = 0;
    if (f) { i0 = -1; s.paras.some(function (p, i) { if (p.toLowerCase().indexOf(f) >= 0) { i0 = i; return true; } return false; }); }
    if (i0 < 0) { el.innerHTML = ''; return; }

<ul>
<li>The <b>New Drugs and Clinical Trials Rules, 2019</b> were made by the Central Government under sections 12 and 33 of the <b>Drugs and Cosmetics Act, 1940</b>, after consulting the Drugs Technical Advisory Board [G.S.R. 227(E), 19 March 2019].</li>
<li>The regulator is the <b>Central Licencing Authority</b> (CLA): the Drugs Controller, India (rule 3). Its powers may be delegated by written order to an officer not below the rank of Assistant Drugs Controller (India) (rule 4).</li>
<li>The Rules have thirteen chapters (rules 1 to 107), seven Schedules of requirements and an Eighth Schedule of forms. Chapters say <i>what</i> must happen and <i>when</i>; Schedules say <i>what goes in</i>; forms are the vehicles.</li>
<li>Rule 97 switched off Part XA and Schedule Y of the Drugs and Cosmetics Rules, 1945 for new drugs and investigational new drugs for human use. Rule 106 says the NDCT Rules prevail over any inconsistent rule under the Act. Rule 107 saves approvals already granted.</li>
<li>The Rules hand some matters to other instruments, for example licences under the Drugs and Cosmetics Rules, 1945 (rules 56, 79, 83) and the ICMR National Ethical Guidelines (rules 15 to 17, 28, 43). In this course these are <span class="iface">Interface</span> topics.</li>

  sections: [
    { id: 'n1', title: 'Commencement and applicability', html: '<p>The Rules came into force on publication, 19 March 2019, except Chapter IV (Ethics Committees for biomedical and health research), effective from 15 September 2019, 180 days after publication (rule 1 and the amendment notes in the consolidated text).</p><div data-rule="1"></div>' },
    { id: 'n2', title: 'Interface instruments named by the Rules', html: '<ul><li>Drugs and Cosmetics Act, 1940 and Drugs and Cosmetics Rules, 1945: manufacturing and import licences, labelling (rules 56, 64, 77, 79, 82, 83, 96).</li><li>Good Clinical Practices Guidelines (rule 2(1)(p); rule 25(vi)).</li><li>National Ethical Guidelines for Biomedical and Health Research Involving Human Participants, ICMR (rules 15 to 17, 28(4), 43).</li><li>Clinical Trial Registry of India, maintained by ICMR (rule 25(v)).</li></ul><p>The course names these but does not teach their content.</p>' }

  keyPoints: ['The NDCT Rules were made under sections 12 and 33 of the Drugs and Cosmetics Act, 1940.', 'The Central Licencing Authority is the Drugs Controller, India; powers may be delegated under rule 4.', 'Chapters impose duties; Schedules specify content; the Eighth Schedule holds the forms.', 'Rule 97 disapplies Part XA and Schedule Y of the 1945 Rules for new drugs and INDs for human use.', 'Rule 106: the NDCT Rules prevail over inconsistent rules under the Act; rule 107 saves earlier approvals.'],
  quiz: [
    { q: 'Under which provisions were the NDCT Rules made?', options: ['Sections 12 and 33 of the Drugs and Cosmetics Act, 1940', 'The Clinical Establishments Act, 2010', 'The Indian Council of Medical Research Act', 'Section 26B of the Drugs and Cosmetics Act alone'], answer: 0, why: 'The preamble cites sections 12 and 33 of the Drugs and Cosmetics Act, 1940. Section 26B is an emergency power used for specific notifications, not the basis of the Rules.' },
    { q: 'Who is the Central Licencing Authority?', options: ['The Secretary, Department of Health Research', 'The Director General of ICMR', 'The Drugs Controller, India', 'The chair of the Drugs Technical Advisory Board'], answer: 2, why: 'Rule 3 and rule 2(1)(i): the Drugs Controller, India appointed by the Central Government.' },
    { q: 'Where would you find the checklist of essential elements of an informed consent document?', options: ['Second Schedule, Table 1', 'Third Schedule, Table 3', 'Fifth Schedule', 'Seventh Schedule'], answer: 1, why: 'Paragraph 2(f) of the Third Schedule points to Table 3 for the checklist and the format of the informed consent form.' },
    { q: 'What did rule 97 do?', options: ['Repealed the Drugs and Cosmetics Act', 'Inserted rule 122DAA into the 1945 Rules so that Part XA and Schedule Y do not apply to new drugs and INDs for human use', 'Created the Clinical Trial Registry of India', 'Set the fees for trials'], answer: 1, why: 'Chapter XII consists of rule 97, which inserts rule 122DAA into the Drugs and Cosmetics Rules, 1945.' },
    { q: 'If an NDCT provision and another rule under the Act are inconsistent, which applies?', options: ['The other rule', 'The NDCT provision (rule 106)', 'The stricter of the two', 'Neither until the CLA decides'], answer: 1, why: 'Rule 106 makes the NDCT Rules prevail in case of inconsistency.' }

  tasks: [
    { id: 't0', title: 'Map the authorities', level: 'Understand', scenario: '<p>Draw (in words) the chain from Parliament to the officer who signs a decision on the VX-01 trial.</p>', questions: ['<b>(a)</b> Name each link and the provision that creates it.', '<b>(b)</b> Where does the State Licencing Authority appear in the trial phase?'], answer: '<p><b>(a)</b> Parliament → Drugs and Cosmetics Act, 1940 → Central Government makes the NDCT Rules under sections 12 and 33 (preamble) → rule 3 names the Drugs Controller, India as the Central Licencing Authority → rule 4 allows delegation, with prior approval of the Central Government, to an officer not below Assistant Drugs Controller (India), acting under the CLA\'s name and seal → that officer may sign.</p><p><b>(b)</b> As an accompanying authority in inspections: officers of the State Licencing Authority may accompany CLA officers (rules 25(xiii) and 29). Later, licences under the 1945 Rules may involve State authorities (interface).</p>' },
    { id: 't1', title: 'Is the letter valid?', level: 'Apply', scenario: '<p>A query on the VX-01 file is signed by a Deputy Drugs Controller (India) "for Central Licencing Authority".</p>', questions: ['<b>(a)</b> What must be true for this to be a valid act of the CLA?', '<b>(b)</b> What would you ask if in doubt?'], answer: '<p><b>(a)</b> Under rule 4(1), the Drugs Controller, India must have delegated the relevant power by a written order, with prior approval of the Central Government, to an officer not below the rank of Assistant Drugs Controller (India). A Deputy Drugs Controller is above that rank. The officer then exercises the power under the CLA\'s name and seal (rule 4(2)).</p><p><b>(b)</b> Whether a delegation order covering this power exists. A rule 99 post-submission meeting can also be requested within fifteen days of the query to clarify it.</p>' },
    { id: 't2', title: 'Locate four requirements', level: 'Apply', scenario: '<p>Use the Rule reader and Form navigator.</p>', questions: ['<b>(a)</b> Where is the content of a clinical trial application specified?', '<b>(b)</b> Where is the fee?', '<b>(c)</b> Where is the informed consent checklist?', '<b>(d)</b> Where is the formula for compensation for a trial-related death?'], answer: '<p><b>(a)</b> Rule 21(2) requires Form CT-04 with the information and documents in the Second Schedule. <b>(b)</b> The Sixth Schedule (rule 21(2)), with no fee for trials by institutions funded or owned, wholly or partially, by the Central or a State Government. <b>(c)</b> Third Schedule, paragraph 2(f) and Table 3. <b>(d)</b> Seventh Schedule, paragraph 1 (rules 39, 40 and 42 refer to it).</p>' },
    { id: 't3', title: 'Duty, content, vehicle', level: 'Analyse', scenario: '<p>Take one requirement: reporting a serious adverse event.</p>', questions: ['<b>(a)</b> Which chapter rule imposes the duty and the clock?', '<b>(b)</b> Where is the content of the report specified?'], answer: '<p><b>(a)</b> Rule 42(1) (investigator, twenty-four hours) and rule 25(x) (analysed report within fourteen days), in Chapters VI and V. <b>(b)</b> Table 5 of the Third Schedule (data elements for reporting serious adverse events), referred to in rule 25(x).</p>' },
    { id: 't4', title: 'The old SOP', level: 'Evaluate', scenario: '<p>The SOP cites Schedule Y for the trial application.</p>', questions: ['<b>(a)</b> Does Schedule Y apply to VX-01?', '<b>(b)</b> What should the SOP cite instead?'], answer: '<p><b>(a)</b> No. Rule 97 inserted rule 122DAA into the 1945 Rules: Part XA and Schedule Y do not apply to new drugs and investigational new drugs for human use from the commencement of the NDCT Rules. VX-01 is a new drug (rule 2(1)(w)(v)). <b>(b)</b> Rules 19 to 30 (Chapter V, Part A), Form CT-04, and the First, Second and Third Schedules. Approvals granted earlier under the old rules are saved by rule 107.</p>' },
    { id: 't5', title: 'Which instrument for the trial lots?', level: 'Analyse', scenario: '<p>AVRI will make VX-01 clinical lots itself.</p>', questions: ['<b>(a)</b> Which NDCT permission is needed?', '<b>(b)</b> What follows it, and under which instrument?'], answer: '<p><b>(a)</b> Permission to manufacture an IND for clinical trial: application in Form CT-10 (rule 52), permission in Form CT-11 (rule 53). <b>(b)</b> A licence to manufacture under the Act and the Drugs and Cosmetics Rules, 1945, applied for with the CT-11 attached (rule 56). That licence is an interface topic; its requirements are in the 1945 Rules, not the NDCT Rules. Module 5 covers this.</p>' }
  ]
});

App.DRILLS.m01 = [
  { s: 'VX-01, a recombinant protein subunit vaccine never approved anywhere, is to be tested in humans. Is it a "new drug"?', o: ['No: vaccines are biologicals, not drugs', 'Yes, under rule 2(1)(w)(v), and it is always deemed a new drug', 'Yes, but only for four years after approval', 'Only once it is approved for sale'], a: 1, why: 'Rule 2(1)(w)(v) lists "a vaccine, recombinant Deoxyribonucleic Acid (r-DNA) derived product, … intended to be used as drug". The Explanation says the drugs in sub-clauses (iv) and (v) "shall always be deemed to be new drugs".' },
  { s: 'A licensed measles-rubella vaccine is given to adolescents in a study run by a university, testing a new two-dose schedule, with Ethics Committee approval, and the results will not be submitted to the CLA or used for promotion. What is this?', o: ['An academic clinical trial under rule 28, needing no CLA permission', 'A clinical trial needing CLA permission under rule 22', 'Biomedical and health research needing nothing at all', 'A Phase IV trial needing CLA approval of design'], a: 0, why: 'Rule 28(1): no CLA permission is needed where the trial of the permitted drug formulation is solely for academic research for a new indication, route, dose or dosage form, is initiated after EC approval, its observations are not to be submitted to the CLA, and are not used for promotion. A new dose schedule sits within this. If there is doubt, the EC informs the CLA (rule 28(2)).' },
  { s: 'The same study is funded by the vaccine manufacturer, which plans to use the results to seek a label change. What changes?', o: ['Nothing: it remains academic', 'It is no longer an academic clinical trial, because the observations will be submitted to the CLA', 'It becomes BA/BE research', 'It is exempt under rule 27'], a: 1, why: 'Rule 28(1)(iii) requires that the observations are not required to be submitted to the CLA. A trial whose results support a regulatory submission needs permission under Chapter V.' },
  { s: 'VX-01\'s Phase III trial is planned in India, Brazil and Kenya under one protocol. What is it called in the Rules?', o: ['An academic clinical trial', 'A global clinical trial', 'A Phase IV trial', 'An investigational new drug trial only'], a: 1, why: 'Rule 2(1)(q): a global clinical trial is any clinical trial conducted as part of a clinical development of a drug in more than one country.' },
  { s: 'A healthy volunteer faints during a blood draw, recovers fully and goes home. Another healthy volunteer is hospitalised overnight with fever after vaccination. Which is a "serious adverse event" under rule 2(1)(ff)?', o: ['Both', 'Only the fainting', 'Only the hospitalisation', 'Neither, because both recovered'], a: 2, why: 'Rule 2(1)(ff) lists the outcomes that make an untoward medical occurrence serious: death, permanent disability, hospitalisation of an outdoor patient or healthy person, prolongation of hospitalisation of an indoor patient, persistent or significant disability or incapacity, congenital anomaly, birth defect, or a life-threatening event. A faint that resolves without these is an adverse event but not serious. Recovery does not undo hospitalisation.' }
];

  summary: 'Why VX-01 is a new drug for ever, what makes a study a clinical trial, and the definitions that decide which rules apply.',
  objectives: ['Explain why every vaccine is a new drug', 'Distinguish a clinical trial, an academic clinical trial and biomedical and health research', 'Recognise a global clinical trial and an investigational new drug', 'Identify a serious adverse event', 'Name the sponsor and the trial subject in a scenario'],

  reading: [],
  essentials: `
<ul>
<li>Definitions decide which chapters apply. Read rule 2 first when a question starts with "Does this need…?".</li>
<li>A <b>new drug</b> includes, in rule 2(1)(w)(v), "a vaccine, recombinant DNA derived product, living modified organism, monoclonal anti-body, cell or stem cell derived product, gene therapeutic product or xenografts, intended to be used as drug". By the Explanation, these are <b>always</b> deemed new drugs, unlike other new drugs, which stop being new four years after permission.</li>
<li>An <b>investigational new drug</b> is a new chemical or biological entity or substance that has not been approved for marketing as a drug in <b>any country</b> (rule 2(1)(r)).</li>
<li>A <b>clinical trial</b> is any systematic study of a new drug or IND in human subjects to generate data for discovering or verifying its clinical, pharmacological or adverse effects (rule 2(1)(j)). It needs CLA permission and EC approval (rule 19).</li>
<li>An <b>academic clinical trial</b> is a trial of a drug already approved for a certain claim, initiated by an investigator, academic or research institution for a new indication, route, dose or dosage form, with results meant only for academic or research purposes and not for seeking marketing approval from the CLA or any country\'s regulator (rule 2(1)(a)). Under rule 28 it needs EC approval, not CLA permission.</li>
<li>A <b>serious adverse event</b> is an untoward medical occurrence during a clinical trial resulting in death, permanent disability, hospitalisation (of an outdoor patient or healthy person) or prolonged hospitalisation (of an indoor patient), persistent or significant disability or incapacity, congenital anomaly, birth defect, or a life-threatening event (rule 2(1)(ff)).</li>
</ul>`,

    'academic clinical trial': 'A trial of an already approved drug for a new indication, route, dose or dosage form, with results used only for academic or research purposes (rule 2(1)(a), rule 28).',
    'global clinical trial': 'A clinical trial conducted as part of the clinical development of a drug in more than one country (rule 2(1)(q)).',
    'serious adverse event': 'An untoward medical occurrence during a clinical trial with one of the outcomes listed in rule 2(1)(ff), such as death, permanent disability, hospitalisation, congenital anomaly or a life-threatening event.',

  explainers: [],
  cases: [
    {
      id: 'c1', title: 'Why VX-01 is always a new drug', aim: 'apply rule 2(1)(w) to vaccines and see why the "four years" rule does not help them.', minutes: 25,
      need: `<p>Rule 2(1)(w) lists five kinds of new drug. Sub-clauses (i) to (iii) cover drugs not yet approved, approved drugs with new claims, and new fixed-dose combinations. Sub-clause (iv) covers modified-release forms and novel delivery systems. Sub-clause (v) covers vaccines, r-DNA products, living modified organisms, monoclonal antibodies, cell or stem cell derived products, gene therapeutic products and xenografts.</p>
<p>The Explanation adds a time limit: most new drugs stop being "new" four years after the CLA's permission. Those in sub-clauses (iv) and (v) <b>always</b> remain new drugs. So every vaccine, including a vaccine that has been on the Indian market for decades, is a new drug for the purposes of these Rules. That is why a trial of an old vaccine can still fall under Chapter V.</p>
<p>Use the Rule reader to read the whole of rule 2: it is long, but every later module depends on it.</p><div data-rule="2"></div>`,
      scenario: '<p>A team member argues that VX-01 is a "biological", that biologicals are regulated by the 1945 Rules, and that the NDCT Rules apply only to chemical drugs.</p>',

    {

      need: `<p>Three categories matter:</p>
<ul><li><b>Clinical trial</b> (rule 2(1)(j)) of a new drug or IND: needs CLA permission and EC approval (rule 19).</li>

<li><b>Biomedical and health research</b> (rule 2(1)(h)): reviewed by an EC registered under rule 17, in line with the ICMR National Ethical Guidelines (rules 15, 16).</li></ul>
<div data-rule="28"></div>`,

      need: `<p>Reporting duties attach to defined events and defined people:</p>

  sections: [
    { id: 'n1', title: 'Rule 2(1)(w): the five limbs of "new drug"', html: '<p>(i) A drug, including an API or phytopharmaceutical drug, not used in the country to any significant extent and not approved as safe and efficacious by the CLA with respect to its claims; (ii) an approved drug with modified or new claims, including indication, route, dosage and dosage form; (iii) a new fixed-dose combination or changed ratio; (iv) a modified or sustained release form or novel delivery system; (v) vaccines, r-DNA products, living modified organisms, monoclonal antibodies, cell or stem cell derived products, gene therapeutic products or xenografts. Limbs (iv) and (v) are always deemed new drugs; the others for four years from permission. Read the exact text in the Rule reader.</p>' },
    { id: 'n2', title: 'Academic clinical trial conditions (rule 28(1))', html: '<ol><li>Permitted drug formulation, solely for academic research, for a new indication, route, dose or dosage form.</li><li>Initiated after prior approval by the EC for clinical trial.</li><li>Observations not required to be submitted to the CLA.</li><li>Observations not used for promotional purposes.</li></ol><p>Conducted per the approved protocol and the ICMR National Ethical Guidelines (rule 28(4)).</p>' }
  ],
  keyPoints: ['Vaccines are new drugs under rule 2(1)(w)(v) and are always deemed new.', 'A clinical trial of a new drug or IND needs CLA permission and EC approval (rule 19).', 'An academic clinical trial needs all four rule 28(1) conditions; doubt goes to the CLA through the EC within thirty working days.', 'A global clinical trial is part of the clinical development of a drug in more than one country (rule 2(1)(q)).', 'Seriousness is defined by outcome (rule 2(1)(ff)); healthy volunteers are trial subjects (rule 2(1)(jj)).'],
  quiz: [
    { q: 'A vaccine has been marketed in India for 15 years. Under rule 2(1)(w), is it still a new drug?', options: ['No, the four-year period has long passed', 'Yes, sub-clause (v) products are always deemed new drugs', 'Only if a new indication is sought', 'Only if imported'], answer: 1, why: 'The Explanation to rule 2(1)(w) excludes sub-clauses (iv) and (v) from the four-year limit: they shall always be deemed new drugs.' },

    { q: 'An EC is unsure whether a study is academic. What does rule 28 require?', options: ['The investigator decides', 'The EC informs the CLA of its view within thirty working days; the CLA clarifies within thirty working days', 'The study must be stopped', 'The sponsor applies in Form CT-04 anyway'], answer: 1, why: 'Rule 28(2) and (3). If the CLA does not reply within thirty working days, it is presumed no permission is required.' },

  tasks: [
    { id: 't0', title: 'Rebut the "biological" argument', level: 'Apply', scenario: '<p>Your colleague says the NDCT Rules do not apply to VX-01 because it is a biological.</p>', questions: ['<b>(a)</b> Quote the provision that answers him.', '<b>(b)</b> What follows for the trial?'], answer: '<p><b>(a)</b> Rule 2(1)(w)(v): a new drug includes "a vaccine … intended to be used as drug", and by the Explanation such products are always deemed new drugs. <b>(b)</b> A trial of VX-01 is a clinical trial of a new drug or IND (rule 2(1)(j)), so it needs CLA permission and EC approval (rule 19), with the First Schedule principles applying (rule 19(2)).</p>' },
    { id: 't1', title: 'An old vaccine, a new study', level: 'Analyse', scenario: '<p>A company wants to run a lot-to-lot consistency study of a vaccine licensed in India twenty years ago, to support a new manufacturing site.</p>', questions: ['<b>(a)</b> Is the vaccine a new drug?', '<b>(b)</b> Could this be an academic clinical trial?'], answer: '<p><b>(a)</b> Yes: rule 2(1)(w)(v) with the Explanation. <b>(b)</b> No. It is initiated by a company, not an investigator, academic or research institution (rule 2(1)(a)), and its data are meant for the regulator, so rule 28(1)(iii) is not met. It is a clinical trial needing permission (rules 19, 21, 22).</p>' },
    { id: 't2', title: 'The PhD schedule study', level: 'Apply', scenario: '<p>As in the case: a licensed measles-rubella vaccine, a new two-dose schedule, a university PhD, no regulatory use.</p>', questions: ['<b>(a)</b> Check each condition of rule 28(1).', '<b>(b)</b> Who must approve it, and what must the EC do if unsure?'], answer: '<p><b>(a)</b> (i) Permitted formulation for a new dose schedule, solely academic: met. (ii) Prior EC approval: required. (iii) No submission to the CLA: met. (iv) No promotional use: met. <b>(b)</b> The EC for clinical trial (registered under rule 8). If it doubts whether it overlaps with a clinical trial, it informs the CLA of its view within thirty working days of receiving the application; the CLA clarifies within thirty working days, failing which no permission is presumed required (rule 28(2), (3)).</p>' },
    { id: 't3', title: 'When funding changes the category', level: 'Evaluate', scenario: '<p>The manufacturer now funds the study and wants a label change.</p>', questions: ['<b>(a)</b> Does it remain academic?', '<b>(b)</b> What application is needed?'], answer: '<p><b>(a)</b> No: the observations will be submitted to the CLA, failing rule 28(1)(iii), and may support promotion of the new schedule, failing (iv). <b>(b)</b> CLA permission to conduct a clinical trial: Form CT-04 under rule 21, decided under rule 22 (or rules 23, 24 if they apply). Funding alone does not change the category; the intended use of the data does.</p>' },
    { id: 't4', title: 'Which events are serious?', level: 'Apply', scenario: '<p>The three events in Case 3.</p>', questions: ['<b>(a)</b> Classify each event.', '<b>(b)</b> Who is the "trial subject" for the congenital anomaly?'], answer: '<p><b>(a)</b> Faint with full recovery: adverse event, not serious. Overnight admission of a healthy volunteer with fever: serious (hospitalisation). Congenital anomaly: serious (rule 2(1)(ff) lists congenital anomaly and birth defect). <b>(b)</b> The mother is the trial subject; the anomaly is a sequela of her participation. Rule 41(f) treats an adverse effect on a child in utero because of a parent\'s participation as trial-related injury, and the Seventh Schedule has a formula for congenital anomaly (Module 7).</p>' },
    { id: 't5', title: 'Name the parties', level: 'Understand', scenario: '<p>AVRI designs and manages the VX-01 programme; a district hospital consultant runs one site; a contract organisation does monitoring.</p>', questions: ['<b>(a)</b> Who is the sponsor? Who is the investigator?', '<b>(b)</b> Does the contract organisation become the sponsor?'], answer: '<p><b>(a)</b> AVRI is the sponsor: responsible for initiation and management (rule 2(1)(hh)). The consultant is the investigator: responsible for conducting the trial at the site (rule 2(1)(t)). <b>(b)</b> No. Delegating tasks does not change who the sponsor is under the Rules. Registration of contract research organisations was proposed in draft G.S.R. 364(E), 2023, which is not in force (Module 6).</p>' }

App.DRILLS.m02 = [
  { s: 'Site A (a medical college) has an Ethics Committee registered with the CLA in Form CT-02. Can it approve the VX-01 protocol for Site A?', o: ['Yes', 'No, only the CLA can approve protocols', 'Only if it is also registered with DHR', 'Only after the CLA grants CT-06'], a: 0, why: 'Rule 6(1) requires approval of an EC for clinical trial registered under rule 8, and rule 25(i) requires each site to start after approval by the EC of that site registered under rule 8. The order of CLA permission and EC approval is not fixed, but both are needed before the trial starts at the site (rule 19(1)).' },
  { s: 'Site B, a district hospital 30 km from Site A, has no Ethics Committee. Can Site A\'s EC approve and oversee VX-01 at Site B?', o: ['No, every site needs its own EC', 'Yes, within the same city or a radius of 50 km, and Site A\'s EC then becomes responsible for the study at Site B', 'Yes, at any distance', 'Only with CLA permission for the distance'], a: 1, why: 'Rule 25(ii): where a site has no EC, it may start after approval from the EC of another trial site or an independent EC constituted under rule 7. The approving EC is responsible for the study at that site, and both must be within the same city or within a radius of 50 km.' },
  { s: 'Site C is 80 km away and has no EC. What is lawful?', o: ['Site A\'s EC approves it', 'An independent or other site\'s EC within the same city or 50 km of Site C approves it', 'No EC is needed for a site with fewer than 50 participants', 'The CLA approves the protocol for Site C directly'], a: 1, why: 'The 50 km condition in the second proviso to rule 25(ii) is measured from the trial site. Site A\'s EC is too far; Site C needs an EC (its own, another site\'s, or an independent one) within the same city or 50 km.' },

registerModule({

  format: 'cases',

  reading: [],
  essentials: `
<ul>
<li>Two kinds of committee exist. An <b>EC for clinical trial</b> (and BA/BE studies) is registered with the <b>CLA</b> under rule 8 (Form CT-01 → CT-02). An <b>EC for biomedical and health research</b> is registered with the authority designated by the Department of Health Research under rule 17 (Form CT-01 → CT-03). A vaccine trial needs the first kind (rules 6, 25(i)).</li>
<li>Composition (rule 7): at least seven members, including a lay person, a woman, a legal expert and an independent member such as a social scientist or ethicist; at least half not affiliated with the institution; an unaffiliated chairperson; an affiliated member secretary.</li>
<li>Quorum (rule 12(1)): at least five members present: medical scientist, clinician, legal expert, social scientist or similar, and lay person.</li>
<li>Registration: the CLA decides within <b>forty-five working days</b>; if it does not, registration is deemed granted, and the EC informs the CLA in Form CT-02A before starting (rule 8). Registration lasts five years (rule 9); renewal is sought ninety days before expiry (rule 10).</li>
<li>A site without its own EC may use another site's EC or an independent EC, which becomes responsible for that site; both must be in the <b>same city or within 50 km</b> (rule 25(ii)).</li>
<li>For paediatric trials the reviewing EC should include members knowledgeable about paediatric, ethical, clinical and psychosocial issues (First Schedule, para 3(3)(B)(vii)).</li>
</ul>`,
  story: 'VX-01 will run at four sites: Site A, a medical college with a registered EC; Site B, a district hospital 30 km from Site A with no EC; Site C, 80 km away with no EC; and Site D, a research institute whose committee is registered only for biomedical and health research. The team must arrange lawful ethics review for each.',
  defs: {
    'Ethics Committee': 'For a clinical trial: a committee constituted under rule 7 and registered with the CLA under rule 8.',

<div data-rule="7,8,12"></div>`,

      id: 'c2', title: 'Covering every site', aim: 'arrange lawful EC oversight for sites with and without their own committee.', minutes: 45,
      need: `<p>Every site is overseen by an EC for clinical trial registered under rule 8, before and throughout the trial (rule 20). A site starts only after its EC approves (rule 25(i)). If a site has no EC, rule 25(ii) allows approval by the EC of another site or an independent EC constituted under rule 7. The approving EC is then responsible for the study at that site, and both must be in the same city or within 50 km. If a site's EC rejects the protocol, the details go to the CLA before another EC is approached (rule 25(iii)). The CLA must be told of each EC approval within fifteen working days (rule 25(iv)).</p>
<div data-rule="6,20"></div>`,

  sections: [
    { id: 'n1', title: 'Two registrations, two authorities', html: '<table class="data"><tr><th></th><th>EC for clinical trial / BA-BE</th><th>EC for biomedical and health research</th></tr><tr><td>Rules</td><td>6 to 14</td><td>15 to 18</td></tr><tr><td>Registers with</td><td>CLA</td><td>Authority designated by DHR</td></tr><tr><td>Forms</td><td>CT-01 → CT-02 (or CT-02A deemed)</td><td>CT-01 → provisional, then CT-03</td></tr><tr><td>Decision</td><td>45 working days (rule 8(3))</td><td>Provisional on receipt (2 years); renewal decision 45 working days (rule 17(8))</td></tr><tr><td>Validity</td><td>5 years (rule 9)</td><td>5 years (rule 17(9))</td></tr></table><p>An institution doing both needs both registrations (rule 16(5)).</p>' },

  quiz: [
    { q: 'What is the minimum membership of an EC for clinical trial?', options: ['Five', 'Seven', 'Nine', 'Eleven'], answer: 1, why: 'Rule 7(1): a minimum of seven members. Five is the quorum for reviewing a protocol (rule 12(1)).' },
    { q: 'Who must chair the EC?', options: ['The head of the institution', 'An affiliated senior clinician', 'A member not affiliated with the institution', 'The legal expert'], answer: 2, why: 'Rule 7(3): one member not affiliated with the institute shall be the Chairperson.' },
    { q: 'The CLA has not replied to an EC\'s registration application within forty-five working days. What follows?', options: ['The application lapses', 'Registration is deemed granted; the EC informs the CLA in Form CT-02A before starting', 'The EC must reapply', 'The EC may work but cannot approve trials'], answer: 1, why: 'Rule 8(3)(ii) proviso and rule 8(3A).' },
    { q: 'How far may an approving EC be from a site without its own EC?', options: ['Any distance', 'Same city or within 50 km', 'Same state', 'Within 100 km'], answer: 1, why: 'Rule 25(ii), second proviso.' },
    { q: 'For how long must the EC keep trial records?', options: ['Two years after approval', 'Three years', 'Five years after completion of the trial', 'Until the drug is approved'], answer: 2, why: 'Rule 13(1) and (2).' }
  ],
  tasks: [
    { id: 't0', title: 'Audit Site A\'s committee', level: 'Evaluate', scenario: '<p>Use the membership in Case 1.</p>', questions: ['<b>(a)</b> Does it meet rule 7? List each requirement.', '<b>(b)</b> What would you change?'], answer: '<p><b>(a)</b> Seven or more members: yes (eight). Lay person: yes. Legal expert: yes. Independent member (social scientist or similar): yes. <b>Woman member: not stated; must be confirmed.</b> At least 50% unaffiliated: the four faculty clinicians and the hospital\'s legal adviser are affiliated (5 of 8), so only 3 of 8 are unaffiliated: <b>fails rule 7(2)</b>. Unaffiliated chairperson: <b>fails rule 7(3)</b>, the chair is a faculty clinician. <b>(b)</b> Add or replace members so at least four of eight are unaffiliated (for example an outside clinician and an outside lawyer), ensure at least one woman member, appoint an unaffiliated member as chair, and an affiliated member as member secretary (rule 7(4)). Report the changes to the CLA within thirty working days (rule 12(4)).</p>' },
    { id: 't1', title: 'Run the registration clock', level: 'Apply', scenario: '<p>Application received on 1 December 2026; holidays 25 December 2026 and 26 January 2027.</p>', questions: ['<b>(a)</b> Use the regulatory clock to find the decision deadline.', '<b>(b)</b> If nothing arrives, what must the EC do before reviewing VX-01?'], answer: '<p><b>(a)</b> Forty-five working days, Monday to Friday, skipping the listed holidays and not counting the day of receipt: Thursday 4 February 2027. Note that the Rules do not define working days. <b>(b)</b> Treat registration as deemed granted (rule 8(3) proviso) and inform the CLA in Form CT-02A before initiating its functions (rule 8(3A)).</p>' },
    { id: 't2', title: 'Plan ethics coverage for four sites', level: 'Apply', scenario: '<p>Sites A to D as in the story.</p>', questions: ['<b>(a)</b> Which EC can approve each site?', '<b>(b)</b> What must be reported to the CLA, and when?'], answer: '<p><b>(a)</b> A: its own rule 8 EC. B (30 km, no EC): Site A\'s EC may approve and becomes responsible for the study at B (rule 25(ii)). C (80 km, no EC): Site A\'s EC is too far; use an independent or another site\'s rule 8 EC within the same city or 50 km of C. D: its committee is registered under rule 17 only, so it cannot approve a clinical trial; it must register under rule 8, or use another rule 8 EC within 50 km. <b>(b)</b> Each EC approval within fifteen working days (rule 25(iv)).</p>' },
    { id: 't3', title: 'A rejection at one site', level: 'Analyse', scenario: '<p>Site C\'s nearest independent EC rejects the protocol. The team wants to approach another independent EC.</p>', questions: ['<b>(a)</b> What must happen first?', '<b>(b)</b> Why does this rule exist?'], answer: '<p><b>(a)</b> Rule 25(iii): details of the rejection must be submitted to the CLA before seeking approval of another EC for the same site. <b>(b)</b> To prevent "ethics shopping": the regulator sees the concerns raised, and a second committee cannot be used to bypass them unseen.</p>' },
    { id: 't4', title: 'The outdated consent form', level: 'Evaluate', scenario: '<p>As in Case 3.</p>', questions: ['<b>(a)</b> What can Site A\'s EC do under rule 11?', '<b>(b)</b> Whom must it tell?'], answer: '<p><b>(a)</b> As the approving EC responsible for Site B (rule 25(ii)), it reviews the conduct of the trial (rule 11(ii)); if it concludes the trial is likely to compromise participants\' rights, safety or well-being, it may order discontinuation or suspension (rule 11(v)). It should also require re-consent with the approved form: consent documents and changes must be EC-approved and furnished to the CLA (Third Schedule, para 2(b)). <b>(b)</b> If it suspends or discontinues, the head of the institution conducting the trial and the CLA (rule 11(v)).</p>' },
    { id: 't5', title: 'Consequences for a failing EC', level: 'Understand', scenario: '<p>An inspection finds that an EC approved protocols without a quorum.</p>', questions: ['<b>(a)</b> What procedure must the CLA follow?', '<b>(b)</b> What actions may it take?'], answer: '<p><b>(a)</b> Show cause notice, reply, opportunity to be heard (rule 14(1), (2)). <b>(b)</b> Withdraw the notice; warn; reject trial results; suspend or cancel registration; debar members (rule 14(3)). Appeal lies to the Central Government within sixty working days (rule 14(4)).</p>' }

registerModule({
  id: 'm03', num: 3, part: 'Foundations',
  title: 'Development science the regulator expects',
  book: 'Rule 19(2); First and Second Schedules',
  minutes: 150,
  summary: 'The principles every trial must follow, the phases of development, the non-clinical package, and the rules for children and pregnant women, read for a vaccine.',
  objectives: ['State the general principles in the First Schedule', 'Describe Phases I to IV as the Rules define them', 'Explain the non-clinical requirements, including the 2023 amendment', 'Apply the requirement for Indian-discovered drugs to start in India from Phase I', 'Plan studies in children and pregnant women within the First Schedule'],
  format: 'cases',
  ruleRefs: [19],
  reading: [],
  essentials: `
<ul>
<li>Everyone involved in a clinical trial follows the general principles of the <b>First Schedule</b> (rule 19(2)): protection of subjects as in the Third Schedule and the GCP Guidelines; shared responsibility of sponsor, investigator and EC; non-clinical or earlier clinical data sufficient for safety.</li>
<li>Non-clinical studies are planned around the product, the disease, the duration of exposure and the route. Since <b>G.S.R. 175(E), 9 March 2023</b>, the First Schedule names cell-based assays, organ chips and micro physiological systems, sophisticated computer modelling, other human biology-based methods, and animal studies. The general requirements stay in the Second Schedule.</li>
<li>The first-in-human dose is calculated carefully from non-clinical pharmacology and toxicology (First Schedule para 3(1)(c)).</li>
<li>Phases I to IV are described in First Schedule para 3(2). Permission is generally given in stages, considering earlier data (Second Schedule para 1(1)(iv)(c)).</li>
<li>For a product <b>discovered or developed in India</b>, trials are required in India right from Phase I (Second Schedule para 1(1)(iv)(a)).</li>
<li>Children and pregnant women: paediatric data come after initial adult safety data unless that would be uninformative or unsafe; pregnant or nursing women are enrolled only when the product is meant for them and other data are not suitable (First Schedule para 3(3)).</li>
<li>The Second Schedule, para 1(2)(i), allows data requirements to differ for categories such as biological products. Vaccine-specific non-clinical guidance is <span class="iface">Interface</span>.</li>
</ul>`,
  story: 'AVRI is preparing the dossier for VX-01\'s first-in-human study. The vaccine is ultimately meant for infants and, in a later programme, for pregnant women to protect newborns. The team must show the regulator a development plan that fits the First and Second Schedules.',
  defs: {
    'First Schedule': 'General principles and practices for clinical trials (rules 19 and 31).',
    'Second Schedule': 'Requirements and guidelines for permission to import or manufacture a new drug for sale or to undertake a clinical trial.',
    'first in human': 'The first administration of an investigational new drug to people.',
    'Phase I': 'Studies of safety and tolerability with the initial administration of an IND into humans, usually with non-therapeutic objectives.'
  },
  explainers: [],
  cases: [
    {
      id: 'c1', title: 'Principles and the non-clinical package', aim: 'match the VX-01 non-clinical plan to the First and Second Schedules.', minutes: 50,
      need: `<p>The First Schedule sets principles, not a checklist. It asks that non-clinical studies be planned around four factors (product, disease, duration and exposure, route), lists the methods that may be used (as amended in 2023), and asks for a carefully calculated first-in-human dose. The Second Schedule sets the general requirements: animal pharmacology (para 3), animal toxicology (para 2), and data such as local toxicity for products given by routes other than oral, which is relevant to an injected vaccine.</p>
<div data-sched="first" data-find="1. General Principles" data-n="5" data-label="general principles"></div>
<div data-sched="first" data-find="(1) Non-clinical studies" data-n="14" data-label="non-clinical studies, as amended by G.S.R. 175(E)"></div>
<div data-inst="gsr175"></div>`,
      scenario: '<p>AVRI\'s non-clinical package has: mouse and rabbit immunogenicity, a repeat-dose toxicity study in rabbits by the intramuscular route with local tolerance at the injection site, an in vitro cell-based assay of the adjuvant, and a computer model of antigen dose-response. A reviewer asks whether the cell-based and modelling data "count".</p>',
      widgets: '<div data-widget="drill" data-set="m03"></div>',
      tasks: [0, 1],
      takeaway: 'Plan non-clinical work around the product, disease, exposure and route; since 2023 the First Schedule expressly recognises human biology-based and computational methods alongside animal studies.'
    },
    {
      id: 'c2', title: 'Phases, stages and where to start', aim: 'apply the phase definitions and the "India from Phase I" requirement.', minutes: 50,
      need: `<p>Phase I estimates safety and tolerability with initial administration, may be done in healthy subjects, and should preferably be run by investigators trained in clinical pharmacology with facilities to observe subjects closely. Phase II evaluates effectiveness and short-term risks; Phase III confirms benefit; Phase IV follows approval. Permission is generally given stage by stage. An Indian-discovered product starts in India at Phase I. A product discovered abroad submits its foreign Phase I data, after which the CLA may permit a repeat Phase I or Phase II, and Phase III concurrently with global trials.</p>
<div data-sched="first" data-find="(2) Phases in Clinical Trial" data-n="16" data-label="phases"></div>
<div data-sched="second" data-find="(iv) human clinical pharmacology data" data-n="5" data-label="human clinical pharmacology data"></div>`,
      scenario: '<p>A foreign partner offers to run VX-01\'s first-in-human study in its own country, faster, and hand the data to AVRI for an Indian Phase II.</p>',
      widgets: '',
      tasks: [2, 3],
      takeaway: 'For an Indian-discovered vaccine, Phase I must be in India; permission comes in stages as the data accumulate.'
    },
    {
      id: 'c3', title: 'Infants and pregnant women', aim: 'sequence studies in special populations within the First Schedule.', minutes: 50,
      need: `<p>First Schedule para 3(3) covers special populations. For children: timing depends on the product and disease; where the disease mainly affects children, data should come from children except initial safety and tolerability, usually first in adults; the reviewing EC should include paediatric expertise. For pregnant or nursing women: enrol only when the product is intended for them and data from other women are not suitable; for products intended for pregnancy, follow-up of the pregnancy, foetus and child is required.</p>
<div data-sched="first" data-find="(3) Studies in special populations" data-n="20" data-label="special populations"></div>`,
      scenario: '<p>VX-01 is aimed at infants. A second indication, maternal immunisation in the third trimester to protect newborns, is planned for later.</p>',
      widgets: '',
      tasks: [4, 5],
      takeaway: 'Age de-escalation from adults to children, and pregnancy studies only for products meant for pregnancy with follow-up of mother and child, are built into the First Schedule.'
