 of its proceedings.", "(iv) Ethics committee should make, at appropriate intervals, an ongoing review of the trials for which they have reviewed the protocol. Such a review may be based on the periodic study progress reports furnished by the investigators or monitoring and internal audit reports furnished by the sponsor or visiting the study sites.", "(v) In case an ethics committee revokes its approval accorded to a trial protocol, it must record the reasons for doing so and at once communicate such a decision to the Investigator as well as to the Central Licensing Authority.", "(vi) In case of serious adverse event occurring to the trial subject, the ethics committee shall forward its report or order on the event, after due analysis, along with its opinion on the financial compensation, if any, to be paid by the sponsor or his representative or institution or centre, as the case may be, in accordance with Chapter VI of these rules.", "TABLE 1 INFORMATION TO BE SUBMITTED BY AN APPLICANT FOR GRANT OF REGISTRATION OF ETHICS COMMITTEE AND FORMAT FOR ACCORDING APPROVAL (A) Information required to be submitted by the applicant for registration of ethics committee:", "(a) Name of the ethics committee.", "(b) Authority under which the ethics committee has been constituted, membership requirements, the term of reference, conditions of appointment and the quorum required.", "(c) The procedure for resignation, replacement or removal of members.", "(d) Address of the office of the ethics committee.", "(e) Name, address, qualification, organisational title, telephone number, fax number, email, mailing address and brief profile of the Chairperson.", "(f) Names, qualifications, organisational title, telephone number, fax number, e-mail and mailing address of the members of the ethics committee. The information shall also include member's specialty (primary, scientific or non-scientific), member's affiliation with institutions and patient group representation, if any.", "(g) Details of the supporting staff.", "(h) The standard operating procedures to be followed by the committee in general.", "(i) Standard operating procedures to be followed by the committee for vulnerable population.", "(j) Policy regarding training for new and existing committee members along with standard operating procedures.", "(k) Policy to monitor or prevent the conflict of interest along with standard operating procedures.", "(1) If the committee has been audited or inspected before, give details.", "(B) Format for according approval to clinical trial protocol by the ethics committee", "To", "Dr.", "Dear Dr...................................", "The Institutional ethics committee or independent ethics committee (state name of the committee, as appropriate) reviewed and discussed your application to conduct the clinical trial entitled \"..................\"on................(date).", "The following documents were reviewed:", "(a) Trial protocol (including protocol amendments), dated ...................version No.(s)............", "(b) Patient information sheet and informed consent form (including updates, if any) in English or vernacular language.", "(c) Investigator's brochure, dated....................... ,Version No...................... Proposed methods for patient accrual including advertisements etc. proposed to be used for the purpose.", "(d) Principal investigator's current Curriculum Vitae.", "(e) Insurance policy or compensation for participation and for serious adverse events occurring during the study participation.", "(f) Investigator's agreement with the sponsor.", "(g) Investigator's undertaking (Table 4).", "The following members of the ethics committee were present at the meeting held on (date, time, place).", "...........................................................Chairperson of the ethics committee;", "................................................Member-Secretary of the ethics committee;", "....................................................Name of each member with designation;", "We approve the trial to be conducted in its presented form.", "The ethics committee to be informed about the progress of the study, any Serious Adverse Events (SAE) occurring in the course of the study, any changes in the protocol and patient information or informed consent and to be provided with a copy of the final report.", "Yours sincerely, Member Secretary, Ethics Committee", "TABLE 2 CONTENTS OF THE PROPOSED PROTOCOL FOR CONDUCTING CLINICAL TRIALS Title Page", "(a) Full title of the clinical study,", "(b) Protocol, Study number, and protocol version number with date.", "(c) The Investigational New Drug (IND) name/number of the investigational drug.", "(d) Complete name and address of the Sponsor and contract research organization, if any.", "(e) List of the investigators who are conducting the study, their respective institutional affiliations and site locations (f) Name of clinical laboratories and other departments and/or facilities participating in the study.", "Table of Contents", "1. Background and introduction", "(a) Preclinical experience", "(b) Clinical experience", "Previous clinical work with the new drug should be reviewed here and a description of how the current protocol extends existing data should be provided. If this is an entirely new indication, how this drug was considered for this should be discussed. Relevant information regarding pharmacological, toxicological and other biological properties of the drug/biologic/ medical device, and previous efficacy and safety experience should be described.", "2. Study rationale: This section should describe a brief summary of the background information relevant to the study design and protocol methodology. The reasons for performing this study in the particular population included by the protocol should be provided.", "3. Study objective (primary as well as secondary) and their logical relation to the study design.", "4. Study design", "(a) Overview of the study design: Including a description of the type of study (i.e., double-blind, multicentre, placebo controlled, etc.), a detail of the specific treatment groups and number of study Subjects in each group and investigative site, Subject number assignment, and the type, sequence and duration of study periods.", "(b) Flow chart of the study.", "(c) A brief description of the methods and procedures to be used during the study.", "(d) Discussion of study design: This discussion details the rationale for the design chosen for this study.", "5. Study population: the number of subjects required to be enrolled in the study at the investigative site and by all sites along with a brief description of the nature of the subject population required is also mentioned.", "6. Subject eligibility—", "(a) Inclusion criteria (b) Exclusion criteria", "7. Study assessments—plan, procedures and methods to be described in detail.", "8. Study conduct stating the types of study activities that would be included in this section would be: medical history, type of physical examination, blood or urine testing, electrocardiogram (ECG), diagnostic testing such as pulmonary function tests, symptom measurement, dispensation and retrieval of medication, Subject cohort assignment, adverse event review, etc.", "Each visit should be described separately as Visit 1, Visit 2, etc.", "Discontinued subjects: Describes the circumstances for Subject withdrawal, dropouts, or other reasons for discontinuation of Subjects. State how drop outs would be managed and if they would be replaced describe the method of handling of protocol waivers, if any. The person who approves all such waivers should be identified and the criteria used for specific waivers should be provided.", "Describes how protocol violations will be treated, including conditions where the study will be terminated for non-compliance with the protocol.", "9. Study treatment—", "(a) Dosing schedule (dose, frequency, and duration of the experimental treatment) Describe the administration of placebos and/or dummy medications if they are part of the treatment plan. If applicable, concomitant drug(s), their doses, frequency, and duration of concomitant treatment should be stated.", "(b) Study drug supplies and administration: A statement about who is going to provide the study medication and that the investigational drug formulation has been manufactured following all regulations Details of the product stability, storage requirements and dispensing requirements should be provided.", "(c) Dose modification for study drug toxicity: Rules for changing the dose or stopping the study drug should be provided.", "(d) Possible drug interactions", "(e) Concomitant therapy: The drugs that are permitted during the study and the conditions under which they may be used are detailed here. Describe the drugs that a Subject is not allowed to use during parts of or the entire study. If any washout periods for prohibited medications are needed prior to enrolment, these should be described here.", "(f) Blinding procedures: A detailed description of the blinding procedure if the study employs a blind on the Investigator and/or the Subject.", "(g) Un-blinding procedures: If the study is blinded, the circumstances in which un-blinding may be done and the mechanism to be used for un- blinding should be given.", "10. Adverse Events:", "Description of expected adverse events should be given. Procedures used to evaluate an adverse event should be described.", "11. Ethical considerations: Give the summary of:", "(a) Risk / benefit assessment:", "(b) Ethics committee review and communications (c) Informed consent process (d) Statement of subject confidentiality including ownership of data and coding procedures. 12. Study monitoring and supervision:", "A description of study monitoring policies and procedures should be provided along with the proposed frequency of site monitoring visits, and who is expected to perform monitoring.", "Case Record Form (CRF) completion requirements, including who gets which copies of the forms and any specific required in filling out the forms Case Record Form correction requirements, including who is authorized to make corrections on the Case Record Form and how queries about study data are handled and how errors, if any, are to be corrected should be stated. Investigator study files, including what needs to be stored following study completion should be described.", "13. Investigational Product Management:", "(a) Give investigational product description and packaging (stating all ingredients and the formulation of the investigational drug and any placebos used in the study).", "(b) The precise dosing required during the study.", "(c) Method of packaging, labelling, and blinding of study substances.", "(d) Method of assigning treatments to subjects and the subject identification code numbering system.", "(e) Storage conditions for study substances.", "(f) Investigational product accountability: Describe instructions for the receipt, storage, dispensation, and return of the investigational products to ensure a complete accounting of all investigational products received, dispensed, and returned or destroyed.", "(g) Describe policy and procedure for handling unused investigational products.", "14. Data Analysis: Provide details of the statistical approach to be followed including sample size, how the sample size was determined, including assumptions made in making this determination, efficacy endpoints (primary as well as secondary) and safety endpoints.", "Statistical analysis : Give complete details of how the results will be analysed and reported along with the description of statistical tests to be used to analyse the primary and secondary endpoints defined above. Describe the level of significance, statistical tests to be used, and the methods used for missing data; method of evaluation of the data for treatment failures, non-compliance, and Subject withdrawals; rationale and conditions for any interim analysis if planned.", "Describe statistical considerations for Pharmacokinetic (PK) analysis, if applicable.", "15. Undertaking by the Investigator (see Table 4)", "16. Appendices: Provide a study synopsis, copies of the informed consent documents (patient information sheet, informed consent form etc.); Case Record Form (CRF) and other data collection forms; a summary of relevant preclinical safety information and any other documents referenced in the clinical protocol.", "TABLE 3 INFORMED CONSENT 1. Checklist of informed consent documents for clinical trial subject,—", "1.1 Essential elements:", "(i) Statement that the study involves research and explanation of the purpose of the research.", "(ii) Expected duration of the participation of subject.", "(iii) Description of the procedures to be followed, including all invasive procedures.", "(iv) Description of any reasonably foreseeable risks or discomforts to the Subject.", "(v) Description of any benefits to the Subject or others reasonably expected from research. If no benefit is expected Subject should be made aware of this.", "(vi) Disclosure of specific appropriate alternative procedures or therapies available to the Subject.", "(vii) Statement describing the extent to which confidentiality of records identifying the Subject will be maintained and who will have access to Subject's medical records.", "(viii) Trial treatment schedule and the probability for random assignment to each treatment (for randomized trials).", "(ix) Statement describing the financial compensation and the medical management as under:", "(a) In case of an injury occurring to the subject during the clinical trial, free medical management shall be given as long as required or till such time it is established that the injury is not related to the clinical trial, whichever is earlier.", "(b) In the event of a trial related injury or death, the sponsor or his representative or the investigator or centre, as the case may be, in accordance with the rule 39, as the case may be, shall provide financial compensation for the injury or death.", "(x) An explanation about whom to contact for trial related queries, rights of Subjects and in the event of any injury.", "(xi) The anticipated prorated payment, if any, to the subject for participating in the trial.", "(xii) Responsibilities of subject on participation in the trial.", "(xiii) Statement that participation is voluntary, that the subject can withdraw from the study at any time and that refusal to participate will not involve any penalty or loss of benefits to which the subject is otherwise entitled.", "(xiv) Statement that there is a possibility of failure of investigational product to provide intended therapeutic effect.", "(xv) Statement that in the case of placebo controlled trial, the placebo administered to the subjects shall not have any therapeutic effect.", "(xvi) Any other pertinent information.", "1.2 Additional elements, which may be required:", "(a) Statement of foreseeable circumstances under which the participation of the subject may be terminated by the Investigator without his or her consent.", "(b) Additional costs to the subject that may result from participation in the study.", "(c) The consequences of a Subject's decision to withdraw from the research and procedures for orderly termination of participation by Subject.", "(d) Statement that the Subject or Subject's representative will be notified in a timely manner if significant new findings develop during the course of the research which may affect the Subject's willingness to continue participation will be provided.", "(e) A statement that the particular treatment or procedure may involve risks to the Subject (or to the embryo or foetus, if the Subject is or may become pregnant), which are currently unforeseeable.", "(f) Approximate number of Subjects enrolled in the study.", "2. Format of informed consent form for Subjects participating in a clinical trial—", "Informed Consent form to participate in a clinical trial", "Study Title:", "Study Number: Subject's Initials:................................... Subject's Name:........................", "Date of Birth/ Age:..................................", "Address of the Subject............................", "Qualification.............................................", "Occupation: Student or Self-Employed or Service or Housewife or Others (Please click as appropriate).", "Annual Income of the subject:", "Name and address of the nominees and his relation to the subject (for the purpose of compensation in case of trial related death).", "Place Initial box (Subject)", "(i) I confirm that I have read and understood the information [ ]", "Sheet dated..............................................for the above", "study and have had the opportunity to ask questions.", "(ii) I understand that my participation in the study is voluntary and [ ]", "that I am free to withdraw at any time, without giving any reason, without my medical care or legal rights being affected.", "(iii) I understand that the Sponsor of the clinical trial, others working on the Sponsor's behalf, the Ethics Committee and the regulatory authorities will not need my permission to look at my health records both in respect of the current study and any further research that may be conducted in relation to it, even if I withdraw from the trial. I agree to this access. However, I understand that my identity will not be revealed in any information released to third parties or published. [ ]", "(iv) I agree not to restrict the use of any data or results that arise from this study provided such a use is only for scientific purposes. [ ]", "(v) I agree to take part in the above study. [ ] Signature (or Thumb impression) of the Subject/Legally Acceptable Representative:", "Date:..................../........./", "Signatory'sName:.......................................................................................", "Signature of the Investigator:.........................Date:...................../....../", "Study Investigator's Name:.......................................................................", "Signature of the Witness..........................................e:...................../....../", "Name of the Witness:.....................................................................", "Copy of the Patient Information Sheet and duly filled Informed Consent Form shall be handed over to the subject his or her attendant.", "TABLE 4 UNDERTAKING BY THE INVESTIGATOR 1. Full name, address and title of the Principal Investigator (or Investigators when there is no Principal Investigator).", "2. Name and address of the medical college, hospital or other facility where the clinical trial will be conducted:", "Education, training & experience that qualify the Investigator for the clinical trial (Attach details including Medical Council registration number, or any other statements of qualifications).", "3. Name and address of all clinical laboratory facilities to be used in the study.", "4. Name and address of the Ethics Committee that is responsible for approval and continuing review of the study.", "5. Names of the other members of the research team (Co-or sub-investigators) who will be assisting the Investigator in the conduct of the investigations.", "6. Protocol Title and Study number (if any) of the clinical trial to be conducted by the Investigator. 7. Commitments:", "(i) I have reviewed the clinical protocol and agree that it contains all the necessary information to conduct the study. I will not begin the study until all necessary ethics committee and regulatory approvals have been obtained.", "(ii) I agree to conduct the study in accordance with the current protocol. I will not implement any deviation from or changes of the protocol without agreement by the Sponsor and prior review and documented approval or favourable opinion from the ethics committee of the amendment, except where necessary to eliminate an immediate hazard to the trial subject or when the changes involved are only logistical or administrative in nature.", "(iii) I agree to personally conduct or supervise the clinical trial at my site.", "(iv) I agree to inform all trial subject, that the drugs are being used for investigational purposes and I will ensure that the requirements relating to obtaining informed consent and ethics committee review and approval specified in the New Drugs and Clinical Trials Rules, 2019 and Good Clinical Practices Guidelines are met.", "(v) I agree to report to the Sponsor all adverse experiences that occur in the course of the investigation(s) in accordance with the regulatory requirements and Good Clinical Practices Guidelines.", "(vi) I have read and understood the information in the Investigator's brochure, including the potential risks and side effects of the drug.", "(vii) I agree to ensure that all associates, colleagues and employees assisting in the conduct of the study are suitably qualified and experienced and they have been informed about their obligations in meeting their commitments in the trial.", "(viii) I agree to maintain adequate and accurate records and to make those records available for audit or inspection by the Sponsor, ethics committee, Central Licencing Authority or their authorised representatives, in accordance with regulatory provisions and the Good Clinical Practices Guidelines. I will fully cooperate with any study related audit conducted by regulatory officials or authorised representatives of the Sponsor.", "(ix) I agree to promptly report to the ethics committee all changes in the clinical trial activities and all unanticipated problems involving risks to human subjects or others.", "(x) I agree to inform all serious adverse events to the Central Licencing Authority, sponsor as well as the ethics committee within twenty-four hours of their occurrence. In case, of failure to do so, I shall furnish the reason for the delay to the satisfaction of the Central Licencing Authority along with the report of the serious adverse event.", "(xi) The report of the serious adverse event, after due analysis, shall also be forwarded by me to the Central Licencing Authority, the Chairperson of the ethics committee and the Head of the institution where the trial has been conducted within fourteen days in accordance with the regulatory requirements.", "(xii) I will maintain confidentiality of the identification of all participating subjects and assure security and confidentiality of study data.", "(xiii) I agree to comply with all other requirements, guidelines and statutory obligations as applicable to clinical Investigators participating in clinical trials.", "8. Signature of Investigator with date.", "TABLE 5", "DATA ELEMENTS FOR REPORTING SERIOUS ADVERSE EVENTS OCCURRING IN A CLINICAL TRIAL OR BIO AVAILABILITY OR BIOEQUIVALENCE STUDY 1. Patient Details: Initials and other relevant identifier (hospital or out-patient department (OPD) record number etc.)* Gender Age or date of birth Weight Height", "2. Suspected Drug(s):", "Generic name of the drug* Indication(s) for which suspect drug was prescribed or tested. Dosage form and strength. Daily dose and regimen (specify units - e.g., mg, ml, mg /kg). Route of administration. Starting date and time of day. Stopping date and time, or duration of treatment", "3. Other Treatment(s):", "Provide the same information for concomitant drugs (including non-prescription or Over the Counter OTC drugs) and non-drug therapies, as for the suspected drug(s).", "4. Details of Serious Adverse Event:", "Full description of the event including body site and severity, as well as the criterion (or criteria) for considering the report as serious. In addition to a description of the reported signs and symptoms, whenever possible, describe a specific diagnosis for the event*", "Start date (and time) of onset of event.", "Stop date (and time) or duration of event.", "Dechallenge and rechallenge information.", "Setting (e.g., hospital, out-patient clinic, home, nursing home).", "5. Outcome", "Information on recovery and any sequelae; results of specific tests or treatment that may have been conducted.", "For a fatal outcome, cause of death and a comment on its possible relationship to the suspected event; Any post-mortem findings.", "Other information: anything relevant to facilitate assessment of the case, such as medical history including allergy, drug or alcohol abuse; family history; findings from special investigations etc. 6. Details about the Investigator*", "Name and Address", "Telephone number Profession (specialty)", "Date of reporting the event to Central Licencing Authority:", "Date of reporting the event to ethics committee overseeing the site:", "Signature of the Investigator or Sponsor", "Note: Information marked * must be provided.", "TABLE 6 STRUCTURE, CONTENT AND FORMAT FOR CLINICAL TRIAL REPORT 1. Title Page: This page should contain information about the title of the study, the protocol code, name of the investigational product tested, development Phase, indication studied, a brief description of the trial design, the start and end date of patient accrual and the names of the Sponsor and the participating Institutes (Investigators).", "2. Study Synopsis (1 to 2 pages): A brief overview of the study from the protocol development to the trial closure should be given here. This section will only summarise the important conclusions derived from the study.", "3. Statement of compliance with the Good Clinical Practices Guidelines:", "4. List of abbreviations and definitions:", "5. Table of contents:", "6. Ethics Committee: This section should document that the study was conducted in accordance with the ethical principles of Declaration of Helsinki. A detailed description of the Ethics Committee constitution and dates of approvals of trial documents for each of the participating sites should be provided. A declaration should state that Ethics Committee (EC) notifications as per Good Clinical Practice Guidelines and Ethical Guidelines for Biomedical Research on Human Subjects, issued by Indian Council of Medical Research have been followed.", "7. Study Team: Briefly describe the administrative structure of the study (Investigators, site staff, Sponsor or designates, Central laboratory etc.).", "8. Introduction: A brief description of the product development rationale should be given here.", "9. Study Objective: A statement describing the overall purpose of the study and the primary and secondary objectives to be achieved should be mentioned here.", "10. Investigational Plan: This section should describe the overall trial design, the Subject selection criteria, the treatment procedures, blinding or randomisation techniques if any, allowed or disallowed concomitant treatment, the efficacy and safety criteria assessed, the data quality assurance procedures and the statistical methods planned for the analysis of the data obtained.", "11. Trial Subjects: A clear accounting of all trial Subjects who entered the study will be given here. Mention should also be made of all cases that were dropouts or protocol deviations. Enumerate the patients screened, randomised, and prematurely discontinued. State reasons for premature discontinuation of therapy in each applicable case.", "12. Efficacy evaluation: The results of evaluation of all the efficacy variables will be described in this section with appropriate tabular and graphical representation. A brief description of the demographic characteristics of the trial patients should also be provided along with a listing of patients and observations excluded from efficacy analysis.", "13. Safety Evaluation:", "This section should include the complete list", "13.1 all serious adverse events, whether expected or unexpected and", "13.2 unexpected adverse events whether serious or not (compiled from data received as per Table 5 of this Schedule). The comparison of adverse events across study groups may be presented in a tabular or graphical form. This section should also give a brief narrative of all important events considered related to the investigational product.", "14. Discussion and overall Conclusion: Discussion of the important conclusions derived from the trial and scope for further development.", "15. List of References:", "16. Appendices: List of Appendices to the Clinical Study Report", "(a) Protocol and amendments (b) Specimen of Case Record Form (c) Investigators' names with contact addresses, phone, e-mail etc.", "(d) Patient data listings (e) List of trial participants treated with investigational product (f) Discontinued participants (g) Protocol deviations Case Record Forms of cases involving death and life threatening adverse (h) event cases.", "(i) Publications from the trial (j) Important publications referenced in the study (k) Audit certificate, if available Investigator' certificate that he /she has read the report and that the report (l) accurately describes the conduct and the results of the study.", "TABLE 7 INVESTIGATOR'S BROCHURE The Investigator's Brochure should contain the version number, release date along with the following sections, each with literature references where appropriate:", "1. Table of Contents: 2. Summary: A brief summary (preferably not exceeding two pages) should be given, highlighting the significant physical, chemical, pharmaceutical, pharmacological, toxicological, pharmacokinetic, metabolic, and clinical information available that is relevant to the stage of clinical development of the investigational product.", "3. Introduction: A brief introductory statement should be provided that contains the chemical name (and generic and trade name when approved) of the investigational product, all active ingredients, the investigational product pharmacological class and its expected position within this class (e.g. advantages), the rationale for performing research with the investigational product, and the anticipated prophylactic, therapeutic, or diagnostic indication. Finally, the introductory statement should provide the general approach to be followed in evaluating the investigational product.", "4. Physical, Chemical, and Pharmaceutical Properties and Formulation: A description should be provided of the investigational product substance (including the chemical or structural formula), and a brief summary should be given of the relevant physical, chemical, and pharmaceutical properties. To permit appropriate safety measures to be taken in the course of the trial, a description of the formulation to be used, including excipients, should be provided and justified if clinically relevant. Instructions for the storage and handling of the dosage form should also be given. Any structural similarities to other known compounds should be mentioned.", "5. Non-clinical Studies", "5.1 Introduction: The results of all relevant nonclinical pharmacology, toxicology, pharmacokinetic, and investigational product metabolism studies should be provided in summary form. This summary should address the methodology used, the results, and a discussion of the relevance of the findings to the investigated therapeutic and the possible unfavourable and unintended effects in human. The information provided may include the following, as appropriate, if known or available:", "• Species tested • Number and sex of animals in each group • Unit dose (e.g., milligram/kilogram (mg /kg)) • Dose interval • Route of administration • Duration of dosing • Information on systemic distribution - Duration of post-exposure follow-up - Results, including the following aspects: - Nature and frequency of pharmacological or toxic effects - Severity or intensity of pharmacological or toxic effects - Time to onset of effects - Reversibility of effects - Duration of effects - Dose response Tabular format or listings should be used whenever possible to enhance the clarity of the presentation. The following sections should discuss the most important findings from the studies, including the dose response of observed effects, the relevance to humans, and any aspects to be studied in humans. If applicable, the effective and non-toxic dose findings in the same animal species should be compared (i.e., the therapeutic index should be discussed). The relevance of this information to the proposed human dosing should be addressed. Whenever possible, comparisons should be made in terms of blood / tissue levels rather than on a mg /kg basis.", "(a) Non-clinical Pharmacology", "A summary of the pharmacological aspects of the investigational product and, where appropriate, its significant metabolites studied in animals, should be included. Such a summary should incorporate studies that assess potential therapeutic activity (e.g. efficacy models, receptor binding, and specificity) as well as those that assess safety (e.g., special studies to assess pharmacological actions other than the intended therapeutic effect(s)).", "(b) Pharmacokinetics and Product Metabolism in Animals:", "A summary of the pharmacokinetics and biological transformation and disposition of the investigational product in all species studied should be given. The discussion of the findings should address the absorption and the local and systemic bioavailability of the investigational product and its metabolites, and their relationship to the pharmacological and toxicological findings in animal species.", "(c) Toxicology: A summary of the toxicological effects found in relevant studies conducted in different animal species should be described under the following headings where appropriate:", "- Single dose - Repeated dose - Carcinogenicity - Special studies (e.g. irritancy and sensitization) - Reproductive toxicity - Genotoxicity (mutagenicity)", "6. Effects in Humans:", "(a) A thorough discussion of the known effects of the investigational products in humans should be provided, including information on pharmacokinetics, metabolism, pharmacodynamics, dose response, safety, efficacy, and other pharmacological activities. Where possible, a summary of each completed clinical trial should be provided. Information should also be provided regarding results of any use of the investigational products other than from in clinical trials, such as from experience during marketing.", "(b) Pharmacokinetics and Product Metabolism in Humans:", "A summary of information on the pharmacokinetics of the investigational products should be presented, including the following, if available:", "- Pharmacokinetics (including metabolism, as appropriate, and absorption, plasma protein binding, distribution, and elimination).", "- Bioavailability of the investigational product (absolute, where possible, or relative) using a reference dosage form.", "- Population subgroups (e.g., gender, age, and impaired organ function).", "- Interactions (e.g., product-product interactions and effects of food).", "- Other pharmacokinetic data (e.g., results of population studies performed within clinical trial(s).", "(c) Safety and Efficacy: A summary of information should be provided about the investigational product's or products' (including metabolites, where appropriate) safety, pharmacodynamics, efficacy, and dose response that were obtained from preceding trials in humans (healthy volunteers or patients). The implications of this information should be discussed. In cases where a number of clinical trials have been completed, the use of summaries of safety and efficacy across multiple trials by indications in sub-groups may provide a clear presentation of the data. Tabular summaries of adverse drug reactions for all the clinical trials (including those for all the studied indications) would be useful. Important differences in adverse drug reaction patterns / incidences across indications or sub-groups should be discussed. The Investigators Brochure IB should provide a description of the possible risks and adverse drug reactions to be anticipated on the basis of prior experiences with the product under investigation and with related products. A description should also be provided of the precautions or special monitoring to be done as part of the investigational use of the products.", "(d) Marketing Experience:", "The Investigator's Brochure should identify countries where the investigational product has been marketed or approved. Any significant information arising from the marketed use should be summarised (e.g., formulations, dosages, routes of administration, and adverse product reactions). The Investigator's Brochure should also identify all the countries where the investigational product did not receive approval or registration for marketing or was withdrawn from marketing or registration.", "7. Summary of Data and Guidance for the Investigator: This section should provide an overall discussion of the non-clinical and clinical data, and should summarise the information from various sources on different aspects of the investigational products, wherever possible. In this way, the investigator can be provided with the most informative interpretation of the available data and with an assessment of the implications of the information for future clinical trials. Where appropriate, the published reports on related products should be discussed. This could help the investigator to anticipate adverse drug reactions or other problems in clinical trials. The overall aim of this section is to provide the investigator with a clear understanding of the possible risks and adverse reactions, and of the specific tests, observations, and precautions that may be needed for a clinical trial. This understanding should be based on the available physical, chemical, pharmaceutical, pharmacological, toxicological, and clinical information on the investigational products. Guidance should also be provided to the clinical investigator on the recognition and treatment of possible overdose and adverse drug a reaction that is based on previous human experience and on the pharmacology of the investigational product.", "TABLE 8 PRESCRIBING INFORMATION 1. Generic Name", "2. Qualitative and quantitative composition", "3. Dosage form and strength", "4. Clinical particulars", "4.1 Therapeutic indication 4.2 Posology and method of administration 4.3 Contraindications 4.4 Special warnings and precautions for use 4.5 Drugs interactions Use in special populations (such as pregnant women, lactating women, 4.6 paediatric patients, geriatric patients etc.) 4.7 Effects on ability to drive and use machines 4.8 Undesirable effects 4.9 Overdose", "5. Pharmacological properties 5.1 Mechanism of Action 5.2 Pharmacodynamicproperties 5.3 Pharmacokinetic properties 6. Nonclinical properties 6.1 Animal Toxicology or Pharmacology 7. Description 8. Pharmaceutical particulars 8.1 Incompatibilities 8.2 Shelf-life 8.3 Packaging information 8.4 Storage and handing instructions 9. Patient Counselling Information 10. Details of manufacturer 11. Details of permission or licence number with date 12. Date of revision"]}, {"id": "fourth", "name": "Fourth Schedule", "paras": ["1. General Principles", "(1) Bioavailability or Bioequivalence focus on the release of an active drug from its dosage form and subsequent absorption into the systemic circulation. Bioavailability or Bioequivalence study of a pharmaceutical formulation is one of the components to ensure efficacy and safety of pharmaceutical product.", "(2) Bioavailability can be generally documented by a systemic exposure profile obtained by measuring drug or metabolite concentration in the systemic circulation overtime.", "(3) Bioequivalence study is conducted to ensure therapeutic equivalence between two pharmaceutically equivalent test product and a reference product.", "(4) Bioavailability or Bioequivalence study is conducted to ensure therapeutic equivalence between an approved new drug formulation and reference product for subsequent applicant.", "(5) Bioavailability or Bioequivalence study is also conducted to ensure therapeutic equivalence at any phase of clinical trial of a new chemical entity for establishing bioequivalence between two products of the chemical entity, which is important for certain pharmaceutical formulation or manufacturing changes occurring during the drug development stages.", "(6) For drugs approved elsewhere in the world and absorbed systemically, bioequivalence with the reference formulation should be carried out wherever applicable. These studies should be conducted under the labelled conditions of administration. Data on the extent of systemic absorption may be required for formulations other than those designed for systemic absorption.", "(7) Evaluation of the effect of food on absorption following oral administration should be carried out. Data from dissolution studies should also be submitted for all solid oral dosage forms.", "(8) Dissolution and bioavailability data submitted with the new drug application must provide information that assures bioequivalence or establishes bioavailability and dosage correlations between the formulations sought to be marketed and those used for clinical trials during clinical development of the product.", "(9) All bioavailability and bioequivalence studies should be conducted according to the Guidelines for Bioavailability and Bioequivalence studies issued by Central Drugs Standard Control Organisation, Ministry of Health and Family Welfare.", "(10) Bioavailability and bioequivalence studies of a new drug or investigational new drug shall be conducted in a bioavailability and bioequivalence study centre registered under rule 47 after obtaining permission from the Central Licencing Authority.", "2. Bioavailability and bioequivalence study centre:", "2.1 The Bioavailability and bioequivalence study centre shall have following facilities for conducting bioavailability and bioequivalence study of any new drug or investigational new drug:", "2.1.1 Legal Identity:", "The organization, conducting the bioavailability or bioequivalence studies, or the parent organization to which it belongs, must be a legally constituted body with appropriate statutory registrations.", "2.1.2 Impartiality, confidentiality, independence and integrity: The organization shall:", "(a) have managerial staff with the authority and the resources needed to discharge their duties.", "(b) have arrangements to ensure that its personnel are free from any commercial, financial and other pressures which might adversely affect the quality of their work.", "(c) be organised in such a way that confidence in its independence of judgment and integrity is maintained at all times.", "(d) have documented policies and procedures, where relevant, to ensure the protection of its sponsors' confidential information and proprietary rights.", "(e) not engage in any activity that may jeopardize the trust in its independence of judgment and integrity.", "(f) have documented policies and procedures for protection of rights, safety and well-being of study subject in consistent with the Provisions of the Drugs and Cosmetics Act and these Rules and Good Clinical Practices Guidelines.", "(g) have documented policies and procedures for scientific integrity including procedures dealing with and reporting possible scientific misconduct.", "2.1.3 Organisation and management: The study centre must include the following:", "(a) An Investigator who has the overall responsibility to provide protection for safety of the study subject. The Investigator(s) should possess appropriate medical qualifications and relevant experience for conducting pharmacokinetic studies.", "(b) The site should have facilities and identified adequately qualified and trained personnel to perform the following functions:", "(i) Clinical Pharmacological Unit (CPU) management (ii) Analytical laboratory management (iii) Data handling and interpretation (iv) Documentation and report preparation (v) Quality assurance of all operations in the centre 2.1.4 Documented Standard Operating Procedures:", "(1) The center shall establish and maintain a quality system appropriate to the type, range and volume of its activities. All operations at the site must be conducted as per the authorised and documented standard operating procedures.", "(2) These documented procedures should be available to the respective personnel for ready reference.", "The procedures covered must include those that ensure compliance with all aspects of provision of the Act and these rules, good clinical practices guidelines and good laboratory practice guidelines.", "(3) A partial list of procedures for which documented standard operating procedures should be available includes:", "(a) maintenance of working standards (pure substances) and respective documentation;", "(b) withdrawal, storage and handling of biological samples;", "(c) maintenance, calibration and validation of instruments;", "(d) managing medical as well as non-medical emergency situations;", "(e) handling of biological fluids;", "(f) managing laboratory hazards;", "(g) disposal procedures for clinical samples and laboratory wastes;", "(h) documentation of clinical pharmacology unit observations, volunteer data and analytical data;", "(i) obtaining informed consent from volunteers;", "(j) volunteer screening and recruitment and management of ineligible volunteers;", "(k) volunteer recycling (using the same volunteer for more than one study;", "(1) randomization code management;", "(m) study subject management at the site (including check-in and check- out procedures);", "(n) recording and reporting protocol deviations;", "(0) recording, reporting and managing scientific misconduct;", "(p) monitoring and quality assurance.", "(4) Wherever possible, disposable (sterile, wherever applicable) medical devices must be used for making subject interventions.", "(5) If services of a laboratory or a facility other than those available at the site (whether within India or outside the country) are to be availed - its or their names, address and specific services to be used should be documented.", "2.1.5 Clinical Pharmacological Unit", "(1) It must have adequate space and facilities to house at least 16 volunteers. Adequate area must be provided for dining and recreation of volunteers, separate from their sleeping area.", "(2) Additional space and facilities should also be provided for the following:", "(a) Office and administrative functions.", "(b) Sample collection and storage.", "(c) Control sample storage.", "(d) Wet chemical laboratory.", "(e) Instrumental Laboratory.", "(f) Library.", "(g) Documentation archival room.", "(h) Facility for washing, cleaning and Toilets.", "(1) Microbiological laboratory (Optional).", "(j) Radio Immuno-Assay room (optional).", "3. Maintenance of Records:", "All records of in-vivo Or in vitro tests conducted on any batch of a new drug product to assure that the product fleets a bioequivalence requirement shall be maintained by the Sponsor for at least five years after the completion of any study or for at least two years after the expiration date of the batch of the new drug product, whichever is later.", "4. Retention of Samples", "(1) All samples of test and reference drug products used in bioavailability or bioequivalence study should be retained by the organisation carrying out the bioavailability or bioequivalence study for a period of five years after the conduct of the study or one year after the expiry of the drug, whichever is later.", "(2) The study sponsor or drug manufacturer should provide to the testing facility batches of the test and reference drug products in such a manner that the reserve samples can be selected randomly.", "(3) This is to ensure that the samples are in fact representative of the batches provided by the study sponsor or drug manufacturer and that they are retained in their original containers. Each reserve sample should consist of a quantity sufficient to carry out twice all the in-vitro and in-vivo tests required during bioavailability or bioequivalence study.", "(4) The reserve sample should be stored under conditions consistent with product labelling and in an area segregated from the area where testing is conducted and with access limited to authorised personnel.", "TABLE 1 DOCUMENT REQUIRED FOR REGISTRATION OF BIO AVAILABILITY AND BIOEQUIVALENCE CENTRE", "(1) Name and address of the organization to be registered along with its telephone no., fax no. and email address.", "(2) Document regarding legal identity of the centre.", "(3) Name and address of the proprietors or partners or directors.", "(4) An organogram of the centre including brief Curriculum Vitae of Key personnel (Refer para 2.1.3 of this Schedule).", "(5) Documents to ensure Impartiality, confidentiality, independence and integrity of the centre. Refer para 2.1.2 of this Schedule.", "(6) List of equipment in the firm.", "(7) List of staff in firm.", "(8) List of Standard Operating Procedures for various activities (refer 2.1.4 of this Schedule).", "(9) Layout of facility.", "(10) Details of Ethics Committee including its registration number.", "(11) Facilities for maintenance of records.", "(12) Details of Retention of samples.", "(13) All major tie ups for ancillary services like ambulance, hospital etc.", "TABLE 2 DATA AND INFORMATION REQUIRED FOR GRANT OF PERMISSION TO CONDUCT BIO AVAILABILITY AND BIOEQUIVALENCE STUDY OF A NEW DRUG OR INVESTIGATIONAL NEW DRUG", "1. Introduction:", "A brief description of the drug and the therapeutic class to which it belongs.", "2. Chemical and pharmaceutical information, Animal pharmacological and toxicological data, Clinical trial data: As per Second Schedule.", "3. Published reports of Pharmacokinetic and Pharmacodynamics studies carried out in healthy subjects or patients demonstrating safety and tolerability of the molecule.", "4. Regulatory status in other countries:", "Countries where the drug is,—", "(a) Marketed.", "(b) Approved.", "(c) Approved as Investigational New Drug.", "(d) Withdrawn, if any, with reasons.", "Restrictions on use, if any, in countries where marketed or approved.", "Free sale certificate or certificate of analysis, as appropriate.", "5. Prescribing information of the new drug in case the drug is approved for marketing in the country or other country.", "6. Undertaking by the Investigator in original duly signed on a company letterhead as per Table 4 of the Third Schedule.", "7. Copy of registration certificate issued by Central Licencing Authority.", "8. Sponsor's Authorisation letter duly signed by the Authorised Signatory on company's letterhead.", "9. The study protocols, informed consent form or patient information sheet along with audio-visual recording system as per requirements of Second Schedule.", "10. Copy of approval of protocol from the Ethics committee, if available. Copy of registration of the Ethics Committee under rule 8 from the Central Licencing Authority.", "11. The study synopsis. 12. Undertaking letter from the sponsor stating that complete medical management in accordance with rule 40 and an undertaking letter from the sponsor stating that compensation in case of study relate injury or death shall be provided in accordance with rule 39.", "13. Certificate of Analysis (COA) of representative batches (both Test and Reference formulations) to be used in the BE study along with dissolution profile in case Oral Solid dosage forms.", "14. For multiple dose BE study adequate supporting safety data and Pharamcokinetics or Pharmacodynamics should be submitted covering the duration of period for which the study has to be conducted. For all injectable, the sub-acute toxicity should be submitted on the Test product of the sponsor, studied in at least two species for minimum 14 days. If regulatory guidance is available provide a copy of the same.", "15. For conducting Bio-Equivalence studies with reference to Cytotoxic drugs, Hormonal preparations, Narcotic and Psychotropic substances and radioactive substances in Healthy Human subjects a Scientific justification with special emphasis on safety of subjects with a proper risk mitigation strategy should be submitted. If regulatory guidance is available provide a copy of the same.", "16. For conducting Bio-Equivalence studies with reference to cytotoxic drugs, Hormonal preparations, Narcotic and Psychotropic substances and radioactive substances in Patients a scientific justification with special emphasis on Safety with a proper Risk Mitigation Strategy should be submitted.", "Note 1: All items may not be applicable to all drugs. For explanation, refer text of this First Schedule, Second Schedule and Third Schedule.", "TABLE 3 DATA AND INFORMATION REQUIRED FOR GRANT OF PERMISSION TO CONDUCT BIOAVAILABILITY AND BIOEQUIVALENCE STUDY OF A NEW DRUG ALREADY APPROVED IN THE COUNTRY", "1. Introduction: A brief description of the drug and the therapeutic class to which it belongs. 2. Chemical and pharmaceutical information - As per Table 2 of Second Schedule", "3. Published reports of Pharmacokinetic and Pharmacodynamics studies carried out in healthy subjects or patients demonstrating safety and tolerability of the molecule.", "4. Prescribing information.", "5. Undertaking by the Investigator in original duly signed on a company letterhead as per Table 4 of Third Schedule.", "6. Copy of registration certificate issued by Central Licencing Authority.", "7. Sponsor's authorisation letter duly signed by the Authorised Signatory on company's letterhead.", "8. The study protocols, Informed Consent Form or Patient Information Sheet along with audio-visual recording system as per requirements of Second Schedule.", "9. Copy of approval of protocol from the Ethics Committee, if available.", "10. Copy of registration of the Ethics Committee under rule 8 from the Central Licencing Authority.", "11. The study synopsis.", "12. Undertaking letter from the sponsor stating that complete medical management in accordance with rule 40 and an undertaking letter from the sponsor stating that compensation in case of study relate injury or death shall be provided in accordance with rule 39.", "13. Certificate of Analysis (COA) of representative batches (both Test and Reference formulations) to be used in the Bio-Equivalence study along with dissolution profile in case Oral Solid dosage forms.", "14. For multiple dose BE study adequate supporting safety data and Pharmacokinetics or Pharmacodynamics should be submitted covering the duration of period for which the study has to be conducted. 15. For all Injectable, the sub-acute toxicity should be submitted on the Test product of the sponsor, studied in at least two species for minimum 14 days. If regulatory guidance is available provide a copy of the same.", "16. For conducting Bio-Equivalence studies with reference to Cytotoxic drugs, Hormonal preparations, Narcotic and Psychotropic substances and radioactive substances in healthy human subjects a Scientific justification with special emphasis on Safety of subjects with a proper risk mitigation strategy should be submitted. If regulatory guidance is available provide a copy of the same.", "17. For conducting Bio-Equivalence studies with reference to cytotoxic drugs, Hormonal preparations, Narcotic and Psychotropic substances and radioactive substances in Patients a scientific justification with special emphasis on Safety with a proper risk mitigation strategy should be submitted."]}, {"id": "fifth", "name": "Fifth Schedule", "paras": ["(1) When a new drug is approved for marketing, assessment of safety and efficacy of the drug are generally based on data from a limited number of patients, many studied under the controlled conditions of randomized trials. Often, high risk patients and patients with concomitant illnesses that require use of other drugs are excluded from clinical trials, and long-term treatment data are limited. Moreover, patients in trials are closely monitored for evidence of adverse events.", "(2) In actual clinical practice, monitoring is less intensive, a broader range of patients are treated (age, co-morbidities, drugs, genetic abnormalities), and events too rare to occur in clinical trials may be observed. Therefore, subsequent to approval of a new drug, the drug shall be closely monitored and post marketing assessment of its benefit-risk profile shall be carried out once it is marketed.", "(3) A person intending to import or manufacture any new drug for sale or distribution shall have a pharmacovigilance system in place for collecting, processing and forwarding the adverse drug reaction report to the Central Licencing Authority emerging from the use of the drug imported or manufactured or marketed by the applicant in the country.", "(4) The pharmacovigilance system shall be managed by qualified and trained personnel and the officer in-charge of collection and processing of data shall be a medical officer or a pharmacist trained in collection and analysis of adverse drug reaction reports.", "(5) Post marketing assessment of new drug may be carried out, in different ways as under:—", "(A) Phase IV (Post marketing) trial—", "Phase IV (Post marketing) trial include additional drug-drug interactions, dose- response or safety studies and trials designed to support use under the approved indications, e.g. mortality or morbidity studies etc. Such trial will be conducted under an approved protocol with defined scientific objectives, inclusion and exclusion criteria, safety efficacy assessment criteria etc. with the new drug under approved conditions for use in approved patient population.", "In such trial the ethical aspects for protection of rights, safety and well-being of the trial subjects shall be followed as per the regulatory provisions including that for compensation in case of clinical trial related injury or death and good clinical practices guidelines.", "In such study, the study drug may be provided to the trial subject free of cost unless otherwise there is specific concern or justification for not providing the drug free of cost, to the satisfaction of the Central Licencing Authority and the ethics committee.", "(B) Post marketing surveillance study or observational or non- interventional study for active surveillance", "Such studies are conducted with a new drug under approved conditions of its use under a protocol approved by Central Licencing Authority with scientific objective. Inclusion or exclusion of subject are decided as per the recommended use as per prescribing information or approved package insert. In such studies the study drugs are the part of treatment of patient in the wisdom of the prescriber included in the protocol. The regulatory provisions and guidelines applicable for clinical trial of a new drug are not applicable in such cases as drugs are already approved for marketing.", "(C) Post marketing surveillance through periodic safety update reports", "As part of post marketing surveillance of new drug the applicant shall furnish periodic safety update reports (PSURs) in accordance with the procedures as follows:", "(i) The applicant shall furnish periodic safety update reports (PSURs) in order to—", "(a) report all relevant new information from appropriate sources;", "(b) relate the data to patient exposure;", "(c) summarise the market authorisation status in different countries and any significant variations related to safety; and", "(d) indicate whether changes shall be made to product information in order to optimise the use of product.", "(ii) Ordinarily all dosage forms and formulations as well as indications for new drugs should be covered in one periodic safety update reports. Within the single periodic safety update reports separate presentations of data for different dosage forms, indications or separate population need to be given.", "(iii) All relevant clinical and non-clinical safety data should cover only the period of the report (interval data). The periodic safety update reports shall be submitted every six months for the first two years after approval of the drug is granted to the applicant. For subsequent two years - the periodic safety update reports need to be submitted annually. Central Licencing Authority may extend the total duration of submission of periodic safety update reports if it is considered necessary in the interest of public health. Periodic safety update reports due for a period must be submitted within thirty calendar days of the last day of the reporting period. However, all cases involving serious unexpected adverse reactions must be reported to the licencing authority within fifteen days of initial receipt of the information by the applicant. If marketing of the new drug is delayed by the applicant after obtaining approval to market, such data will have to be provided on the deferred basis beginning from the time the new drug is marketed.", "(iv) New studies specifically planned or conducted to examine a safety issue should be described in the periodic safety update reports.", "(v) A PSUR should be structured as follows:", "(a) Title Page: The title page of periodic safety update reports should capture the name of the drug; reporting interval; permitted indication of such drug; date of permission of the drug; date of marketing of drug; licencee name and address.", "(b) Introduction: This section of periodic safety update reports should capture the reporting interval; drugs intended use, mode of action, therapeutic class, dose, route of administration, formulation and a brief description of the approved indication and population.", "(c) Current worldwide marketing authorisation status: This section of periodic safety update reports should capture the brief narrative over view including details of countries where the drug is currently approved along with date of first approval, date of marketing and if product was withdrawn in any of the countries with reasons thereof.", "(d) Actions taken in reporting interval for safety reasons: This section of periodic safety update reports should include a description of significant actions related to safety that have been taken during the reporting interval, related to either investigational uses or marketing experience by the licence holder, sponsor of a clinical trial, regulatory authorities, data monitoring committees, or ethics committees.", "(e) Changes to reference safety information: This section of periodic safety update reports should capture any significant changes to the reference safety information within the reporting interval. Such changes might include information relating to contra-indications, warnings, precautions, adverse events, and important findings from ongoing and completed clinical trials and significant non-clinical findings.", "(f) Estimated patient exposure: This section of periodic safety update reports should provide the estimates of the size and nature of the population exposed to the drug. Brief descriptions of the methods used to estimate the subject or patient exposure should be provided,—", "(i) Cumulative and interval subject exposure in clinical trial.", "(ii) Cumulative and interval patient exposure from Marketing Experience from India.", "(iii) Cumulative and interval patient exposure from Marketing Experience from rest of the world.", "(g) Presentation of individual case histories: This section of periodic safety update reports should include the individual case information available to a licence holder and provide brief case narrative, medical history indication treated with suspect drug, causality assessment. Provide following information:", "(i) Reference prescribing information (ii) Individual cases received from India (iii) Individual cases received from rest of the world (iv) Cumulative and interval summary tabulations of serious adverse events from clinical investigations.", "(v) Cumulative and interval summary tabulations from post-marketing data sources.", "(h) Studies: This section of periodic safety update reports should capture the brief summary of clinically important emerging efficacy or effectiveness and safety findings obtained from the licence holder, sponsored clinical trials and published safety studies that became available during the reporting interval of the report which has potential impact on product safety information.", "(i) Summaries of significant safety findings from clinical trials during the reporting period;", "(ii) Findings from non-interventional Studies;", "(iii) Findings from non-Clinical Studies;", "(iv) Findings from literature.", "(i) Other information: This section of periodic safety update reports should include the details about signals and Risk Management Plan in place by licence holder (if any).", "(a) Signal and risk evaluation: In this section licence holder will provide the details of signal and risk identified during the reporting period and evaluation of signals identified during the reporting period.", "(b) Risk management plan: In this section licence holder will provide the brief details of safety concern and necessary action taken by him to mitigate these safety concerns.", "(j) Overall Safety Evaluation: This section of periodic safety update reports should capture the overall safety evaluation of the drug based upon its risk benefit evaluation for approved indication.", "(i) Summary of safety concerns (ii) Benefit evaluation (iii) Benefit risk analysis evaluation", "(k) Conclusion: This section of periodic safety update reports should provide the details on the safety profile of drug and necessary action taken by the licence holder in this regard.", "(1) Appendix: The appendix includes the copy of marketing authorisation in India, copy of prescribing information, line listings with narrative of Individual Case Safety Reports (ICSR)."]}, {"id": "sixth", "name": "Sixth
