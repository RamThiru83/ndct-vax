g the communication from the Ethics Committee referred to in sub-rule (2), examine it and issue necessary clarification, in writing, within thirty working days from the date of receipt of such communication:", "PROVIDED that where the Central Licencing Authority does not send the required communication to such Ethics Committee within thirty working days from the date of receipt of communication from the said Ethics Committee, it shall be presumed that no permission from the Central Licencing Authority is required.", "(4) The approved academic clinical trial shall be conducted in accordance with the approved clinical trial protocol, ethical principles specified in National Ethical Guidelines for Biomedical and Health Research Involving Human Participants, notified by the Indian Council of Medical Research with a view to ensuring protection of rights, safety and well-being of trial subject during conduct of clinical trial of licenced and approved drug or drug formulation for any new indication or new route of administration or new dose or new dosage form for academic research purposes."]}, {"n": 29, "title": "Inspection of premises relating to clinical trial", "chapter": "V", "paras": ["The person or the institution or the organisation permitted to conduct clinical trial under rule 22 in Form CT-06 or rule 23 in Form CT -4A including his representatives and investigator, shall allow any officer authorised by the Central Licencing Authority, who may, if considered necessary, be accompanied by an officer authorised by the State Licencing Authority, to enter the premises and clinical trial site with or without prior notice to inspect, search or seize, any record, statistical result, document, investigational drug and other related material; and reply to queries raised by the inspecting authority in relation to conduct of such clinical trial."]}, {"n": 30, "title": "Suspension or cancellation of permission to conduct clinical trial", "chapter": "V", "paras": ["(1) Where any person or institution or organisation to whom permission has been granted under rule 22 in Form CT-06 or rule 23 in Form CT-4A fails to comply with any provision of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "(i) issue warning in writing describing the deficiency or defect observed during inspection or otherwise, which may affect adversely the right, or well- being of a trial subject or the validity of clinical trial conducted;", "(ii) reject the results of clinical trial;", "(iii) suspend for such period as considered appropriate or cancel the permission granted under rule 22 in Form CT-06 or rule 23 in Form CT-4A;", "(iv) debar the investigator or the sponsor including his representatives to conduct any clinical trial in future for such period as considered appropriate by the Central Licencing Authority.", "(2) Where a person or an institution or an organisation to whom permission has been granted under rule 22 in Form CT- 06 or rule 23 in Form CT-4A or the sponsor is aggrieved by the order of the Central Licencing Authority, the person or the institution or the organisation may, within a period of sixty working days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary, and after affording an opportunity of being heard, pass such order in relation thereto as may be considered appropriate in the facts and circumstances of the case.", "PART B", "BIOAVAILABILITY AND BIOEQUIVALENCE STUDY"]}, {"n": 31, "title": "Bioavailability or bioequivalence study of new drug or investigational new drug", "chapter": "V", "paras": ["(1) No bioavailability or bioequivalence study of any new drug or investigational new drug shall be conducted in human subjects by any person or institution or organisation except in accordance with the provisions of the Act and these rules.", "(2) No person or institution or organisation shall conduct bioavailability or bioequivalence study of a new drug or investigational new drug in human subjects except in accordance with the permission granted by the Central Licencing Authority and without the protocol thereof having been approved by the Ethics Committee registered under rule 8.", "(3) Every person associated with the conduct of bioavailability or bioequivalence study of a new drug or investigational new drug shall follow the general principles and practices as specified in the First Schedule."]}, {"n": 32, "title": "Oversight of bioavailability or bioequivalence study centre", "chapter": "V", "paras": ["The work of every bioavailability or bioequivalence study centre shall be overseen by an Ethics Committee registered under rule 8, before initiation and throughout the duration of the conduct of such study."]}, {"n": 33, "title": "Application for permission to conduct bioavailability or bioequivalence study", "chapter": "V", "paras": ["(1) Any person or institution or organisation which intends to conduct bioavailability or bioequivalence study of a new drug or an investigational new drug in human subjects shall obtain permission for conducting bioavailability or bioequivalence study from the Central Licencing Authority by making an application in Form CT-05.", "(2) An application for grant of permission to conduct bioavailability or bioequivalence study of any new drug or investigational new drug shall be accompanied by a fee as specified in Sixth Schedule and such other information and documents as specified in the Table 2 of the Fourth Schedule:", "PROVIDED that no fee shall be payable for conducting a bioavailability or bioequivalence study by an institution or organisation owned or funded wholly and partially by the Central Government or a State Government."]}, {"n": 34, "title": "Grant of permission to conduct bioavailability or bioequivalence study", "chapter": "V", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-05 and such further enquiry, if any, as may be considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant permission to conduct bioavailability or bioequivalence study for a new drug or investigational new drug in Form CT-07; or if not satisfied reject the application, for reasons to be recorded in writing within a period of ninety working days from the date of receipt of the application in Form CT-05;", "(ii) in case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, the said authority shall inform the applicant of the deficiencies within the stipulated period referred to in clause (i).", "(2) The decision under sub-rule (1) shall be taken within ninety working days.", "<sup>11</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, the permission to conduct bioavailability or bioequivalence study of the new drug or investigational new drug shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to initiate such study in accordance with these rules.]", "<sup>12</sup>[(2A) The applicant who has got deemed approval under the proviso to sub-rule (2) shall, before initiating bioavailability or bioequivalence study of the new drug or investigational new drug, inform the Central Licensing Authority in Form CT-07A and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-07A which shall become part of the official record and shall be called deemed approval of the Central Licensing Authority.]", "(3) The applicant, after being informed as referred to in clause (ii) of sub- rule (1) by the Central Licencing Authority, may,—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority; and", "(ii) where the applicant rectifies such deficiencies and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant permission to conduct bioavailability or bioequivalence study of the new drug or investigational new drug; or if not satisfied, reject the application within a period of ninety working days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty working days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and resubmission of required information and documents.", "(4) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) and sub-rule (3), may file an appeal before the Central Government within forty-five working days from the date of receipt of such decision and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days."]}, {"n": 35, "title": "Conditions of permission for conduct of bioavailability or bioequivalence study", "chapter": "V", "paras": ["The permission granted by the Central Licencing Authority to conduct bioavailability or bioequivalence study under rule 34 shall be subject to following conditions, namely:—", "(i) bioavailability or bioequivalence study at each site shall be initiated after approval of bioavailability or bioequivalence study protocol, as the case may be, and other related documents by the Ethics Committee of that site, registered under rule 8;", "(ii) where a bioavailability or bioequivalence study centre does not have its own Ethics Committee, bioavailability or bioequivalence study at that site may be initiated after obtaining approval of the protocol from the Ethics Committee registered under rule 8:", "PROVIDED that the approving Ethics Committee shall in such case be responsible for the study at the centre:", "PROVIDED FURTHER that both the approving Ethics Committee and the centre, shall be located within the same city or within a radius of fifty kms of the bioavailability or bioequivalence study centre;", "(iii) in case an Ethics Committee of a bioavailability or bioequivalence study centre rejects the approval of the protocol, the details of the same should be submitted to the Central Licensing Authority prior to seeking approval of another Ethics Committee for the protocol for conduct of the bioavailability or bioequivalence study at the same site;", "(iv) the Central Licencing Authority shall be informed about the approval granted by the registered Ethics Committee within a period of 15 working days of the grant of such approval;", "(v) bioavailability or bioequivalence study of new drug or investigational new drug shall be conducted only in the bioavailability or bioequivalence study centre registered with the Central Licencing Authority under rule 47;", "(vi) bioavailability or bioequivalence study of investigational new drug shall be registered with the Clinical Trial Registry of India maintained by the Indian Council of Medical Research before enrolling the first subject for the study;", "(vii) bioavailability or bioequivalence study shall be conducted in accordance with the approved bioavailability or bioequivalence study protocol and other related documents and as per requirements of Good Clinical Practices Guidelines and provisions of these rules;", "(viii) in case of termination of any bioavailability or bioequivalence study, the detailed reasons for such termination shall be communicated to the Central Licencing Authority within thirty working days of such termination;", "(ix) any report of serious adverse event occurring during bioavailability or bioequivalence study to a subject of such study, shall, after due analysis, be forwarded to the Central Licencing Authority, the chairperson of the Ethics Committee and the institute or the centre where the bioavailability or bioequivalence study, as the case may be, has been conducted within fourteen days of its occurrence as per Table 5 of the Third Schedule and in compliance with the procedures as specified in Chapter VI;", "(x) in case of an injury during bioavailability or bioequivalence study to the subject of such study, complete medical management and compensation shall be provided in accordance with the provisions of Chapter VI and details of compensation provided in such cases shall be intimated to the Central Licencing Authority within thirty days of the receipt of order issued in accordance with the provisions of said Chapter;", "(xi) in case of bioavailability or bioequivalence study related death or permanent disability of any subject of such study during the study, compensation shall be provided in accordance with Chapter VI and details of compensation provided in such cases shall be intimated to the Central Licencing Authority within thirty days of receipt of the order issued in accordance with the provisions of said Chapter;", "(xii) the premises of the sponsor including his representatives and bioavailability and bioequivalence study centre shall be open for inspection by officers of the Central Licencing Authority who may be accompanied by officers of the State Licencing Authority or outside experts as authorised by the Central Licencing Authority, to verify compliance of the requirements of these rules and Good Clinical Practices Guidelines, to inspect, search and seize any record, result, document, investigational product, related to bioavailability or bioequivalence study, as the case may be, and furnish reply to the queries raised by the said officer in relation to bioavailability or bioequivalence study;", "(xiii) the bioavailability or bioequivalence study shall be initiated by enrolling the first subject within a period of one year from the date of grant of permission, failing which prior permission from the Central Licencing Authority shall be required."]}, {"n": 36, "title": "Validity period of permission to conduct bioavailability or bioequivalence study", "chapter": "V", "paras": ["(1) The permission to conduct bioavailability or bioequivalence study granted under rule 34 in Form CT-07 shall remain valid for a period of one year from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) In exceptional circumstances, where the Central Licencing Authority is satisfied about the necessity for an extension beyond one year, the said authority may, on the request of the applicant made in writing, extend the period of permission granted for a further period of one year."]}, {"n": 37, "title": "Inspection of premises relating to bioavailability or bioequivalence study", "chapter": "V", "paras": ["The person or the institution or the organisation permitted to conduct bioavailability or bioequivalence study under rule 34 in Form CT-07 including his representatives and investigator, shall allow any officer authorised by the Central Licencing Authority, who may, if considered necessary, be accompanied by an officer authorised by the State Licencing Authority, to enter the premises and bioavailability or bioequivalence study centre with or without prior notice to inspect, search or seize, any record, statistical result, document, investigational drug and other related material and reply to the queries raised by the inspecting authority in relation to conduct of such bioavailability or bioequivalence study."]}, {"n": 38, "title": "Suspension or cancellation of permission to conduct bioavailability or bioequivalence study", "chapter": "V", "paras": ["(1) Where any person or institution or organisation to whom permission has been granted under rule 34 in Form CT-07 fails to comply with any provision of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "(i) issue warning in writing describing the deficiency or defect observed during inspection or otherwise, which may affect adversely the rights, or well- being of a subject enrolled in the study or the validity of bioavailability or bioequivalence study conducted;", "(ii) reject the results of bioavailability or bioequivalence study, as the case may be;", "(iii) suspend for such period as considered appropriate or cancel the permission granted under rule 34 in Form CT-07;", "(iv) debar the investigator or the sponsor including his representatives, to conduct any bioavailability or bioequivalence study in future for such period as considered appropriate by the Central Licencing Authority.", "(2) Where a person or an institution or an organisation to whom permission has been granted under rule 34 in Form CT-07 or the sponsor is aggrieved by the order of the Central Licencing Authority, the person or the institution or the organisation may, within a period of sixty days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary, and after affording an opportunity of being heard, pass such order in relation thereto as may be considered appropriate in the facts and circumstances of the case within a period of sixty days from the date of receipt of the appeal."]}, {"n": 39, "title": "Compensation in case of injury or death in clinical trial or bioavailability or bioequivalence study of new drug or investigational new drug", "chapter": "VI", "paras": ["(1) Where any death of a trial subject occurs during a clinical trial or bioavailability or bioequivalence study, the legal heir of the trial subject shall be provided financial compensation by the sponsor or its representative, who has obtained permission to conduct the clinical trial or bioavailability or bioequivalence study, in accordance with the procedure specified in rule 42.", "(2) Where permanent disability or any other injury occurs to a trial subject during a clinical trial or bioavailability or bioequivalence study, the trial subject shall be provided financial compensation by the sponsor or its representative, who has obtained permission to conduct the clinical trial or bioavailability or bioequivalence study, in accordance with the procedure specified in rule 42.", "(3) The financial compensation referred to in sub-rule (1) or sub-rule (2) shall be in addition to any expenses incurred on medical management of the trial subject.", "(4) In the event of an injury, not being permanent in nature, the quantum of compensation shall be commensurate with the loss of wages of the subject as provided in the Seventh Schedule.", "(5) The sponsor or its representative shall give an undertaking along with the application for clinical trial permission to the Central Licencing Authority to provide compensation in the case of clinical trial related injury or death for which subjects are entitled to compensation.", "(6) Where the sponsor or its representative, who has obtained permission to conduct clinical trial or bioavailability or bioequivalence study, fails to provide financial compensation, as referred to in sub-rule (1) or sub-rule (2), the Central Licencing Authority shall, after affording an opportunity of being heard, by an order in writing, suspend or cancel the clinical trial or bioavailability or bioequivalence study or restrict the sponsor including its representative, who has obtained permission to conduct clinical trial or bioavailability or bioequivalence study, to conduct any further clinical trial or bioavailability or bioequivalence study or take any other action for such period as considered appropriate in the light of the facts and circumstances of the case."]}, {"n": 40, "title": "Medical Management in clinical trial or bioavailability and bioequivalence study of new drug or investigational new drug", "chapter": "VI", "paras": ["(1) Where an injury occurs to any subject during clinical trial or bioavailability and bioequivalence study of a new drug or an investigational new drug, the sponsor, shall provide free medical management to such subject as long as required as per the opinion of investigator or till such time it is established that the injury is not related to the clinical trial or bioavailability or bioequivalence study, as the case may be, whichever is earlier.", "(2) The responsibility for medical management as referred to in sub-rule (1), shall be discharged by the sponsor or the person who has obtained permission from the Central Licencing Authority.", "(3) Where the sponsor or its representative, who has obtained permission to conduct clinical trial or bioavailability or bioequivalence study, fails to provide medical management, as referred to in sub-rule (1), the Central Licensing Authority shall after affording an opportunity of being heard, by an order in writing, suspend or cancel the clinical trial or bioavailability or bioequivalence study or restrict the sponsor including its representative, who has obtained permission to conduct clinical trial or bioavailability or bioequivalence study, to conduct any further clinical trial or bioavailability or bioequivalence study or take any other action for such period as considered appropriate in the light of the facts and circumstances of the case."]}, {"n": 41, "title": "Consideration of injury or death or permanent disability to be related to clinical trial or bioavailability and bioequivalence study", "chapter": "VI", "paras": ["Any injury or death or permanent disability of a trial subject occurring during clinical trial or bioavailability or bioequivalence study due to any of the following reasons shall be considered as clinical trial or bioavailability or bioequivalence study related injury or death or permanent disability, namely:—", "(a) adverse effect of the investigational product;", "(b) violation of the approved protocol, scientific misconduct or negligence by the sponsor or his representative or the investigator leading to serious adverse event;", "(c) failure of investigational product to provide intended therapeutic effect where, the required standard care or rescue medication, though available, was not provided to the subject as per clinical trial protocol;", "(d) not providing the required standard care, though available to the subject as per clinical trial protocol in the placebo controlled trial;", "(e) adverse effects due to concomitant medication excluding standard care, necessitated as part of the approved protocol;", "(f) adverse effect on a child in-utero because of the participation of the parent in the clinical trial;", "(g) any clinical trial procedures involved in the study leading to serious adverse event."]}, {"n": 42, "title": "Procedure for compensation in case of injury or death during clinical trial, bioavailability and bioequivalence study", "chapter": "VI", "paras": ["(1) The investigator shall report all serious adverse events to the Central Licencing Authority, the sponsor or its representative, who has obtained permission from the Central Licencing Authority for conduct of clinical trial or bioavailability or bioequivalence study, as the case may be, and the Ethics Committee that accorded approval to the study protocol, within twenty-four hours of their occurrence; and if the investigator fails to report any serious adverse event within the stipulated period, he shall have to furnish the reasons for delay to the satisfaction of the Central Licencing Authority along with the report of the serious adverse event.", "(2) A case of serious adverse event of death shall be examined in the following manner, namely:—", "(i) the Central Licencing Authority shall constitute an independent expert committee to examine the cases and make its recommendations to the said authority for arriving at the cause of death and quantum of compensation in case of clinical trial related death;", "(ii) the sponsor or its representative and the investigator shall forward their reports on serious adverse event of death after due analysis to the Central Licencing Authority and the head of the institution where the clinical trial or bioavailability or bioequivalence study has been conducted within fourteen days of the knowledge of occurrence of serious adverse event of death;", "(iii) the Ethics Committee for clinical trial shall forward its report on serious adverse event of death after due analysis along with its opinion on the financial compensation, if any, determined in accordance with the formula specified in the Seventh Schedule, to be paid by the said sponsor or its representative, who has obtained permission from the Central Licencing Authority for conduct of clinical trial or bioavailability or bioequivalence study, as the case may be, to the Central Licencing Authority within a period of thirty days of receiving the report of the serious adverse event of death from the investigator;", "(iv) the Central Licencing Authority shall forward the report of the investigator, sponsor or its representative and the Ethics Committee to the Chairperson of the expert committee;", "(v) the expert committee shall examine the report of serious adverse event of death and make its recommendations available to the Central Licencing Authority for the purpose of arriving at the cause of the serious adverse event of death within sixty days from the receipt of the report of the serious adverse event, and the expert committee while examining the event, may take into consideration, the reports of the investigator, sponsor or its representative and the Ethics Committee for clinical trial;", "(vi) in case of clinical trial or the bioavailability or bioequivalence study related death, the expert committee shall also recommend the quantum of compensation, determined in accordance with the formula specified in the Seventh Schedule, to be paid by the sponsor or his representative who has obtained the permission to conduct the clinical trial or the bioavailability or bioequivalence study, as the case may be;", "(vii) the Central Licencing Authority shall consider the recommendations of the expert committee and shall determine the cause of death with regards to the relatedness of the death to the clinical trial or the bioavailability or bioequivalence study, as the case may be;", "(viii) in case of clinical trial or the bioavailability or bioequivalence study related death, the Central Licencing Authority shall, after considering the recommendations of the expert committee, by order, decide the quantum of compensation, determined as per the formula specified in the Seventh Schedule, to be paid by the sponsor or its representative and shall pass orders as deemed necessary within ninety days of the receipt of the report of the serious adverse event;", "(ix) the sponsor or its representative shall pay the compensation in case the serious adverse event of death is related to clinical trial or the bioavailability or bioequivalence study, as specified in the order referred to in clause (viii) of the Central Licencing Authority within thirty days of the receipt of such order.", "(3) Cases of serious adverse events of permanent disability or any other injury other than deaths shall be examined in the following manner, namely:—", "(i) the sponsor or its representative, and the Investigator shall forward their reports on serious adverse event, after due analysis, to the Central Licencing Authority, chairperson of the Ethics Committee for clinical trial and head of the institution where the trial or bioavailability or bioequivalence study has been conducted within fourteen days of the reporting of serious adverse event;", "(ii) the Ethics Committee for clinical trial shall forward its report on serious adverse event of permanent disability or any other injury other than deaths, as the case may be, after due analysis along with its opinion on the financial compensation, if any, determined in accordance with the formula specified in the Seventh Schedule, to be paid by the sponsor or its representative who has obtained permission to conduct clinical trial or the bioavailability or bioequivalence study, as the case may be, within thirty days of receiving the report of the serious adverse event;", "(iii) the Central Licencing Authority shall determine the cause of the injury and pass order as specified in clause (iv), or may constitute an independent expert committee, wherever it considers necessary, to examine such serious adverse events of injury, and such independent expert committee shall recommend to the Central Licencing Authority for the purpose to arrive at the cause of the serious adverse event and also the quantum of compensation, as determined in accordance with formula as specified in the Seventh Schedule in case of clinical trial or bioavailability or bioequivalence study related injury, within a period of sixty days of receipt of the report of the serious adverse event;", "(iv) in case of clinical trial or the bioavailability or bioequivalence study related injury, the Central Licencing Authority shall, by order, decide the quantum of compensation, determined in accordance with the formula specified in the Seventh Schedule, to be paid by the sponsor or his representative who has obtained the permission to conduct the clinical trial or the bioavailability or bioequivalence study, as the case may be, within a period of ninety days of receipt of the report of the serious adverse event;", "(v) the sponsor or its representative, who has obtained permission to conduct the clinical trial or bioavailability or bioequivalence study, as the case may be, shall pay the compensation in case of clinical trial or bioavailability or bioequivalence study related injury, as specified in the order of the Central Licencing Authority referred to in clause (iv) within thirty days of receipt of such order."]}, {"n": 43, "title": "Medical management and compensation for injury or death relating to biomedical and health research overseen by an Ethics Committee for biomedical and health research as referred to in Chapter IV", "chapter": "VI", "paras": ["Notwithstanding anything contained in these rules, medical management and compensation for injury or death relating to biomedical and health research, overseen by an Ethics Committee for clinical trials as referred to in Chapter IV, shall be in accordance with the National Ethical Guidelines for Biomedical and Health Research Involving Human Participants specified by the Indian Council of Medical Research from time to time."]}, {"n": 44, "title": "Registration of bioavailability and bioequivalence study centre", "chapter": "VII", "paras": ["No bioavailability and bioequivalence study centre shall conduct any bioavailability study or bioequivalence study of a new drug or investigational new drug in human subjects except in accordance with the registration granted by the Central Licencing Authority under these rules."]}, {"n": 45, "title": "Application for registration of bioavailability and bioequivalence study centre", "chapter": "VII", "paras": ["(1) Application for registration of any bioavailability and bioequivalence study centre with the Central Licencing Authority shall be made to the said authority in Form CT-08.", "(2) The application under sub-rule (1) shall be accompanied by a fee as specified in the Sixth Schedule and such other information and documents as specified in the Fourth Schedule."]}, {"n": 46, "title": "Inspection of bioavailability and bioequivalence study centre", "chapter": "VII", "paras": ["On receipt of an application under sub-rule (1) of rule 45, any officer authorised by the Central Licencing Authority who may be accompanied by the officers authorised by the State Licencing Authority, may cause an inspection of the bioavailability and bioequivalence study centre to verify the facility of the centre and the capacity of the applicant to comply with the requirements of these rules."]}, {"n": 47, "title": "Grant of registration to bioavailability and bioequivalence study centre", "chapter": "VII", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-08 and such further enquiry, if any, as may be considered necessary, and if satisfied, that the requirements of these rules have been complied with, grant registration to the applicant in Form CT-09 within a period of ninety working days from the date of receipt of its application in Form CT-08; or if not satisfied, reject the application, for reasons to be recorded in writing, from the date the application was made under sub-rule (1) of rule 45.", "(2) In case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same are to be rectified, said authority shall inform the applicant of the deficiencies within the period as provided in sub-rule (1).", "(3) The applicant may, after being informed by the Central Licencing Authority as specified in sub-rule (2),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority; and", "(ii) where the applicant rectifies the deficiency within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant registration to the applicant in Form CT-09 or if not satisfied, reject the application within a period of ninety days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(4) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (3), may file an appeal within forty-five days from the date of receipt of such rejection before the Central Government and that Government may, after such enquiry and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty days."]}, {"n": 48, "title": "Validity period and renewal of registration of bioavailability and bioequivalence centre", "chapter": "VII", "paras": ["(1) The registration granted under rule 47 in Form CT-09 shall remain valid for a period of five years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) The bioavailability or bioequivalence centre shall make an application for renewal of registration in Form CT-08 along with documents as specified in the Fourth Schedule at least ninety days prior to date of expiry of its registration:", "PROVIDED that if the application for renewal of registration is received by the Central Licencing Authority ninety days prior to date of expiry, the registration shall continue to be in force until orders are passed by the said authority on the application.", "(3) The Central Licencing Authority shall, after scrutiny of information enclosed with the application and after taking into account the inspection report, and such further enquiry, if any, as may be considered necessary, if satisfied, that the requirements of these rules,—", "(i) have been complied with, grant registration or renew registration in Form CT-09;", "(ii) have not been complied with, reject the application, for reasons to be recorded in writing, within a period of forty-five days, from the date the application was made under sub-rule (2)."]}, {"n": 49, "title": "Conditions of registration", "chapter": "VII", "paras": ["The registration granted under rule 47 in Form CT-09 shall be subject to following conditions, namely:—", "(i) the centre shall maintain the facilities and adequately qualified and trained personnel as specified in the Fourth Schedule for performing its functions;", "(ii) the centre shall initiate any bioavailability study or bioequivalence study of any new drug or investigational new drug in human subjects after approval of the protocol and other related documents by the Ethics Committee for clinical trial and permission of such study granted by the Central Licencing Authority;", "(iii) where the bioavailability or bioequivalence study centre does not have its own Ethics Committee, bioavailability or bioequivalence study at that site may be initiated after obtaining approval of the protocol from another Ethics Committee for clinical trial registered under rule 8:", "PROVIDED that the approving Ethics Committee accepts the responsibility for the study at the centre and, both the approving Ethics Committee and the centre, are located within the same city or within a radius of fifty kms of the centre;", "(iv) the Central Licencing Authority shall be informed about the approval of the Ethics Committee for clinical trial;", "(v) bioavailability or bioequivalence study of investigational new drug shall be registered with the Clinical Trial Registry of India before enrolling the first subject for the study;", "(vi) study shall be conducted in accordance with the approved protocol and other related documents and as per requirements of Good Clinical Practices Guidelines and provisions of the Act and these rules;", "(vii) in case of termination of any such study prematurely, the detailed reasons for such termination shall be communicated to the Central Licencing Authority immediately;", "(viii) any report of serious adverse event occurring during study to the subject of such study shall, after due analysis, be forwarded to Central Licencing Authority within fourteen days of its occurrence in the format as specified in Table 5 of the Third Schedule and in compliance with the procedures as specified in rule 42;", "(ix) in case of an injury to the study subject during study, the complete medical management and compensation in the case of study related injury shall be provided in accordance with the provisions of Chapter VI and details of compensation paid to the trial subject in such cases shall be intimated to the Central Licencing Authority within thirty days of receipt of the order;", "(x) in case of death, permanent disability, injury other than death and permanent disability, as the case may be, of a study subject, compensation shall be provided in accordance with the provisions of Chapter VI and details of compensation paid to the trial subject or his legal heir, as the case may be, in such cases shall be intimated to the Central Licencing Authority within thirty days of receipt of the order;", "(xi) if there is any change in constitution or ownership of the bioavailability and bioequivalence study centre, the centre shall intimate about the change in writing to the Central Licencing Authority within thirty days of such change;", "(xii) the study centre shall maintain data, records, and other documents related to the conduct of the bioavailability or bioequivalence study for a period of five years after completion of such study or for at least two years after the expiration date of the batch of the new drug or investigational new drug studied, whichever is later;", "(xiii) the bioavailability and bioequivalence study centre shall allow any officer authorized by the Central Licencing Authority who may be accompanied by an officer authorised by State Licencing Authority to enter the premises with or without prior notice, to inspect any record, statistical observation or results or any documents related to bioavailability study and bio-equivalence study and furnish information to the queries raised by such authorised person, in relation to the conduct of the said study;", "(xiv) the Central Licencing Authority may, if considered necessary, impose additional condition, in writing with justification, in respect of specific bioavailability and bioequivalence study regarding the objective, design, subject population, subject eligibility, assessments, conduct and treatment of such specific study."]}, {"n": 50, "title": "Inspection of bioequivalence and bioavailability study centre registered with Central Licencing Authority", "chapter": "VII", "paras": ["The bioavailability and bioequivalence study centre registered by the Central Licencing Authority' under Rule 47 in Form CT-09, including his representatives and investigator, shall allow any officer authorised by the Central Licencing Authority, who may be accompanied by an officer authorised by the State Licencing Authority, to enter the premises of the bioavailability and bioequivalence study centre with or without prior consent, to inspect, search or seize, any record, document, investigational product and other related material and reply to queries raised by the inspecting authority in relation to functioning of the centre."]}, {"n": 51, "title": "Suspension or cancellation of registration of bioavailability and bioequivalence study centre", "chapter": "VII", "paras": ["(1) Where any bioavailability and bioequivalence study centre including his representatives or investigator, fails to comply with any provision of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely: —", "(a) issue warning in writing describing the deficiency or defect observed during inspection or otherwise, which may affect adversely the right or well- being of trial subject or the validity of any study conducted;", "(b) reject the results of the study;", "(c) suspend the conduct of a study;", "(d) suspend for such period as considered appropriate or cancel the registration granted under rule 47 in Form CT-09; and", "(e) debar the centre including its representatives to conduct any bioavailability and bioequivalence study in future for such period as considered appropriate by the Central Licencing Authority.", "(2) Where a bioavailability and bioequivalence study centre registered under Form CT- 09 against whom an order has been made under sub-rule (1) is aggrieved by the order of the Central Licencing Authority, the bioavailability and bioequivalence study centre may within a period of sixty days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as may be considered appropriate in the facts and circumstances of the case."]}, {"n": 52, "title": "Application for permission to manufacture of new drug or investigational new drug for clinical trial or bioavailability and bioequivalence study or for examination, test and analysis", "chapter": "VIII", "paras": ["(1) No person shall manufacture a new drug or an investigational new drug to conduct clinical trial or bioavailability or bioequivalence study or for examination, test and analysis without obtaining permission to manufacture such new drug or investigational new drug from the Central Licencing Authority.", "(2) Any person who intends to manufacture a new drug or an investigational new drug to conduct clinical trial or bioavailability and bioequivalence study or for examination, test and analysis shall make an application in Form CT-10 to the Central Licencing Authority to obtain the permission referred to in sub-rule (1).", "(3) The application referred in sub-rule (2) shall be accompanied with such documents and information as specified in the Fourth Schedule along with fee as specified in the Sixth Schedule."]}, {"n": 53, "title": "Grant of permission to manufacture new drugs or investigational new drugs for clinical trial or bioavailability or bioequivalence study, or for examination, test and analysis", "chapter": "VIII", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-10 and such further enquiry, if any, as may be considered necessary, if satisfied, that the requirements of these rules have been complied with, grant permission to manufacture the new drug or investigational new drug for conduct of clinical trial or bioavailability or bioequivalence study or for examination, test and analysis, as the case may be, the new drug or investigational new drug, in Form CT-11 within a period of ninety working days from the date of receipt of its application in Form CT-10; or if not satisfied that the requirements of these rules have been complied with, reject the application, for reasons to be recorded in writing, within a period of ninety working days from the date the application was made under sub-rule (2) of rule 52.", "<sup>13</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, the permission to manufacture new drugs or investigational new drugs for clinical trial or bioavailability or bioequivalence study or test and analysis shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to manufacture the new drug or investigational new drug for said purposes in accordance with these rules.] (2.) In case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, the said authority shall inform the applicant of the deficiencies within the period specified in sub-rule (1).", "<sup>14</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, the permission to manufacture new drugs or investigational new drugs for clinical trial or bioavailability or bioequivalence study or test and analysis shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to manufacture the new drug or investigational new drug for said purposes in accordance with these rules.]", "<sup>15</sup>[(2A) The applicant who has got deemed approval under the proviso to sub-rule (1) and sub-rule (2) shall, before manufacturing the new drug or investigational new drugs for the said purposes inform the Central Licensing Authority in Form CT-11A and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-11A which shall become part of the official record and shall be called deemed approval of the Central Licensing Authority.]", "(3) The applicant may, after being informed by the Central Licencing Authority as specified in sub-rule (2),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority; and", "(ii) where the applicant rectifies the deficiency within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant permission to manufacture for conduct of clinical trial or bioavailability or bioequivalence study, or for examination, test and analysis, as the case may be, for the new drug or investigational new drug; or if not satisfied, reject the application within a period of ninety working days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority to reconsider the application within a period of sixty working days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(4) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (3), may file an appeal before the Central Government within forty-five days from the date of receipt of such decision and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty days from the date of filing the appeal."]}, {"n": 54, "title": "Validity period of permission to manufacture of new drug or investigational new drugs for clinical trial or bioavailability and bioequivalence study, or for examination, test and analysis", "chapter": "VIII", "paras": ["(1) The permission granted under rule 53 in Form CT-11 shall remain valid for a period of three years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) In exceptional circumstances, where the Central Licencing Authority is satisfied about the necessity and exigency, it may, on the request of the applicant made in writing, by order, and for reasons to be recorded, extend the period of the permission granted for a further period of one year."]}, {"n": 55, "title": "Condition of permission", "chapter": "VIII", "paras": ["The grant of permission under rule 53 in Form CT-11 shall be subject to the following conditions, namely:—", "(i) the permission holder shall make use of new drug manufactured under Form CT-11 only for the purposes of conducting clinical trial or bioavailability and bioequivalence study or for examination, test and analysis and no part of it shall be sold in the market or supplied to any other person or agency or institution or organisation;", "(ii) the permission holder shall manufacture new drugs for the purposes of clinical trial or bioavailability and bioequivalence study or for examination, test and analysis in small quantities in accordance with the provisions of these rules and at places specified in the permission and in accordance with the principles of Good Manufacturing Practices;", "(iii) the permission holder shall keep a record of new drugs manufactured and persons to whom the drugs have been supplied for clinical trial or bioavailability and bioequivalence study or for examination, test and analysis;", "(iv) where new drug manufactured for purposes of clinical trial or bioavailability or bioequivalence study or for examination, test and analysis is left over or remains unused or gets damaged or its specified shelf life has expired or has been found to be of sub-standard quality, the same shall be destroyed and action taken in respect thereof shall be recorded."]}, {"n": 56, "title": "Licence to manufacture new drugs or investigational new drugs for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis under the Drugs and Cosmetics Rules, 1945", "chapter": "VIII", "paras": ["(1) After obtaining permission under rule 53, the person, who intends to manufacture the new drug or investigational new drugs for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis of new drugs or investigational new drugs, shall make an application for grant of licence to manufacture new drug or investigational new drugs in accordance with the provisions of the Act and the Drugs and Cosmetics Rules, 1945.", "(2) The application referred in sub-rule (1) shall be accompanied by the permission under rule 53 in Form CT-11 obtained by the applicant from the Central Licencing Authority to manufacture the new drugs for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis."]}, {"n": 57, "title": "Inspection of new drugs or investigational new drugs manufactured for clinical trial or bioavailability and bioequivalence study or for examination, test and analysis", "chapter": "VIII", "paras": ["The permission holder or the person, to whom new drugs have been supplied for conducting clinical trial or bioavailability and bioequivalence study or for examination, test and analysis, shall allow any officer authorised by the Central Licencing Authority or the State Licencing Authority to enter, the premises where the new drug is being manufactured or stored, with or without prior notice, to inspect such premises and records, investigate the manner in which the drugs are being manufactured or stored or used and to take sample thereof."]}, {"n": 58, "title": "Suspension or cancellation of manufacturing permission for new drug or investigational new drugs", "chapter": "VIII", "paras": ["(1) Subject to provisions of rule 55, where the permission holder, fails to comply with any provision of the Act and these rules, the Central Licencing Authority may, after giving that person an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "(i) suspend the permission for such period as considered appropriate;", "(ii) cancel the permission granted under rule 53 in Form CT-11.", "(2) Where the permission holder whose permission has been suspended or cancelled under sub-rule (1) is aggrieved by an order of the Central Licencing Authority, he may, within sixty days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such order in relation thereto as may be considered appropriate in the facts and circumstances of the case."]}, {"n": 59, "title": "Application for permission to manufacture unapproved active pharmaceutical ingredient for development of pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study", "chapter": "VIII", "paras": ["(1) Where a manufacturer of a pharmaceutical formulation intends to procure active pharmaceutical ingredient, which is not approved under rule 76 or rule 81, for development of formulation and to manufacture batches for test or analysis or clinical trial or bioavailability and bioequivalence study of such formulation, the application for permission to manufacture such drug shall be made to the Central Licencing Authority by the manufacturer of pharmaceutical formulation in Form CT-12 and manufacturer of the active pharmaceutical ingredient in Form CT-13.", "(2) The application under sub-rule (1) shall be accompanied by such other particulars and documents as are specified in Form CT-12 or Form CT-13, as the case may be."]}, {"n": 60, "title": "Grant of permission to manufacture unapproved active pharmaceutical ingredient for development of pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study", "chapter": "VIII", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application under rule 59 in Form CT-12 or CT-13, as the case may be, and such further enquiry, if any, as may be considered necessary:—", "(i) if satisfied, that the requirements of these rules have been complied with, grant the permission to the manufacturer of active pharmaceutical ingredient in Form CT-15 to manufacture the unapproved active pharmaceutical ingredient and to the manufacturer of pharmaceutical formulation in Form CT-14 for development of pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study within ninety working days; or", "(ii) if not satisfied that the requirements of these rules have been complied with, reject the application, for reasons to be recorded in writing, within a period of ninety working days, from the date, the application was made under sub-rule (1) of rule 59; or", "(iii) if the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, the said Authority shall inform the applicant of the deficiencies within the stipulated period referred to in clause (i).", "<sup>16</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, to manufacture unapproved active pharmaceutical ingredient or to manufacture the pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to manufacture the unapproved new drug or its pharmaceutical formulation for said purposes in accordance with these rules.]", "(2) The applicant may, after being informed, by the Central Licencing Authority as referred to in clause (iii) of sub-rule (1),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority;", "(ii) where the applicant rectifies the deficiency, as referred in sub-rule (1), within the period referred to in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant permission to the manufacturer of active pharmaceutical ingredient in Form CT-15 to manufacture the unapproved active pharmaceutical ingredient and to the manufacturer of pharmaceutical formulation in Form CT-14 for development of pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study; or if not satisfied, reject the application within a period of ninety working days reckoned from the day when the required information and documents were provided:", "<sup>17</sup>[Provided that, where no communication has been received from the Central Licensing Authority within the said period of ninety working days, to manufacture unapproved active pharmaceutical ingredient or to manufacture pharmaceutical formulation for test or analysis or clinical trial or bioavailability and bioequivalence study shall be deemed to have been granted by the Central Licensing Authority and such permission shall be deemed to be legally valid for all purposes and the applicant shall be authorised to manufacture the unapproved new drug or its pharmaceutical formulation for said purposes in accordance with these rules:", "Provided further that in case of rejection, the applicant may request the Central Licencing Authority to consider the application within a period of sixty days from the date of such rejection on payment of fee as specified in the Sixth Schedule and submission of required information and documents.]", "<sup>18</sup>[(2A) The applicant who has got deemed approval under the proviso to sub-rule(1) shall, before manufacturing unapproved active pharmaceutical ingredient or its pharmaceutical formulation for the said purposes inform the Central Licensing Authority in Form CT-15A and CT-14A respectively and the Central Licensing Authority shall on the basis of the said information, take on record the Form CT-15A and CT-14A which shall become part of the official record and shall be called deemed approval of the Central Licensing Authority.]", "(3) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (2), may file an appeal before the Central Government within sixty days from the date of receipt of such rejection and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty days from the date of filing the appeal."]}, {"n": 61, "title": "Validity period of the permission to manufacture unapproved active pharmaceutical ingredient and its formulation for test or analysis or clinical trial or bioavailability and bioequivalence study", "chapter": "VIII", "paras": ["(1) The permission granted under rule 60 in Form CT-14 or Form CT-15, as the case may be, shall remain valid for a period of three years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) In exceptional circumstances, where the Central Licencing Authority is satisfied about the necessity and exigency, it may, on the request of the applicant made in writing, by order and for reasons to be recorded, extend the period of permission granted for a further period of one year."]}, {"n": 62, "title": "Suspension or cancellation of permission to manufacture unapproved active pharmaceutical ingredient for development of formulation for test or analysis or clinical trial or bioavailability and bioequivalence study", "chapter": "VIII", "paras": ["(1) Subject to provision of rule 60, where the formulation manufacturer or an active pharmaceutical ingredient manufacturer fails to comply with any provisions of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, take one or more of the following actions, namely:—", "(i) suspend the permission for such period as considered appropriate;", "(ii) cancel the permission granted under rule 60 in Form CT-14 or Form CT-15.", "(2) Where the formulation manufacturer or active pharmaceutical ingredient manufacturer whose permission has been suspended or cancelled under sub-rule (1), is aggrieved by an order of the Central Licencing Authority, such manufacturer may, within forty-five days of the receipt of the order, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such orders in relation thereto as may be considered appropriate in the facts and circumstances of the case."]}, {"n": 63, "title": "Conditions of permission", "chapter": "VIII", "paras": ["The permission granted under rule 60 in Form CT-14 or Form CT-15 shall be subject to following conditions, namely:—", "(i) the manufacturer of pharmaceutical formulation or the active pharmaceutical ingredient shall make use of the unapproved active pharmaceutical ingredient manufactured on the basis of permission issued under rule 60, only for the purposes specified in the said permission, and no part of it shall be sold in the market;", "(ii) the permission holder shall manufacture such active pharmaceutical ingredient or its pharmaceutical formulation for the purposes as specified in permission in accordance with the provisions of these rules and at places referred to in such permission and, in case, the manufacture of such drugs is for clinical trial or bioavailability and bioequivalence study, it should be manufactured in accordance with the principles of Good Manufacturing Practices;", "(iii) the manufacturer of a pharmaceutical formulation and active pharmaceutical ingredient referred to in clause (i), shall keep all necessary records to indicate the quantity of drug procured, manufactured, used, disposed of in any manner and other matters related thereto;", "(iv) where unapproved active pharmaceutical ingredient and pharmaceutical formulation manufactured in accordance with the permission issued under rule 60 is left over or remains, unused or gets damaged or its shelf life has expired or has been found to be of sub- standard quality, the same shall be destroyed and action taken in respect thereof shall be recorded."]}, {"n": 64, "title": "Licence to manufacture unapproved active pharmaceutical ingredient for development of formulation for test or analysis or clinical trial or bioavailability and bioequivalence study under the Drugs Rules, 1945", "chapter": "VIII", "paras": ["(1) After obtaining permission under rule 60, the person intending to manufacture unapproved active pharmaceutical ingredient or pharmaceutical formulation of the new drug or investigational new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis, shall make an application for grant of licence to manufacture unapproved active pharmaceutical ingredient or pharmaceutical formulation for test or analysis or clinical trial or bioavailability in accordance with the provisions of the Act and the Drugs and Cosmetics Rules, 1945.", "(2) The application referred in sub-rule (1) shall be accompanied by the permission granted under rule 60 in Form CT-14 or Form CT-15, as the case may be, obtained by the applicant from the Central Licencing Authority to manufacture unapproved active pharmaceutical ingredient for development of formulation for test or analysis or clinical trial or bioavailability or bioequivalence study."]}, {"n": 65, "title": "Inspection of manufacturer of unapproved active pharmaceutical ingredient; it for development of formulation for test or analysis or clinical trial or bioavailability and bioequivalence study", "chapter": "VIII", "paras": ["The manufacturer of active pharmaceutical ingredient or formulation, referred to in rule 60, shall allow any officer authorised by the Central Licencing Authority or the person authorised by the State Licencing Authority to enter the premises where the unapproved active pharmaceutical ingredient is being manufactured, stored and used, with or without prior notice, to inspect such premises and records, inspect the manner in which the unapproved active pharmaceutical ingredient is being manufactured and stored or used and to take sample thereof."]}, {"n": 66, "title": "Manner of labelling", "chapter": "VIII", "paras": ["(1) Any new drug or investigational new drug manufactured, for the purpose of clinical trial or bioavailability or bioequivalence study, shall be kept in containers bearing labels, indicating the name of the drug or code number, batch or lot number, wherever applicable, date of manufacture, use before date, storage conditions, name of the institution or organisation or the centre where the clinical trial or bioavailability or bioequivalence study is proposed to be conducted, name and address of the manufacturer, and the purpose for which it has been manufactured.", "(2) Where a new drug or an investigational new drug is manufactured by the permission holder on behalf of another person, the permission holder shall indicate on the label of the container of such drug, the name and address of the manufacturer and the person to whom it is being supplied along with the scientific name of such drug, if known, or the reference which shall enable such drug to be identified and the purpose for which it is manufactured.", "(3) No person or manufacturer shall alter, obliterate or deface any inscription or mark made on the container, label or wrapper of any new drug manufactured without permission of the Central Licencing Authority."]}, {"n": 67, "title": "Application for import of new drug or investigational new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis", "chapter": "IX", "paras": ["(1) No person shall import a new drug or any substance relating thereto for conducting clinical trial or bioavailability or bioequivalence study or for examination, test and analysis except in accordance with the licence granted by Central Licencing Authority.", "(2) Any person or institution or organisation who intends to import a new drug or any substance relating thereto for conducting clinical trial or bioavailability or bioequivalence study or for examination, test and analysis shall make an application in Form CT-16 to the Central Licencing Authority.", "(3) The application under sub-rule (2) shall be accompanied by a fees specified in the Sixth Schedule and such other information and documents as specified in Form CT-16."]}, {"n": 68, "title": "Grant of licence for import of new drug or investigational new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis", "chapter": "IX", "paras": ["(1) The Central Licencing Authority may, after scrutiny of the information and documents furnished with the application in Form CT-16 and such further enquiry, if any, as may be considered necessary,—", "(i) if satisfied, that the requirements of these rules have been complied with, grant the licence to import of new drug or investigational new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis in Form CT-17 within a period of ninety days from the date of receipt of its application in Form CT-16;", "(ii) in case, where the Central Licencing Authority considers that there are some deficiencies in the application and the same may be rectified, the said Authority shall inform the applicant of the deficiencies within the stipulated period referred to in clause (i);", "(iii) if not satisfied that the requirements of these rules have been complied with, reject the application, for reasons to be recorded in writing, within a period of ninety days, from the date of the application made under sub-rule (2) of rule 67.", "(2) The applicant may, after being informed, by the Central Licencing Authority as referred to in clause (ii) of sub-rule (1),—", "(i) rectify the deficiencies within a period specified by the Central Licencing Authority;", "(ii) where the applicant rectifies the deficiency, as referred in clause (i) and provides required information and documents, the Central Licencing Authority shall scrutinise the application again and if satisfied, grant licence to import of new drug or investigational new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis; or if not satisfied, reject the application within a period of ninety working days reckoned from the day when the required information and documents were provided:", "PROVIDED that in case of rejection, the applicant may request the Central Licencing Authority, to reconsider the application within a period of sixty days from the date of rejection of the application on payment of fee as specified in the Sixth Schedule and submission of required information and documents.", "(3) An applicant who is aggrieved by the decision of the Central Licencing Authority under sub-rule (1) or sub-rule (2), may file an appeal before the Central Government within sixty days from the date of receipt of such rejection and that Government, may, after such enquiry, and after giving an opportunity of being heard to the appellant, dispose of the appeal within a period of sixty working days."]}, {"n": 69, "title": "Validity period of licence for import of new drugs for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis", "chapter": "IX", "paras": ["(1) The licence granted under rule 68 in Form CT-17 shall remain valid for a period of three years from the date of its issue, unless suspended or cancelled by the Central Licencing Authority.", "(2) In exceptional circumstances, where the Central Licencing Authority is satisfied about the necessity and exigency, it may, on the request of the applicant made in writing, extend the period of the licence granted under rule 68 for a further period of one year."]}, {"n": 70, "title": "Condition of licence", "chapter": "IX", "paras": ["The licence granted under rule 68 in Form CT-17 is subject to the following conditions, namely:—", "(i) it shall be the responsibility of the licence to ensure that the new drug has been manufactured in accordance with the provisions of the Act, these rules and principles of Good Manufacturing Practices;", "(ii) the licence shall make use of a new drug or substance relating thereto imported on the basis of licence granted under rule 68 in Form CT-17 only for the purposes of clinical trial or bioavailability or bioequivalence study or for examination, test and analysis and no part of such new drug or substance relating thereto shall be sold in the market or supplied to any other person or agency or institution or organisation;", "(iii) the licencee shall maintain records of imported new drug or substance relating thereto to indicate the quantity of drug imported, used, disposed of in any manner and other matters related thereto;", "(iv) where the imported new drug or substance relating thereto is left over or remains unused or gets damaged or its specified shelf life has expired or has been found to be of sub-standard quality, the same shall be destroyed and details of action taken in such cases shall be recorded."]}, {"n": 71, "title": "Inspection of imported new drug for clinical trial or the bioavailability or bioequivalence study or for examination, test and analysis", "chapter": "IX", "paras": ["The person licenced to import a new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis shall allow any officer authorised by the Central Licencing Authority to enter the premises where a new drug or substances relating thereto has been manufactured or imported, is stocked or is being used, with or without prior notice, to inspect such premises and records, investigate the manner in which such drug is being stocked or used or to take sample thereof if so required by the Central Licencing Authority or his authorised person."]}, {"n": 72, "title": "Suspension or cancellation of import licence of new drug for clinical trial or bioavailability or bioequivalence study or for examination, test and analysis", "chapter": "IX", "paras": ["(1) Where the person to whom a licence has been granted under rule 68, fails to comply with any provisions of the Act and these rules, the Central Licencing Authority may, after giving an opportunity to show cause and after affording an opportunity of being heard, by an order in writing, suspend or cancel the licence for such period as considered appropriate either wholly or in respect of some of the substances to which the violation relates and direct the imported new drugs to be disposed of in the manner specified in the said order.", "(2) Where the person whose licence has been suspended or cancelled under sub-rule (1), is aggrieved by an order of the Central Licencing Authority, such person may, within a period of forty-five days of the receipt of the order of suspension or cancellation, make an appeal to the Central Government and that Government may, after such enquiry, as deemed necessary and after affording an opportunity of being heard, pass such order in relation thereto as considered appropriate within a period of sixty working days from the date of filing the appeal."]}, {"n": 73, "title": "Manner of labelling", "chapter": "IX", "paras": ["(1) Any new drugs or investigational new drugs imported for the purpose of clinical trial or bioavailability or bioequivalence study or for examination, test and analysis shall be kept in containers bearing labels, indicating the name of the drug or code number, batch or lot number, wherever applicable, date of manufacture, use before date, storage conditions, name of the institution or organisation or the centre where the clinical trial or bioavailability or bioequivalence study or for examination, test and analysis is proposed to be conducted, name and address of the manufacturer, and the purpose for which it has been imported.", "(2) Where a new drug or an investigational new drug is imported by the licencee on behalf of another person, the licencee shall indicate on the label of the container of the such drug, the name and address of the importer and the person to whom it is being supplied along with the scientific name of such drug, if known, or the reference which shall enable such drug to be identified and the purpose for which it is manufactured.", "(3) No person or importer shall alter, obliterate or deface any inscription or mark made on the container, label or wrapper of any new drug imported without permission of the Central Licencing Authority."]}, {"n": 74, "title": "Regulation of new drug", "chapter": "X", "paras": ["No person shall import or manufacture for sale or for distribution any new drug in the form of active pharmaceutical ingredient or pharmaceutical formulation, as the case may be, except in accordance with the provisions of the Act and these rules."]}, {"n": 75, "title": "Application for permission to import new drug for sale or distribution", "chapter": "X", "paras": ["(1) Any person who intends to import new drug in the form of active pharmaceutical ingredient or pharmaceutical formulation, as the case may be, for sale or for distribution in India, shall make an application to obtain a permission from the Central Licencing Authority in Form CT-18 along with a fee as specified in the Sixth Schedule:", "PROVIDED that an application for grant of permission to import a new drug, in the form of active pharmaceutical ingredient which is a new drug not approved earlier, shall be accompanied by an application for grant of permission to manufacture pharmaceutical formulation of that new drug.", "(2) Where a new drug proposed to be marketed by any person is a new drug having unapproved new molecule, the application in Form CT-18 shall be accompanied by data and other particulars including result of local clinical trial as specified in the Second Schedule along with data specified in Table 1 of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(3) Where a new drug is proposed to be marketed which has been approved as a new drug in the country, the application in Form CT-18 shall be accompanied by data and other particulars as specified in the Second Schedule along with data specified in Table 2 of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(4) Where a new drug which is already permitted for certain claims, is now proposed to be marketed by any person for new claims, new indication or new dosage form or new route of administration or new strength, application in Form CT-18 shall be accompanied by data and other particulars including result of local clinical trial as specified in the Second Schedule along with data specified in Table 3 of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(5) In case a new drug which is a fixed dose combination, the application in CT-18 shall be accompanied by data and other particulars including result of local clinical trial, as the case may be, as specified in the Second Schedule along with data specified in Table 1 or Table 2 or Table 3, as the case may be, of the Second Schedule and accompanied with fee as specified in the Sixth Schedule.", "(6) A person intends to market phytopharmaceutical drugs shall make an application in CT-18 to the Central Licencing Authority along with data specified in Table 4 of the Second Schedule and it shall be accompanied with a fee as specified in the Sixth Schedule.", "(7) The local clinical trial may not be required to be submitted along with the application referred to in sub-rule (1) if,—", "(i) the new drug is approved and marketed in countries specified by the Central Licencing Authority under rule 101 and if no major unexpected serious adverse events have been reported; or", "(ii) the application is for import of a new drug for which the Central Licencing Authority had already granted permission to conduct a global clinical trial which is ongoing in India and in the meantime such new drug has been approved for marketing in a country specified under rule 101; and", "(iii) there is no probability or e
